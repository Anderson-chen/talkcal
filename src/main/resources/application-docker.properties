# docker profile：app 跑在容器裡（deploy/compose.yaml 用 SPRING_PROFILES_ACTIVE=docker 打開）。
# 只寫跟 application.properties 不一樣的地方，其餘沿用預設。

# 用 compose 的服務名稱找其他容器，不用 127.0.0.1：
# 容器裡的 127.0.0.1 是「這個容器自己」，模型不在這裡。同一個 compose 的容器在同一個網路上，
# Docker 內建的 DNS 會把服務名稱 llm-chat 解析成那個容器的 IP——容器重建、IP 換了也照樣找得到。
# 埠是容器「內部」的埠（8080/8081），跟有沒有發佈到主機、發佈成幾號無關。
llamacpp.baseUri=http://llm-chat:8080
llamacpp.embeddingBaseUri=http://llm-embedding:8081

# log 印成一行一個 JSON（ECS 格式）而不是給人看的彩色文字：
# Loki 收到後可以用 `| json` 直接拆出 level、logger、message 等欄位來篩，不必寫 regex 去猜格式。
# 本機開發不開，終端機看 JSON 很痛苦——這正是「分環境」的用處。
logging.structured.format.console=ecs

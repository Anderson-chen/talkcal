import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    // 讓 ./gradlew run 能直接啟動組裝根
    id 'application'
    // Spring Boot 只負責「組裝」這件事：把散落的 bean 兜起來、打包成可執行 jar、提供 bootRun。
    // 業務規則一個字都不會碰到它 —— 見 build 檔最後那條 ArchUnit 規則守著這件事。
    id 'org.springframework.boot' version '4.1.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        // 指定編譯用的 JDK 版本，而不是「拿執行 Gradle 的那個 JVM 將就」——
        // 換一台機器、換一個 IDE 都編出同樣的結果。
        // 25 是這台機器上裝的版本（也是 LTS）；程式用到的語法 21 起就支援
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Spring Boot 的 BOM：一次釘住所有 spring-boot-* 與其傳遞依賴的版本，下面就不必寫版號。
    // 用 Gradle 原生的 platform() 吃 BOM，而不是額外掛 io.spring.dependency-management 外掛 ——
    // 後者在 Gradle 9 上會踩到已被移除的 API，platform() 是 Gradle 自己的機制，乾淨。
    // BOM 座標直接取自上面套用的 Boot 外掛版本，不必再寫一次版號，改版只改一個地方。
    implementation platform(SpringBootPlugin.BOM_COORDINATES)

    // web starter：嵌入式 Tomcat + Spring MVC + Jackson（JSON 序列化）。
    // Boot 4 把原本的 starter-web 改名成 starter-webmvc：名字直接講出是哪一套 web 堆疊（對比 webflux），
    // 舊名字還留著但已標為 deprecated。Jackson 也跟著換成 3.x，套件從 com.fasterxml.jackson 搬到 tools.jackson。
    // 這一包讓「第二個 inbound adapter」變成可能 —— 同一個 AskQuestionUseCase，
    // 除了 console 之外，現在也能被一個 @RestController 從 HTTP 那頭呼叫。
    // 它取代（並涵蓋）了原本的 spring-boot-starter，所以不必兩個都寫。
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 跟模型講話交給 Spring AI。它的 BOM 跟 Boot 的分開：Spring AI 自己發版，2.0.x 是對 Boot 4.1 編的。
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    // OpenAI 相容協定的 ChatModel，由 spring.ai.openai.* 自動組裝。
    // llama-server 本來就講 OpenAI 的 /v1/chat/completions，base-url 指過去就好；
    // 哪天換成真的 OpenAI，改的是設定檔，不是程式。
    // 注意底層是官方 openai-java SDK（OkHttp），不走 RestClient：沒有 http.client.requests 指標，
    // 改由 Spring AI 自己的 gen_ai.* 觀測（每次呼叫一個 span，外加 token 用量指標）。
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // 行程和 AI 助理的對話記憶存 PostgreSQL。用 JDBC（JdbcClient）而不是 JPA：
    // 只有兩張表，SQL 自己寫一眼看得懂；JPA 要在 domain 物件上加 @Entity，
    // 或另外維護一套 entity 再對映，對這個大小是多出來的一層。交易用 TransactionTemplate（也在這包裡）。
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    // 資料表的版本控管：src/main/resources/db/migration 底下的 SQL 依檔名順序執行，跑過的會記下來不再跑。
    // app 啟動時自動把資料庫升到最新，換一台機器、清空資料庫重來都不必手動建表。
    // Flyway 對每種資料庫的支援拆成獨立模組，PostgreSQL 要另外加。
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // 打開 /actuator/*：健康檢查、指標等維運用的入口。它自動 instrument 出 HTTP 延遲、
    // JVM、執行緒池等「通用指標」，一行採集程式都不用寫 —— 業務指標才要自己用 Micrometer 埋。
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 把 Micrometer 收集的指標翻成 Prometheus 文字格式，才會有 /actuator/prometheus 這頁
    // 讓 ops/ 的 Alloy 來抓。runtimeOnly：程式碼不 import 它，只在執行期被 actuator 撿去用
    // （版本由上面的 Boot BOM 管，不必寫版號）。
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // trace：每個請求一個 trace id，記下 app 內部和 app → llm-chat 每一段花多久，用 OTLP 推給 ops/ 的 Alloy。
    // 三塊各管一段（跟指標那邊「Micrometer 埋 → registry 翻格式」同一個分工）：
    //   spring-boot-micrometer-tracing-opentelemetry —— Boot 的自動設定：建 tracer、接上 actuator、讀 management.* 屬性
    //   micrometer-tracing-bridge-otel —— 把 Micrometer 的 Observation（Spring 已經替每個 HTTP 請求開好的）
    //       翻成 OpenTelemetry 的 span。程式碼只認 Micrometer，不綁死 OpenTelemetry
    //   opentelemetry-exporter-otlp —— 把 span 用 OTLP 協定送出去
    // 不用 spring-boot-starter-opentelemetry：它還會帶 micrometer-registry-otlp，讓 app 另外「推」一份指標，
    // 跟 Alloy 來「抓」的那份重複。指標維持抓取模式，這裡只要 trace。
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    runtimeOnly 'io.micrometer:micrometer-tracing-bridge-otel'
    runtimeOnly 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Swagger UI + OpenAPI 文件：啟動時掃 @RestController，自動產出 /v3/api-docs（機器讀的 JSON）
    // 與 /swagger-ui.html（人點的頁面）。文件是「從程式長出來」的，路由改了文件跟著改，不會過期。
    // 版號要自己寫：springdoc 不在 Boot 的 BOM 裡。springdoc 的主版號跟著 Boot 走：2.x 配 Boot 3、3.x 配 Boot 4。
    // implementation 而不是 runtimeOnly：controller 要 import 它的 @Operation 等註解來補說明。
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // JUnit 的版本交給上面的 Boot BOM 管（Boot 4 帶的是 JUnit 6）。
    // 原本另外釘了一份 junit-bom 5.x，但兩份 BOM 同時存在時 Gradle 會挑較高的版本，
    // 寫在這裡的版號變成看起來有效、其實沒作用的假資訊，乾脆拿掉。
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // 執行期才需要的啟動器；沒有它 Gradle 找不到測試引擎
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 把架構規則寫成測試。Java 的 package 沒有依賴方向的概念，
    // 少了它「core 不准依賴 adapter」就只是口頭約定，編譯器不會管
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // 為了 @WebMvcTest 與 MockMvc：controller 幾乎每一行都是在跟 Spring 講話
    // （路由、@RequestBody 綁定、@ExceptionHandler），不經過 Spring 測等於沒測。
    // 這一包也會拉進 Mockito、AssertJ、Hamcrest，但專案一律手寫假物件，不用 mock 框架 ——
    // 拉進來只是因為它們是 starter 的傳遞依賴，用不到就當作沒有。
    // （版本由上面的 Boot BOM 管，不必寫版號。）
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 把測試切片拆進各自的模組：@WebMvcTest、@AutoConfigureMockMvc 不再附在 starter-test 裡，
    // 用到哪一層的切片就引哪一層的 test starter，對應 main 的 starter-webmvc。
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 測試裡照樣產生 trace id、但不往外匯出：沒有它的話，起整個容器的測試會一直嘗試送 span 到 localhost:4318。
    // AccessLogTraceIdTest 靠它在不開 ops/ 的情況下驗「access log 帶著 traceId」。
    testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'
}

// 程式與註解都有中文，編碼一定要明寫。
// 不寫的話 javac 會用平台預設，在 Windows 上是 cp950，中文註解會編成亂碼
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// 需要真 llama-server 的整合測試，放在自己的 source set：src/integrationTest/java。
// 用目錄分開而不是用 @Tag 過濾：./gradlew test 只看得到單元測試、保持秒回，
// 要跑整合測試就 ./gradlew integrationTest。
// IntelliJ 認得每個 source set 屬於哪個測試 task，所以在 src/integrationTest 裡按 ▶ 會走 :integrationTest、
// 在 src/test 裡按 ▶ 走 :test —— 單一檔案、整個 package 都照這個分，不必任何 IDE 設定。
testing {
    suites {
        integrationTest(JvmTestSuite) {
            dependencies {
                // 測的是正式程式，所以要看得到 main 的類別
                implementation project()
                // Boot 4 把 TestRestTemplate 搬成獨立模組；只有 ChatApiSystemTest（真的走 HTTP）用得到，
                // 所以只加在這個 suite，不污染單元測試的 classpath
                implementation 'org.springframework.boot:spring-boot-resttestclient'
                // 整合測試要真的 PostgreSQL：Testcontainers 每次測試起一個乾淨的容器，測完丟掉。
                // 不用 H2 這類記憶體資料庫：SQL 方言不同（例如 ON CONFLICT），在 H2 綠燈不代表在 PostgreSQL 會過。
                // spring-boot-testcontainers 讓 @ServiceConnection 自動把容器的連線資訊接進 Spring，不必手寫 URL。
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                implementation 'org.testcontainers:testcontainers-postgresql'
                implementation 'org.testcontainers:testcontainers-junit-jupiter'
            }
            targets.configureEach {
                testTask.configure {
                    // 兩個都要跑時先跑秒回的那個，壞掉的單元測試不必等模型回完才知道
                    shouldRunAfter tasks.named('test')
                    testLogging {
                        events 'passed', 'skipped', 'failed'
                    }
                }
            }
        }
    }
}

configurations {
    // JUnit、Spring Boot Test、BOM 這些跟單元測試一樣，直接沿用而不是再抄一份
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('check') {
    // ./gradlew build 不跑整合測試（要真 server、又慢），但至少要編得過：
    // 否則改了某個方法的簽名，只有整合測試用到的地方壞了也沒人發現，直到下次有人想跑它
    dependsOn tasks.named('integrationTestClasses')
}

application {
    mainClass = 'io.github.andersonchen.talkcal.Application'
}

// 一鍵部署 app 到本機 Docker：./gradlew deployApp
// 趕時間跳過測試用 Gradle 內建的 -x：./gradlew deployApp -x test
//
// 為什麼要先跑測試：Dockerfile 刻意只打包、不跑測試，部署前「先驗過」這件事還沒有 CI 做，
// 先掛在這裡。測試沒改過的話 Gradle 會判定 up-to-date 直接跳過，不會白跑。
// 只動 app：兩顆模型重 build 要十分鐘，不該跟著每次部署；還沒起的話 depends_on 會先把它們拉起來。
tasks.register('deployApp', Exec) {
    group = 'deployment'
    description = '跑測試、build app 映像檔、換掉 deploy/ 的 app 容器，等它 healthy'
    dependsOn tasks.named('test')

    // 用專案目錄推出 deploy/，不寫死絕對路徑：換一台機器、換一個 clone 位置都能跑
    workingDir = layout.projectDirectory.dir('deploy')

    // 等 healthy 的上限（秒）。預設 300，模型第一次載入太慢時：./gradlew deployApp -PdeployWaitTimeout=600
    def waitTimeout = providers.gradleProperty('deployWaitTimeout').orElse('300').get()

    // --build：映像檔有變就重 build；容器的映像檔換了才會被替換，沒變就什麼都不做。
    // --wait：等到 compose 裡的 healthcheck 通過（/actuator/health 回 200）才結束。
    //   沒有它的話，Spring 還在啟動、甚至啟動失敗，這個 task 都會顯示成功。
    //   也因為交給 healthcheck 判斷，這裡不必再寫死主機埠去打一次。
    commandLine 'docker', 'compose', 'up', '-d', '--build', '--wait', '--wait-timeout', waitTimeout, 'app'
}

// 一鍵部署前端到本機 Docker：./gradlew deployWeb
//
// 為什麼不像 deployApp 那樣 dependsOn 什麼：前端的檢查（vue-tsc 型別檢查）寫在 web/Dockerfile 的 npm run build 裡，
// 型別錯映像檔就 build 不出來。Gradle 這邊不必裝 Node、也不必知道 npm 的存在，只負責叫 Docker。
//
// --no-deps：只動 web。不加的話 --build 會沿著 depends_on 把 app 也重 build、換掉——
// 而且是沒跑過測試的 app，繞過了 deployApp 守的那道關。app 沒在跑也照樣部署得上去，
// 只是頁面問問題會拿到 502，先 ./gradlew deployApp 就好。
tasks.register('deployWeb', Exec) {
    group = 'deployment'
    description = 'build 前端映像檔（含型別檢查）、換掉 deploy/ 的 web 容器，等它 healthy'

    workingDir = layout.projectDirectory.dir('deploy')

    // nginx 幾秒就起好，不像 app 要等模型，預設 60 秒就夠
    def waitTimeout = providers.gradleProperty('deployWaitTimeout').orElse('60').get()

    commandLine 'docker', 'compose', 'up', '-d', '--build', '--no-deps', '--wait', '--wait-timeout', waitTimeout, 'web'
}

// 只換兩顆模型：./gradlew deployModels
// 升級 llama.cpp 版本、調 compose 裡的模型參數（-np、--temp…）之後用。
//
// 刻意不放進 deploy：模型很少改，換一次卻很貴——映像檔重 build 約十分鐘，
// 換的期間所有請求都會失敗，直到模型重新載好。部署該是「改了什麼換什麼」，改程式碼不該順便付這個代價。
//
// --no-deps：model-seed 是 depends_on，不帶會跟著重跑一次播種。播種本身會跳過已經在 volume 裡的檔案，
// 但沒理由多跑；模型檔要更新時（換 gguf），先單獨跑 docker compose up model-seed。
tasks.register('deployModels', Exec) {
    group = 'deployment'
    description = '重 build llama-server 映像檔、換掉 deploy/ 的模型容器，等它載好模型（healthy）'

    workingDir = layout.projectDirectory.dir('deploy')

    // 載 5GB 的 Qwen 要時間，預設 600 秒；比 compose 裡 llm-chat 的 start_period（120s）寬鬆得多，
    // 因為這裡還包含映像檔重 build 的時間
    def waitTimeout = providers.gradleProperty('deployWaitTimeout').orElse('600').get()

    commandLine 'docker', 'compose', 'up', '-d', '--build', '--no-deps', '--wait', '--wait-timeout', waitTimeout,
            'llm-chat'
}

// 前後端一起部署：./gradlew deploy
// 順序靠 mustRunAfter 而不是 dependsOn：先換 app 再換 web，但單獨跑 deployWeb 時不會被迫連 app 一起部署
tasks.register('deploy') {
    group = 'deployment'
    description = '依序部署 app 和前端'
    dependsOn 'deployApp', 'deployWeb'
}
tasks.named('deployWeb') { mustRunAfter 'deployApp' }

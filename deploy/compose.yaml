# 這個 stack 是「在本機模擬雲端部署」：把原本用 .bat 跑在 Windows 上的服務，一個一個搬進容器。
# 跟 ops/ 分開：ops/ 是觀測（看別人），這裡是被部署的服務本身（被看的那些）。
#
# 都在容器裡：Qwen3-8B 生成、PostgreSQL、talkcal app，以及前面擋一層的 nginx（web）。
# 要退回去就 `docker compose down`，再點原本的 .bat、./gradlew bootRun。
#
# 容器之間怎麼溝通：同一個 compose 的服務自動在同一個網路（talkcal-deploy_default）上，
# 用服務名稱互相找——app 打 http://llm-chat:8080，不經過主機、不看 ports 發佈成幾號。
#
# 發佈到主機的埠（ports）是給「容器外面」的人用的：
#   8080        —— 模型。沿用原生的埠，這樣本機開發的 ./gradlew bootRun 照樣打得到。
#                  （ops/ 的 Alloy 不靠這個埠：它加入了這組的網路，直接用服務名稱抓。）
#                  代價：跟原生 .bat 搶同樣的埠，起這個之前要先關掉那個視窗。
#   18090       —— 容器裡的 app。刻意不用 8090：8090 留給本機開發的 bootRun，兩個可以同時開著比對。
#   18080       —— 容器裡的前端（nginx）。瀏覽器開這個，/api 由 nginx 轉給 app。

name: talkcal-deploy

# 模型服務和播種共用同一個自己 build 的映像檔（Dockerfile 在 llama-server/，為什麼自己 build 寫在那裡）。
# image 給一個自己的名字：build 完就存成這個名字，之後上雲端就是把它推到 registry。
# tag 把兩個關鍵版本都寫進去，看名字就知道裡面是哪個 llama.cpp、哪個 CUDA。
x-llama-server: &llama-server
  image: talkcal/llama-server:b10964-cuda13.0.1
  build:
    context: ./llama-server

# x- 開頭的頂層欄位 Compose 會直接忽略，專門拿來放「要重複用的片段」。
# &gpu 是 YAML 錨點，下面用 *gpu 引用——GPU 設定集中寫在這裡，之後多一個模型服務也直接引用。
x-gpu: &gpu
  resources:
    reservations:
      devices:
        # 跟 Docker 要 GPU。沒這段，容器裡看不到顯卡，-ngl 99 會靜靜退回 CPU 跑（慢十倍以上）。
        # 雲端 k8s 上對應的是 resources.limits: nvidia.com/gpu: 1。
        #
        # 注意本機跟雲端的差異：Docker Desktop 不切分 GPU，每個容器都看得到整張卡、共用 12GB VRAM。
        # 但 k8s 的 nvidia.com/gpu: 1 是「獨佔一整張」，以後多一個要 GPU 的服務就要多一張卡。
        - driver: nvidia
          count: 1
          capabilities: [gpu]

# app、web 的映像檔共用的版本參數（#25）：值是 cd/apply.sh export 的環境變數。
# 只寫名字不寫值：環境變數沒設時 compose 不傳，改用 Dockerfile 裡 ARG 的預設（local / unknown），預設值只寫在那裡
x-version-args: &version-args
  - APP_VERSION
  - GIT_COMMIT

services:
  # ── 模型播種：把模型從主機的資料夾（MODELS_DIR）複製進 volume（只跑一次就結束）──────
  # 為什麼不讓模型服務直接掛主機資料夾：實測 Windows → WSL2 的檔案通道只有約 20 MB/s，
  # 而 llama.cpp 預設用 mmap 零碎讀取更慢——Qwen 5GB 載了 5 分鐘還卡在 275MB。
  # volume 放在 Docker 自己的 Linux 檔案系統上，讀取快得多。慢的通道只在「第一次複製」時走一遍。
  # （Linux 主機掛資料夾本來就不慢，但走同一條路，三種作業系統的行為才一樣。）
  #
  # 對照雲端：這就是 k8s 的 initContainer —— 主程式啟動前，先把模型從物件儲存（S3/GCS）
  # 拉到本機磁碟（PVC），主程式只讀本機磁碟。這裡的「物件儲存」由 MODELS_DIR 扮演。
  model-seed:
    <<: *llama-server               # 借用同一個映像檔（有 bash、sha256sum），不用多拉一個 image
    container_name: talkcal-model-seed
    # volume 剛建好時擁有者是 root，映像檔預設的 ubuntu 使用者寫不進去，播種這一步用 root。
    # 只有這個跑完就結束的容器是 root，長駐的模型服務還是一般使用者。
    user: root
    entrypoint: ["bash", "-c"]
    # $$ 是 compose 的跳脫：單一個 $ 會被 compose 當成它自己的變數替換。
    command:
      - |
        set -euo pipefail
        # 先確定要用的模型在不在（檔名跟下面 llm-chat 的 -m 同一個）。不擋的話，空資料夾會讓迴圈對著
        # 字面上的 "/seed/*.gguf" 跑，錯誤訊息看不出原因；MODELS_DIR 指錯資料夾也一樣
        need=Qwen3-8B-Q4_K_M.gguf
        if [ ! -f "/seed/$$need" ] && [ ! -f "/models/$$need" ]; then
          echo "MODELS_DIR 裡沒有 $$need：先跑 deploy/models/download.sh，或把 deploy/.env 的 MODELS_DIR 指到放模型的資料夾" >&2
          ls -la /seed >&2
          exit 1
        fi
        shopt -s nullglob
        for src in /seed/*.gguf; do
          name=$$(basename "$$src")
          dst=/models/$$name
          # 已經有、而且大小一樣，就跳過——這讓播種可以每次啟動都跑，只有第一次真的複製
          if [ -f "$$dst" ] && [ "$$(stat -c%s "$$src")" = "$$(stat -c%s "$$dst")" ]; then
            echo "skip  $$name (already in volume)"
            continue
          fi
          echo "copy  $$name ..."
          # 先寫暫存檔再改名：複製到一半被中斷，也不會留下一個「大小不對但名字對」的壞檔
          cp "$$src" "/models/.$$name.tmp"
          # SHA256SUMS 裡有這個檔，就驗證複製出來的內容；沒有的就只能相信來源
          if grep -q " $$name$$" /seed/SHA256SUMS 2>/dev/null; then
            echo "$$(grep " $$name$$" /seed/SHA256SUMS | cut -d' ' -f1)  /models/.$$name.tmp" | sha256sum -c -
          fi
          mv "/models/.$$name.tmp" "$$dst"
        done
        chmod a+r /models/*.gguf
        ls -la /models
    volumes:
      # 來源：唯讀，播種絕不會動到你原本的模型檔。路徑在 deploy/.env（範本 .env.example）。
      # 沒設就拒絕啟動：不設的話 Docker 會在主機上建一個空資料夾掛進來，看起來起得來、其實沒有模型。
      # 用長的寫法：短的 "來源:/seed:ro" 是用冒號切欄位，ci/compose-images.sh 不代換 ${} 時，錯誤訊息裡的冒號會把它切壞
      - type: bind
        source: ${MODELS_DIR:?缺 MODELS_DIR：在 deploy/.env 填放模型檔的資料夾（見 deploy/models/README.md）}
        target: /seed
        read_only: true
      - models:/models
    restart: "no"                   # 跑完就結束是正常的，不要重啟它

  # ── 生成模型：Qwen3-8B ─────────────────────────────────────────
  llm-chat:
    <<: *llama-server
    container_name: talkcal-llm-chat

    # 參數照抄正在跑的 .bat（那才是實際在用的；.claude/launch.json 那份已經跟它分岔了）。
    # 從此這裡是唯一真相：雲端上跑的就是這幾行。
    command:
      - -m
      - /models/Qwen3-8B-Q4_K_M.gguf
      # 容器裡一定要聽 0.0.0.0：.bat 的 127.0.0.1 在容器裡指的是「容器自己」，
      # Docker 轉進來的流量會進不去。要不要對外開，改由下面 ports 那行控制。
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"                # 全部層放 GPU。VRAM 不夠會在啟動 log 看到 fallback 到 CPU
      - -c
      - "32768"
      # 同時處理幾個請求（slot 數）。不帶時 llama.cpp 預設 4；超過的請求在 server 裡排隊，不會被拒。
      - -np
      - "200"
      # 讓所有 slot 共用上面那 32768 的 context。不帶 -np 時 llama.cpp 自動打開它；
      # 一旦明確給了 -np 就變成關，32768 被均分成每個 slot 約 163，助理的系統指示加對話歷史一長就會被截斷。
      - --kv-unified
      - --jinja
      - --reasoning
      - "off"
      - --temp
      - "0.7"
      - --top-k
      - "20"
      - --top-p
      - "0.8"
      - --min-p
      - "0"
      - --metrics           # ops/ 的 Alloy 抓 /metrics 靠這個
      # 刻意不帶 --log-file / --log-prompts-dir：容器的慣例是 log 一律寫 stdout，
      # 由平台（docker logs、雲端的 log 收集器）去收。寫進容器內的檔案，容器一刪就沒了。

    ports:
      # 只綁 127.0.0.1：跟原本 .bat 的 --host 127.0.0.1 一樣，只給本機連，區網的人連不到。
      - "127.0.0.1:8080:8080"

    volumes:
      - models:/models:ro           # 讀 model-seed 播好的 volume；唯讀，模型服務沒理由改模型檔

    depends_on:
      model-seed:
        # 等播種「成功跑完」才啟動。播種失敗（例如 SHA256 對不上）模型服務就不會起來，
        # 不會拿一個壞掉的模型檔去服務請求。
        condition: service_completed_successfully

    deploy: *gpu

    healthcheck:
      # llama-server 的 /health：模型還在載入時回 503，載好才回 200。
      # 這就是雲端的 readiness probe——「程序活著」不等於「能接請求」，載 5GB 模型要一段時間。
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # 載入期間失敗不算數。從 volume 讀很快，但留 2 分鐘寬限給冷啟動（第一次讀、快取還沒熱）。
      start_period: 120s

    restart: unless-stopped

  # ── 行程與 AI 助理的對話記憶 ─────────────────────────────────
  postgres:
    image: postgres:18.6-alpine       # 釘死版本；alpine 版比較小
    container_name: talkcal-postgres
    environment:
      # 密碼從 deploy/.env 來（範本 .env.example，不進 git）；沒設就拒絕啟動，不退回一個寫死的預設值。
      # 只在 volume 第一次初始化時讀，之後要換密碼得進資料庫 ALTER ROLE（見 README）
      POSTGRES_DB: talkcal
      POSTGRES_USER: talkcal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD：cp deploy/.env.example deploy/.env 再填值}
    ports:
      # 給本機 bootRun 的 app 和你自己用 psql / IDE 連。只綁 127.0.0.1，不對區網開放。
      - "127.0.0.1:5432:5432"
    volumes:
      # 資料放具名 volume：容器重建、docker compose down 都不會掉；down -v 才會清掉
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready：資料庫真的能接連線才算 healthy，app 要等它
      test: ["CMD-SHELL", "pg_isready -U talkcal -d talkcal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── 資料庫那一端的指標：postgres_exporter（#32）────────────────────
  # app 的連線池（HikariCP）只看得到「自己這邊」借了幾條；資料庫的上限（max_connections）、
  # 各狀態的連線數（pg_stat_activity：active / idle / idle in transaction）要從資料庫那頭問。
  # PostgreSQL 自己不吐 Prometheus 格式，所以旁邊掛一個 exporter 翻譯，ops/ 的 Alloy 來抓它的 :9187/metrics。
  #
  # 放在 deploy/ 而不是 ops/：它要用 deploy/.env 的 DB_PASSWORD 連資料庫，而且跟著資料庫走——
  # 對照雲端就是跟資料庫同一個 Pod 的 sidecar，或 RDS 換成 CloudWatch / 一台獨立的 exporter。
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: talkcal-postgres-exporter
    command:
      # 關掉逐表統計（pg_stat_user_tables）：它的查詢會算每張表的大小，要對表拿鎖。
      # 實測（#32）有人對 calendar_event 下 ACCESS EXCLUSIVE 鎖（例如 migration 改表）時，這個查詢就卡住，
      # 整次抓取逾時、連 pg_stat_activity 都抓不到 —— 偏偏是資料庫出事、最需要看的時候瞎掉；
      # 而且每 15 秒一次的抓取各開一條新連線卡在那，事故當下反而多吃資料庫的連線。
      # 代價：看不到每張表的 seq scan、dead tuple，要查時直接下 SQL
      - --no-collector.stat_user_tables
    environment:
      DATA_SOURCE_URI: postgres:5432/talkcal?sslmode=disable
      # 先借 app 的帳號：同一個角色看得到彼此在 pg_stat_activity 裡的狀態。
      # 正式環境另開一個只有 pg_monitor 權限的唯讀帳號，exporter 被攻破也改不了資料
      DATA_SOURCE_USER: talkcal
      DATA_SOURCE_PASS: ${DB_PASSWORD:?缺 DB_PASSWORD：cp deploy/.env.example deploy/.env 再填值}
    # 不發佈埠：只有 ops/ 的 Alloy 會來抓，它在這組的網路上直接找 postgres-exporter:9187
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── talkcal app ────────────────────────────────────────────────────
  app:
    # Dockerfile 在 backend/（要看得到 src/ 和 build.gradle），後端自己的東西放一起
    # tag 是版本號（#25）：cd/apply.sh 用 cd/version.sh 算好 APP_VERSION、GIT_COMMIT 再叫 compose，
    # 每個版本一個 tag，機器上留著舊版本的映像檔（之後 #19 rollback 就是換回某個 tag）。
    # 沒經過 apply.sh 直接 docker compose up 時沒有這兩個變數，退回原本的 local / unknown，
    # 容器的 label 也會照實寫 local —— 一看就知道這不是走部署流程上去的
    image: talkcal/app:${APP_VERSION:-local}
    build:
      context: ../backend
      args: *version-args
    container_name: talkcal-app

    environment:
      # 打開 docker profile：application-docker.properties 蓋掉預設值——
      # 模型位址改成服務名稱、log 改成 JSON。本機 bootRun 沒開這個 profile，所以還是 127.0.0.1、彩色文字。
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD：cp deploy/.env.example deploy/.env 再填值}
      # Google、GitHub 登入（#105）：值在 deploy/.env（主機上設了同名的環境變數就以它為準），
      # 沒設就是空的 → 登入頁只有帳密。secret 不寫進這個檔案
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

    ports:
      # 主機的 18090 → 容器的 8090。只綁 127.0.0.1，跟模型一樣不對區網開放。
      # actuator 的 8091（management 埠，#33）故意不發佈：只給同網路的 Alloy 和下面的 healthcheck 用
      - "127.0.0.1:18090:8090"

    depends_on:
      # 模型 healthy（載完、能接請求）才啟動 app。
      # app 啟動時其實不打模型，但這樣第一個請求就不會撞上還在載入的模型。
      llm-chat:
        condition: service_healthy
      # 資料庫要先能連：app 啟動時 Flyway 就會連上去建表，連不上 app 起不來
      postgres:
        condition: service_healthy

    healthcheck:
      # actuator 的 readiness：啟動完成、能接請求才回 200（對應雲端的 readinessProbe）。
      # 打 management 埠 8091，不是 API 的 8090（#33）；為什麼是 readiness 不是 liveness 見 application.properties
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    # 停容器時，送 SIGTERM 之後等多久才送 SIGKILL。預設 10 秒。
    # app 收到 SIGTERM 會等手上的請求做完（最多 2 分鐘，application.properties 的 timeout-per-shutdown-phase），
    # 這裡要比它長，不然 app 還在等，Docker 就先把它殺了。多 30 秒給其他關機步驟（關連線池、JVM 結束）。
    # 代價：遇到很慢的請求時，部署最久會多等 2 分半。
    stop_grace_period: 2m30s

    restart: unless-stopped

  # ── 前端：nginx 送 Vue 靜態檔，並把 /api 轉給 app ──────────────────
  # 瀏覽器只連這一個入口，看到的是同一個來源，app 不必開 CORS。對照雲端：Ingress / CDN 那一層。
  web:
    image: talkcal/web:${APP_VERSION:-local}   # 版本號跟 app 同一組，理由同上
    build:
      context: ../web             # Dockerfile、nginx.conf 都在 web/ 裡，前端自己的東西放一起
      args: *version-args
    container_name: talkcal-web

    ports:
      # 18080：跟 app 的 18090 一樣用 1 開頭標示「容器版」。只綁 127.0.0.1，不對區網開放。
      # app 的 18090 仍然留著：perf/ 的 k6 直接打 app，不想多經過一層 nginx 影響量測。
      - "127.0.0.1:18080:80"

    depends_on:
      # app healthy 才起：nginx 本身不在乎（proxy_pass 等請求來了才連），
      # 但 app 還沒好時打開頁面問一題只會拿到 502，等它好了再開比較不混淆。
      app:
        condition: service_healthy

    healthcheck:
      # 只確認 nginx 本身活著、送得出 index.html；不打 /api，app 的健康由 app 自己的 healthcheck 管
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

    restart: unless-stopped

volumes:
  # 具名 volume：存在 Docker 自己的 Linux 檔案系統上（Windows、macOS 是 Docker Desktop 的 VM），讀取速度遠快於掛載主機資料夾。
  # `docker compose down` 不會刪它（模型不必重新複製）；`down -v` 才會清掉，下次啟動重新播種。
  # 對照雲端：PersistentVolumeClaim。
  models:
  # 對話紀錄。跟模型那個 volume 一樣，down 不刪、down -v 才清
  postgres-data:

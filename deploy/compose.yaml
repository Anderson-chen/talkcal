# 本機用容器執行整套服務：模型、PostgreSQL、歸檔、app、nginx。觀測那組在 ops/，雲端的差異疊在 infra/envs/1-ec2/compose.{ec2,bedrock,gpu}.yaml。
# 服務之間用服務名稱連線（app 呼叫 http://llm-chat:8080），跟下面 ports 發佈成幾號無關。
#
# 發佈到主機的埠都只綁 127.0.0.1：
#   8080        模型。跟原生 llama-server 同一個埠，本機 bootRun 的 app 不用改設定；兩邊不能同時啟動。
#   18090       容器裡的 app。不用 8090：那是本機 bootRun 的，兩個要能同時開著比對。
#   18080       容器裡的前端，/api 由 nginx 轉給 app。
#   9100 / 9101 歸檔的 RustFS（S3 API / 管理頁面）。不用 9000：很多工具預設占用 9000。

name: talkcal-deploy

# 為什麼自己 build 見 llama-server/Dockerfile。tag 寫 llama.cpp 和 CUDA 的版本，改 Dockerfile 的 ARG 時跟著改
x-llama-server: &llama-server
  image: talkcal/llama-server:b10964-cuda13.0.1
  build:
    context: ./llama-server

x-gpu: &gpu
  resources:
    reservations:
      devices:
        # 沒有這段的話容器看不到顯卡，-ngl 99 會直接退回 CPU 執行、不報錯，慢十倍以上。
        # Docker Desktop 不切分 GPU，多個服務共用同一張卡的 12 GB VRAM；換到 k8s 的 nvidia.com/gpu 是一個服務獨佔一張
        - driver: nvidia
          count: 1
          capabilities: [gpu]

# 只寫名字不寫值：cd/apply.sh 沒 export 時 compose 就不傳，用 Dockerfile 裡 ARG 的預設（local / unknown）
x-version-args: &version-args
  - APP_VERSION
  - GIT_COMMIT

services:
  # ── 模型播種：把模型檔從 Windows 資料夾複製進 volume，複製完就結束 ────────────
  # 模型服務直接掛載 C:/llm/models 的話，每次載入都要經過 Windows → WSL2 的檔案通道（約 20 MB/s），
  # llama.cpp 用 mmap 零碎讀又更慢，5 GB 的模型載 5 分鐘還讀不到 300 MB（見 deploy/README.md）。volume 在 WSL2 的檔案系統上，只有第一次複製走慢的通道。
  model-seed:
    <<: *llama-server               # 用模型服務的映像檔：裡面有 bash、sha256sum，不必多拉一個
    container_name: talkcal-model-seed
    # 新建的 volume 擁有者是 root，映像檔預設的 ubuntu 使用者寫不進去
    user: root
    entrypoint: ["bash", "-c"]
    # $$ 是給 compose 的跳脫，寫成單一個 $ 會被 compose 當成自己的變數代換
    command:
      - |
        set -euo pipefail
        for src in /seed/*.gguf; do
          name=$$(basename "$$src")
          dst=/models/$$name
          if [ -f "$$dst" ] && [ "$$(stat -c%s "$$src")" = "$$(stat -c%s "$$dst")" ]; then
            echo "skip  $$name (already in volume)"
            continue
          fi
          echo "copy  $$name ..."
          # 先寫暫存檔再改名：複製到一半被中斷，不會留下名字對、內容不完整的檔案，下次也就不會被當成已經複製過
          cp "$$src" "/models/.$$name.tmp"
          # SHA256SUMS 沒列到的檔案不驗
          if grep -q " $$name$$" /seed/SHA256SUMS 2>/dev/null; then
            echo "$$(grep " $$name$$" /seed/SHA256SUMS | cut -d' ' -f1)  /models/.$$name.tmp" | sha256sum -c -
          fi
          mv "/models/.$$name.tmp" "$$dst"
        done
        chmod a+r /models/*.gguf
        ls -la /models
    volumes:
      - C:/llm/models:/seed:ro
      - models:/models
    restart: "no"

  # ── 生成模型：Qwen3-8B ─────────────────────────────────────────
  llm-chat:
    <<: *llama-server
    container_name: talkcal-llm-chat

    # EC2 用 GPU 執行模型時（compose.gpu.yaml）也是這組參數。本機原生 llama-server 的參數不在 repo 裡（.claude/launch.json 不進 git），例如沒帶 -np
    command:
      - -m
      - /models/Qwen3-8B-Q4_K_M.gguf
      # 監聽 127.0.0.1 的話只收得到容器自己發的請求，Docker 轉進來的請求進不去。對外開不開由 ports 控制
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"                # 全部層放 GPU。VRAM 不夠時啟動 log 會寫退回 CPU
      - -c
      - "32768"
      # slot 數，也就是同時處理幾個請求；超過的在 llama-server 裡排隊，不會被拒。不帶時是 4
      - -np
      - "200"
      # 明確給了 -np 之後 llama.cpp 就不自動共用 context：32768 會被 200 個 slot 均分成每個約 163，
      # 助理的系統指示加對話歷史一長就被截斷。--kv-unified 讓所有 slot 共用整個 context
      - --kv-unified
      - --jinja
      - --reasoning
      - "off"
      - --temp
      - "0.7"
      - --top-k
      - "20"
      - --top-p
      - "0.8"
      - --min-p
      - "0"
      - --metrics           # 開 /metrics 給 ops/ 的 Alloy 抓
      # 不加 --log-file、--log-prompts-dir：log 寫 stdout 才收得到，寫進容器裡的檔案，容器一刪就沒了

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - models:/models:ro

    depends_on:
      model-seed:
        # 播種失敗（例如 SHA256 對不上）就不啟動模型服務，不用壞掉的模型檔產生回覆
        condition: service_completed_successfully

    deploy: *gpu

    healthcheck:
      # /health 在模型載入期間回 503，載完才回 200
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # 冷啟動（第一次讀、快取還沒熱）載 5 GB 的模型要一段時間，這段期間失敗不算數
      start_period: 120s

    restart: unless-stopped

  # ── 行程與 AI 助理的對話記憶 ─────────────────────────────────
  postgres:
    # 為什麼自己 build 見 postgres/Dockerfile。tag 要跟 Dockerfile 的 FROM 一致，Renovate 兩處一起改
    image: talkcal/postgres:18.6-alpine
    build:
      context: ./postgres
    container_name: talkcal-postgres
    environment:
      # 密碼只在 volume 第一次初始化時讀，之後改 .env 不會改到資料庫，要進資料庫 ALTER ROLE（見 README）
      POSTGRES_DB: talkcal
      POSTGRES_USER: talkcal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD：cp deploy/.env.example deploy/.env 再填值}
    ports:
      # 給本機 bootRun 的 app、psql、IDE 連
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkcal -d talkcal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── 資料庫那一端的指標：postgres_exporter ────────────────────────
  # app 的連線池只記錄自己借出幾條連線；max_connections、各狀態的連線數（pg_stat_activity）要查資料庫才拿得到，
  # PostgreSQL 又不輸出 Prometheus 格式，所以加一個 exporter，ops/ 的 Alloy 在這組網路上抓 exporter 的 :9187。
  # 放在 deploy/ 不放 ops/：exporter 跟著資料庫走，postgres 的啟動、停止和換密碼都在這一組
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: talkcal-postgres-exporter
    command:
      # 逐表統計（pg_stat_user_tables）的查詢要對每張表拿鎖。有人對表下 ACCESS EXCLUSIVE 鎖（例如 migration 改表）時
      # 這個查詢會停住等鎖，整次抓取逾時，連 pg_stat_activity 都拿不到；每 15 秒一次的抓取還各占一條連線一直等著。
      # 代價：看不到每張表的 seq scan、dead tuple，要查時直接下 SQL
      - --no-collector.stat_user_tables
    environment:
      DATA_SOURCE_URI: postgres:5432/talkcal?sslmode=disable
      # 用 app 的帳號：同一個角色才看得到 app 那些連線在 pg_stat_activity 裡的狀態。
      # 被攻破時拿到的是能改資料的帳號；要收窄就另開一個只有 pg_monitor 權限的帳號
      DATA_SOURCE_USER: talkcal
      DATA_SOURCE_PASS: ${DB_PASSWORD:?缺 DB_PASSWORD：cp deploy/.env.example deploy/.env 再填值}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── 舊資料的歸檔：S3 相容的物件儲存 ──────────────────────────────
  # app 把舊行程、舊對話壓成 JSON Lines + gzip 放進來，存好才從 PostgreSQL 刪。雲端換成 S3（infra/envs/1-ec2/archive.tf），
  # app 只差 endpoint。用 RustFS：MinIO 不發社群版的映像檔了；整合測試（RustFsContainer）也用這個映像檔
  archive:
    image: rustfs/rustfs:1.0.3
    container_name: talkcal-archive
    environment:
      # app 用同一組帳密連進來
      RUSTFS_ACCESS_KEY: ${ARCHIVE_ACCESS_KEY:?缺 ARCHIVE_ACCESS_KEY：見 deploy/.env.example}
      RUSTFS_SECRET_KEY: ${ARCHIVE_SECRET_KEY:?缺 ARCHIVE_SECRET_KEY：見 deploy/.env.example}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - archive-data:/data
    healthcheck:
      # /health 只代表 process 活著，/health/ready 要儲存和權限都準備好
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 建 bucket，建完就結束。app 的權限不含建 bucket（雲端由 Terraform 建），本機就由這個容器建。
  # 用 RustFS 映像檔裡的 curl 簽 S3 請求，不必多拉 aws-cli。bucket 已經在的話 PUT 也回 200，每次 up 都執行沒關係
  archive-init:
    image: rustfs/rustfs:1.0.3
    container_name: talkcal-archive-init
    entrypoint: ["sh", "-c"]
    command:
      - curl -fsS -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$ARCHIVE_ACCESS_KEY:$$ARCHIVE_SECRET_KEY" http://archive:9000/talkcal-archive && echo "bucket talkcal-archive 準備好了"  # gitleaks:allow 帳密是容器的環境變數，不是寫死的值
    environment:
      ARCHIVE_ACCESS_KEY: ${ARCHIVE_ACCESS_KEY:?缺 ARCHIVE_ACCESS_KEY：見 deploy/.env.example}
      ARCHIVE_SECRET_KEY: ${ARCHIVE_SECRET_KEY:?缺 ARCHIVE_SECRET_KEY：見 deploy/.env.example}
    depends_on:
      archive:
        condition: service_healthy
    restart: "no"

  # ── talkcal app ────────────────────────────────────────────────────
  app:
    # tag 是 cd/apply.sh 算的版本號，機器上留著舊版本的映像檔，退版（cd/rollback.sh）就是換回某個 tag。
    # 直接 docker compose up 時沒有 APP_VERSION，tag 和 label 是 local，看得出不是走部署流程上去的
    image: talkcal/app:${APP_VERSION:-local}
    build:
      context: ../backend
      args: *version-args
    container_name: talkcal-app

    environment:
      # docker profile：application-docker.properties 把模型、資料庫、歸檔、trace 的位址換成服務名稱，log 改成 JSON
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD：cp deploy/.env.example deploy/.env 再填值}
      # 沒設就是空的，那個登入方式不開
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # 歸檔的位址在 application-docker.properties
      ARCHIVE_ACCESS_KEY: ${ARCHIVE_ACCESS_KEY:?缺 ARCHIVE_ACCESS_KEY：見 deploy/.env.example}
      ARCHIVE_SECRET_KEY: ${ARCHIVE_SECRET_KEY:?缺 ARCHIVE_SECRET_KEY：見 deploy/.env.example}

    ports:
      # 不發佈 actuator 的 8091（management 埠）：只給同網路的 Alloy 和下面的 healthcheck 用。
      # 有 nginx 還發佈 18090：perf/ 的 k6 直接呼叫 app，量到的不含 nginx
      - "127.0.0.1:18090:8090"

    depends_on:
      # app 啟動時不呼叫模型，等模型載完是為了第一個請求不會遇到還在載入的模型
      llm-chat:
        condition: service_healthy
      # 啟動時 Flyway 就要連資料庫，連不上的話 app 無法啟動
      postgres:
        condition: service_healthy

    healthcheck:
      # 為什麼看 readiness 不看 liveness 見 application.properties
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    # SIGTERM 之後等多久才 SIGKILL（預設 10 秒）。app 收到 SIGTERM 會等手上的請求做完，最多 2 分鐘
    # （application.properties 的 timeout-per-shutdown-phase），這裡要更長，多的 30 秒給關連線池、JVM 結束。
    # 代價：遇到很慢的請求時，部署最多多等 2 分半
    stop_grace_period: 2m30s

    restart: unless-stopped

  # ── 前端：nginx 送 Vue 靜態檔，並把 /api 轉給 app ──────────────────
  # 瀏覽器只連這個入口，頁面和 /api 同一個來源，app 不必開 CORS
  web:
    image: talkcal/web:${APP_VERSION:-local}   # tag 的規則見 app
    build:
      context: ../web
      args: *version-args
    container_name: talkcal-web

    ports:
      - "127.0.0.1:18080:80"

    depends_on:
      # nginx 本身不需要 app 先啟動（請求來了才連），等 app healthy 是免得頁面先開好、一發問就拿到 502
      app:
        condition: service_healthy

    healthcheck:
      # 只看 nginx 送得出首頁，不呼叫 /api：app 停止回應時，web 不要跟著被判成 unhealthy
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

    restart: unless-stopped

# down 不刪，down -v 才清。models 清掉的話下次啟動要重新播種
volumes:
  models:
  postgres-data:
  archive-data:

# 這個 stack 是「在本機模擬雲端部署」：把原本用 .bat 跑在 Windows 上的服務，一個一個搬進容器。
# 跟 ops/ 分開：ops/ 是觀測（看別人），這裡是被部署的服務本身（被看的那些）。
#
# 都在容器裡：Qwen3-8B 生成、PostgreSQL、eat app，以及前面擋一層的 nginx（web）。
# 要退回去就 `docker compose down`，再點原本的 .bat、./gradlew bootRun。
#
# 容器之間怎麼溝通：同一個 compose 的服務自動在同一個網路（eat-deploy_default）上，
# 用服務名稱互相找——app 打 http://llm-chat:8080，不經過主機、不看 ports 發佈成幾號。
#
# 發佈到主機的埠（ports）是給「容器外面」的人用的：
#   8080        —— 模型。沿用原生的埠，這樣本機開發的 ./gradlew bootRun 照樣打得到。
#                  （ops/ 的 Alloy 不靠這個埠：它加入了這組的網路，直接用服務名稱抓。）
#                  代價：跟原生 .bat 搶同樣的埠，起這個之前要先關掉那個視窗。
#   18090       —— 容器裡的 app。刻意不用 8090：8090 留給本機開發的 bootRun，兩個可以同時開著比對。
#   18080       —— 容器裡的前端（nginx）。瀏覽器開這個，/api 由 nginx 轉給 app。

name: eat-deploy

# 模型服務和播種共用同一個自己 build 的映像檔（Dockerfile 在 llama-server/，為什麼自己 build 寫在那裡）。
# image 給一個自己的名字：build 完就存成這個名字，之後上雲端就是把它推到 registry。
# tag 把兩個關鍵版本都寫進去，看名字就知道裡面是哪個 llama.cpp、哪個 CUDA。
x-llama-server: &llama-server
  image: eat/llama-server:b10964-cuda13.0.1
  build:
    context: ./llama-server

# x- 開頭的頂層欄位 Compose 會直接忽略，專門拿來放「要重複用的片段」。
# &gpu 是 YAML 錨點，下面用 *gpu 引用——GPU 設定集中寫在這裡，之後多一個模型服務也直接引用。
x-gpu: &gpu
  resources:
    reservations:
      devices:
        # 跟 Docker 要 GPU。沒這段，容器裡看不到顯卡，-ngl 99 會靜靜退回 CPU 跑（慢十倍以上）。
        # 雲端 k8s 上對應的是 resources.limits: nvidia.com/gpu: 1。
        #
        # 注意本機跟雲端的差異：Docker Desktop 不切分 GPU，每個容器都看得到整張卡、共用 12GB VRAM。
        # 但 k8s 的 nvidia.com/gpu: 1 是「獨佔一整張」，以後多一個要 GPU 的服務就要多一張卡。
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  # ── 模型播種：把模型從 Windows 資料夾複製進 volume（只跑一次就結束）──────────
  # 為什麼不讓模型服務直接掛 C:/llm/models：實測 Windows → WSL2 的檔案通道只有約 20 MB/s，
  # 而 llama.cpp 預設用 mmap 零碎讀取更慢——Qwen 5GB 載了 5 分鐘還卡在 275MB。
  # volume 放在 WSL2 自己的 Linux 檔案系統上，讀取快得多。慢的通道只在「第一次複製」時走一遍。
  #
  # 對照雲端：這就是 k8s 的 initContainer —— 主程式啟動前，先把模型從物件儲存（S3/GCS）
  # 拉到本機磁碟（PVC），主程式只讀本機磁碟。這裡的「物件儲存」由 C:\llm\models 扮演。
  model-seed:
    <<: *llama-server               # 借用同一個映像檔（有 bash、sha256sum），不用多拉一個 image
    container_name: eat-model-seed
    # volume 剛建好時擁有者是 root，映像檔預設的 ubuntu 使用者寫不進去，播種這一步用 root。
    # 只有這個跑完就結束的容器是 root，長駐的模型服務還是一般使用者。
    user: root
    entrypoint: ["bash", "-c"]
    # $$ 是 compose 的跳脫：單一個 $ 會被 compose 當成它自己的變數替換。
    command:
      - |
        set -euo pipefail
        for src in /seed/*.gguf; do
          name=$$(basename "$$src")
          dst=/models/$$name
          # 已經有、而且大小一樣，就跳過——這讓播種可以每次啟動都跑，只有第一次真的複製
          if [ -f "$$dst" ] && [ "$$(stat -c%s "$$src")" = "$$(stat -c%s "$$dst")" ]; then
            echo "skip  $$name (already in volume)"
            continue
          fi
          echo "copy  $$name ..."
          # 先寫暫存檔再改名：複製到一半被中斷，也不會留下一個「大小不對但名字對」的壞檔
          cp "$$src" "/models/.$$name.tmp"
          # SHA256SUMS 裡有這個檔，就驗證複製出來的內容；沒有的就只能相信來源
          if grep -q " $$name$$" /seed/SHA256SUMS 2>/dev/null; then
            echo "$$(grep " $$name$$" /seed/SHA256SUMS | cut -d' ' -f1)  /models/.$$name.tmp" | sha256sum -c -
          fi
          mv "/models/.$$name.tmp" "$$dst"
        done
        chmod a+r /models/*.gguf
        ls -la /models
    volumes:
      - C:/llm/models:/seed:ro      # 來源：唯讀，播種絕不會動到你原本的模型檔
      - models:/models
    restart: "no"                   # 跑完就結束是正常的，不要重啟它

  # ── 生成模型：Qwen3-8B ─────────────────────────────────────────
  llm-chat:
    <<: *llama-server
    container_name: eat-llm-chat

    # 參數照抄正在跑的 .bat（那才是實際在用的；.claude/launch.json 那份已經跟它分岔了）。
    # 從此這裡是唯一真相：雲端上跑的就是這幾行。
    command:
      - -m
      - /models/Qwen3-8B-Q4_K_M.gguf
      # 容器裡一定要聽 0.0.0.0：.bat 的 127.0.0.1 在容器裡指的是「容器自己」，
      # Docker 轉進來的流量會進不去。要不要對外開，改由下面 ports 那行控制。
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"                # 全部層放 GPU。VRAM 不夠會在啟動 log 看到 fallback 到 CPU
      - -c
      - "32768"
      # 同時處理幾個請求（slot 數）。不帶時 llama.cpp 預設 4；超過的請求在 server 裡排隊，不會被拒。
      - -np
      - "200"
      # 讓所有 slot 共用上面那 32768 的 context。不帶 -np 時 llama.cpp 自動打開它；
      # 一旦明確給了 -np 就變成關，32768 被均分成每個 slot 約 163，助理的系統指示加對話歷史一長就會被截斷。
      - --kv-unified
      - --jinja
      - --reasoning
      - "off"
      - --temp
      - "0.7"
      - --top-k
      - "20"
      - --top-p
      - "0.8"
      - --min-p
      - "0"
      - --metrics           # ops/ 的 Alloy 抓 /metrics 靠這個
      # 刻意不帶 --log-file / --log-prompts-dir：容器的慣例是 log 一律寫 stdout，
      # 由平台（docker logs、雲端的 log 收集器）去收。寫進容器內的檔案，容器一刪就沒了。

    ports:
      # 只綁 127.0.0.1：跟原本 .bat 的 --host 127.0.0.1 一樣，只給本機連，區網的人連不到。
      - "127.0.0.1:8080:8080"

    volumes:
      - models:/models:ro           # 讀 model-seed 播好的 volume；唯讀，模型服務沒理由改模型檔

    depends_on:
      model-seed:
        # 等播種「成功跑完」才啟動。播種失敗（例如 SHA256 對不上）模型服務就不會起來，
        # 不會拿一個壞掉的模型檔去服務請求。
        condition: service_completed_successfully

    deploy: *gpu

    healthcheck:
      # llama-server 的 /health：模型還在載入時回 503，載好才回 200。
      # 這就是雲端的 readiness probe——「程序活著」不等於「能接請求」，載 5GB 模型要一段時間。
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # 載入期間失敗不算數。從 volume 讀很快，但留 2 分鐘寬限給冷啟動（第一次讀、快取還沒熱）。
      start_period: 120s

    restart: unless-stopped

  # ── 行程與 AI 助理的對話記憶 ─────────────────────────────────
  postgres:
    image: postgres:18.6-alpine       # 釘死版本；alpine 版比較小
    container_name: eat-postgres
    environment:
      # 本機學習用的帳密，跟 application.properties 的預設值一致。
      # 正式環境不這樣寫：密碼放 secret，app 那邊用環境變數 SPRING_DATASOURCE_PASSWORD 蓋掉。
      POSTGRES_DB: eat
      POSTGRES_USER: eat
      POSTGRES_PASSWORD: eat
    ports:
      # 給本機 bootRun 的 app 和你自己用 psql / IDE 連。只綁 127.0.0.1，不對區網開放。
      - "127.0.0.1:5432:5432"
    volumes:
      # 資料放具名 volume：容器重建、docker compose down 都不會掉；down -v 才會清掉
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready：資料庫真的能接連線才算 healthy，app 要等它
      test: ["CMD-SHELL", "pg_isready -U eat -d eat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── eat app ────────────────────────────────────────────────────
  app:
    # Dockerfile 在 repo 根目錄（要看得到 src/ 和 gradle wrapper），所以 context 是上一層
    image: eat/app:local
    build:
      context: ..
    container_name: eat-app

    environment:
      # 打開 docker profile：application-docker.properties 蓋掉預設值——
      # 模型位址改成服務名稱、log 改成 JSON。本機 bootRun 沒開這個 profile，所以還是 127.0.0.1、彩色文字。
      SPRING_PROFILES_ACTIVE: docker

    ports:
      # 主機的 18090 → 容器的 8090。只綁 127.0.0.1，跟模型一樣不對區網開放。
      - "127.0.0.1:18090:8090"

    depends_on:
      # 模型 healthy（載完、能接請求）才啟動 app。
      # app 啟動時其實不打模型，但這樣第一個請求就不會撞上還在載入的模型。
      llm-chat:
        condition: service_healthy
      # 資料庫要先能連：app 啟動時 Flyway 就會連上去建表，連不上 app 起不來
      postgres:
        condition: service_healthy

    healthcheck:
      # actuator 的 health：Spring 容器起好、能接請求才回 200（對應雲端的 readiness probe）
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  # ── 前端：nginx 送 Vue 靜態檔，並把 /api 轉給 app ──────────────────
  # 瀏覽器只連這一個入口，看到的是同一個來源，app 不必開 CORS。對照雲端：Ingress / CDN 那一層。
  web:
    image: eat/web:local
    build:
      context: ../web             # Dockerfile、nginx.conf 都在 web/ 裡，前端自己的東西放一起
    container_name: eat-web

    ports:
      # 18080：跟 app 的 18090 一樣用 1 開頭標示「容器版」。只綁 127.0.0.1，不對區網開放。
      # app 的 18090 仍然留著：perf/ 的 k6 直接打 app，不想多經過一層 nginx 影響量測。
      - "127.0.0.1:18080:80"

    depends_on:
      # app healthy 才起：nginx 本身不在乎（proxy_pass 等請求來了才連），
      # 但 app 還沒好時打開頁面問一題只會拿到 502，等它好了再開比較不混淆。
      app:
        condition: service_healthy

    healthcheck:
      # 只確認 nginx 本身活著、送得出 index.html；不打 /api，app 的健康由 app 自己的 healthcheck 管
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

    restart: unless-stopped

volumes:
  # 具名 volume：存在 WSL2 的 Linux 檔案系統上，讀取速度遠快於掛載 Windows 資料夾。
  # `docker compose down` 不會刪它（模型不必重新複製）；`down -v` 才會清掉，下次啟動重新播種。
  # 對照雲端：PersistentVolumeClaim。
  models:
  # 對話紀錄。跟模型那個 volume 一樣，down 不刪、down -v 才清
  postgres-data:

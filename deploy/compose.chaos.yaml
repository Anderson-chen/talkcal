# 故障演練：在 app 和模型、app 和 PostgreSQL 之間各插一段 Toxiproxy，用來弄壞連線。
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.chaos.yaml up -d
#
# 只在演練時疊，EC2 的 deploy.sh 不疊：多一跳就多一個會壞的地方。
# 為什麼用 Toxiproxy、手動弄壞的指令見 deploy/README.md 的「故障演練」；照時間表弄壞並量 app 的反應用 perf/outage.js。

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    container_name: talkcal-toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      # 只發佈控制 API 給主機上的 k6、toxiproxy-cli；兩段 proxy 只給同網路的 app 連
      - "127.0.0.1:8474:8474"
    restart: unless-stopped

  app:
    environment:
      # 18080、15432 是 toxiproxy.json 裡兩段 proxy 聽的埠，改一邊要改另一邊
      SPRING_AI_OPENAI_CHAT_BASEURL: http://toxiproxy:18080/v1
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxiproxy:15432/talkcal
    depends_on:
      toxiproxy:
        # 映像檔裡沒有 curl 這類工具，寫不了 healthcheck；它起得很快，起了就能轉
        condition: service_started

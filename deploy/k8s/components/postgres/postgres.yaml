# 對應 deploy/compose.yaml 的 postgres + postgres-data volume。
# StatefulSet 而不是 Deployment：Pod 重建時拿回同一個 PVC、同一個名字（postgres-0），資料庫要的就是這個。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine     # 跟 compose 同一版
          env:
            - {name: POSTGRES_DB, value: talkcal}
            - {name: POSTGRES_USER, value: talkcal}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: talkcal-db, key: password}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "talkcal", "-d", "talkcal"]
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

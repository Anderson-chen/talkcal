# 祕密從 Secrets Manager 同步成 k8s Secret（#14）。git 和 manifest 裡只有「去哪裡拿」，沒有值。
# External Secrets 的 controller 用 Pod Identity 拿權限，只讀得到 talkcal/db、talkcal/app（infra/envs/2-eks/pod-identity.tf）。
# 產生的 Secret 名稱、鍵名跟 kind 上手動建的一樣（base 的 app.yaml 讀的就是這些），app 不知道值是從哪來的。
#
# 換值之後（例如 Bedrock key 到期換新）最多 refreshInterval 才同步；Pod 的環境變數只在啟動時讀，同步完要
#   kubectl -n talkcal rollout restart deployment/app
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1 # 跟 infra/envs/2-eks 的 var.region 一致
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talkcal-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: talkcal-db
  data:
    - secretKey: password
      remoteRef:
        key: talkcal/db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talkcal-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: talkcal-oauth
  # 沒填的登入方式在 Secrets Manager 裡是空字串，同步過來也是空的 → 登入頁不顯示那個按鈕（跟 compose 一樣）
  data:
    - secretKey: google-client-id
      remoteRef: {key: talkcal/app, property: google_client_id}
    - secretKey: google-client-secret
      remoteRef: {key: talkcal/app, property: google_client_secret}
    - secretKey: github-client-id
      remoteRef: {key: talkcal/app, property: github_client_id}
    - secretKey: github-client-secret
      remoteRef: {key: talkcal/app, property: github_client_secret}
---
# 環境變數直接用 Spring 的設定鍵當名字，app-patch.yaml 用 envFrom 整份掛上去
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talkcal-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: talkcal-runtime
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef: {key: talkcal/app, property: datasource_url}
    - secretKey: SPRING_AI_OPENAI_CHAT_BASEURL
      remoteRef: {key: talkcal/app, property: ai_base_url}
    - secretKey: SPRING_AI_OPENAI_APIKEY
      remoteRef: {key: talkcal/app, property: ai_api_key}
    - secretKey: SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL
      remoteRef: {key: talkcal/app, property: ai_model}

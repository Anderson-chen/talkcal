# 讓之後的 run 步驟能用 buildx 把映像檔快取存進 GitHub Actions cache（type=gha），用法見 ci/build-image.sh。
name: buildx 映像檔快取
description: 建立能匯出快取的 buildx builder，並把存取 GitHub Actions cache 的 token 放進環境變數

runs:
  using: composite
  steps:
    # Docker 預設的 builder 不能把快取存到 type=gha
    - uses: docker/setup-buildx-action@v4

    # 存取 GitHub Actions cache 的 token、網址只在 action 的環境變數裡，run 步驟預設讀不到，這裡放進之後步驟的環境變數。
    # 不用做同一件事的 crazy-max/ghaction-github-runtime：讀得到 token 的步驟只用 GitHub 官方的 action
    - uses: actions/github-script@v9
      with:
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL']) {
            if (process.env[name]) core.exportVariable(name, process.env[name]);
          }

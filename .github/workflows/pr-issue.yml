# PR 沒連到 issue（描述裡寫「Closes #<issue 編號>」）就紅燈，再由 branch protection 設成必過。
# 合併時自動關 issue、看板移到 Done、之後從 PR 點回當初的需求，都靠這個連結。
#
# 問 GitHub 這個 PR 合併時會關哪些 issue（closingIssuesReferences），不自己用 regex 掃描述：
# 大小寫、Fixes、Resolves 這些變體、側欄手動連的，判斷都跟 GitHub 實際的行為一樣。
#
# 不放進 ci/checks.sh：PR 只存在 GitHub 上，本機 push 時還沒有 PR。

name: PR issue

on:
  pull_request:
    # edited：補上 Closes #N 之後要重新執行
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-issue:
    # Renovate 的套件升級 PR 沒有對應的需求，追蹤在 Renovate 的 Dependency Dashboard issue，不用連。
    # job 被 if 跳過時 GitHub 當成通過，必過檢查不會卡住
    if: github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json closingIssuesReferences --jq '[.closingIssuesReferences[].number | "#\(.)"] | join(" ")')
          if [ -n "$issues" ]; then
            echo "合併時會關閉：$issues"
          else
            echo "::error::PR 沒有連到 issue。在描述裡寫「Closes #<issue 編號>」，合併時 GitHub 會自動關掉它。"
            exit 1
          fi

# CI：每次推上來、每個 PR，都在乾淨的容器裡跑一遍 ci/checks.sh。
#
# 這份檔案刻意很薄，只回答 GitHub 才需要回答的事：什麼時候跑、在哪台機器、結果貼到哪。
# 「要檢查什麼」寫在 ci/checks.sh，「在什麼環境檢查」寫在 ci/Dockerfile，
# 本機的 pre-push hook 走的是同一支 ci/run.sh —— 本機綠就代表 GitHub 綠。
# 換成 GitLab、Jenkins，也只要換掉這一層（設計理由見 ci/README.md）。
#
# GitHub 的機器沒有 GPU，所以模型相關的測試在這裡會跳過；結果頁的摘要會把它們列出來，綠燈不包含它們。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 每天掃一次 master 的漏洞：新的 CVE 會在程式碼沒變的時候冒出來，只靠 push、PR 觸發會一直沒發現。
  # 排程的那次只跑 vulns（另外兩個 job 程式碼沒變，結果不會變）。失敗時 GitHub 會寄信給最後改這個排程的人。
  # 時間是 UTC：01:00 = 台灣 09:00，上班時間收到通知
  schedule:
    - cron: '0 1 * * *'
  # 手動觸發：漏洞剛公布、想馬上確認有沒有中
  workflow_dispatch:

# 只讀程式碼，不需要任何寫入權限。預設的 GITHUB_TOKEN 權限比這寬，明寫出來把它收窄
permissions:
  contents: read

# 同一個分支連推好幾次，只跑最新那次：舊的結果已經沒人要看了
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar 是會被執行的二進位檔。有人在 PR 裡偷換它，CI 一跑就中招 ——
      # 先確認它跟 Gradle 官方發的一模一樣，才讓後面的步驟執行它
      - uses: gradle/actions/wrapper-validation@v6

      # 依賴快取沒有跨次保留（GitHub 每次都是新機器），所以每次都會重新下載，比本機第二次以後慢。
      # 先求本機和 CI 一致；真的嫌慢再把 /cache 接上 actions/cache
      - run: ci/run.sh

      - name: 測試摘要貼到結果頁
        if: always()
        run: cat ci/build/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # 失敗時把 HTML 報告留下來，在 Actions 頁面下載就看得到哪一題、為什麼紅，不必在本機重現
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            ci/build/reports/
            ci/build/playwright-report/

  # 祕密掃描。跟 checks 分開成兩個 job：並行跑，而且在 PR 上各自一個燈，一眼看出是哪一關紅
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 —— 要整個歷史。預設只抓最新一個 commit，中間 commit 加了又刪的 key 會看不到。
      # 副作用是所有分支也一起抓下來了，所以下面要指定只掃 HEAD
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 本機 pre-push 只掃要推的那幾個 commit；這裡掃整個歷史，補上 --no-verify 跳過的那些。
      # 在這裡才抓到代表已經推上 GitHub 了：key 要當成外洩，作廢重發，刪 commit 不夠。
      # HEAD：只掃這次要測的 commit 往回的歷史，不掃其他 PR 的分支（不帶參數 gitleaks 會掃 --all）
      - run: ci/secrets.sh HEAD

  # DB migration 的檢查（#18）：已經跑過的不能改；新增的給 squawk 看會不會在新舊版本同時在線時壞掉、鎖住整張表。
  # 也是自己一個 job、一個燈：它要 .git 比對「這次改了哪些」，不在 checks.sh 的容器裡（同 secrets）
  migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 —— 要拿得到比對的那個 commit（PR 的目標分支、push 之前的 master）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR：跟目標分支比；push 到 master：跟推之前的那個 commit 比。
      # 經過 env 再用，不把 ${{ }} 直接寫進指令：值會原樣貼進 shell，是 workflow 注入的典型入口
      - run: ci/migrations.sh "${BASE:-HEAD~1}"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  # 漏洞掃描：build 出會上線的映像檔再掃，有 HIGH、CRITICAL 就紅燈（必過檢查）。
  # --pull：每次都拉最新的基底映像檔，掃到的才是重新部署時真的會拿到的版本
  vulns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 跟 deploy/compose.yaml 同樣的 context，標成同樣的名字
      - run: docker build --quiet --pull --tag talkcal/app:local backend
      - run: docker build --quiet --pull --tag talkcal/web:local web

      # postgres 的版本從 compose 讀，不在這裡再寫一次：compose 升版時掃的就跟著換
      # 寫成 | 區塊：指令裡的「image: 」在 YAML 一行的寫法會被當成鍵值，整份 workflow 解析失敗
      - run: |
          ci/vulns.sh talkcal/app:local talkcal/web:local "$(grep -oE 'image: postgres:[^ ]+' deploy/compose.yaml | cut -d' ' -f2)"

      - name: 掃描結果貼到結果頁
        if: always()
        run: cat ci/build/vulns.md >> "$GITHUB_STEP_SUMMARY" || true

# CI：推到 master、每個 PR、每天排程都執行。
#
# 這份只寫 GitHub 才需要決定的事：什麼時候執行、在哪台機器、結果貼到哪。
# 要檢查什麼寫在 ci/checks.sh、在什麼環境檢查寫在 ci/Dockerfile，本機的 pre-push hook 也執行同一支 ci/run.sh
# （分層的理由見 ci/README.md）。
#
# GitHub 的機器沒有 GPU，模型相關的測試在這裡會跳過；結果頁的摘要會列出來，綠燈不包含這些測試。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 新的 CVE 會在程式碼沒變的時候公布，只靠 push、PR 觸發會一直沒發現。排程那次只執行 vulns。
  # 失敗時 GitHub 寄信給最後改這個排程的人。時間是 UTC：01:00 是台灣 09:00
  schedule:
    - cron: '0 1 * * *'
  # 漏洞剛公布、想馬上確認有沒有受影響的時候手動執行
  workflow_dispatch:

# 預設的 GITHUB_TOKEN 權限比這寬，明寫出來收窄成只讀
permissions:
  contents: read

# 同一個分支連推好幾次，只執行最新那次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar 是會被執行的二進位檔，PR 裡換掉這個檔案，CI 就會執行被換掉的程式。先確認檔案跟 Gradle 官方發的一樣
      - uses: gradle/actions/wrapper-validation@v6

      # 依賴快取沒有跨次保留（每次都是新機器），每次都重新下載。先求跟本機一致，嫌慢再加上 actions/cache
      - run: ci/run.sh

      - name: 測試摘要貼到結果頁
        if: always()
        run: cat ci/build/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # 失敗時留 HTML 報告，在 Actions 頁面下載就看得到哪一題、為什麼失敗。覆蓋率在下一步另外留，這裡排除
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            ci/build/reports/
            !ci/build/reports/jacoco/
            ci/build/playwright-report/

      # 覆蓋率綠燈也要留：用途是找漏測，不是判斷成敗。怎麼看見 docs/test-coverage.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            ci/build/reports/jacoco/
            ci/build/web-coverage/
          if-no-files-found: ignore

  # 下面每一項都是自己一個 job：跟 checks 並行執行，PR 上各自一個燈，一眼看出是哪一關紅

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 要整個歷史：只抓最新一個 commit 的話，中間 commit 加了又刪的 key 看不到
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 這裡掃整個歷史，補上本機 --no-verify 跳過的。在這裡才抓到代表已經推上 GitHub，key 要作廢重發。
      # 為什麼要給 HEAD 見 ci/secrets.sh
      - run: ci/secrets.sh HEAD

  # migration 檢查要 .git 比對這次改了哪些，不能放進 checks 的容器
  migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 要拿得到比對的 commit：PR 的目標分支、push 之前的 master
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR 跟目標分支比，push 到 master 跟推之前的 commit 比。
      # 經過 env 再用，不把 ${{ }} 直接寫進指令：值會原樣貼進 shell，是 workflow 注入的典型入口
      - run: ci/migrations.sh "${BASE:-HEAD~1}"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  # promtool 在自己的映像檔裡（見 ci/rules.sh）
  rules:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ci/rules.sh

  # 排程那次不執行：CodeQL 版本釘死，程式碼沒變結果就不會變（CVE 才會每天有新的）
  sast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: ci/sast.sh

      - name: 分析結果貼到結果頁
        if: always()
        run: cat ci/build/sast/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  # 掃前端 lockfile、自己 build 的映像檔、EC2 上的第三方映像檔。
  # 第三方映像檔在排程、push 到 master 時都掃；PR 只有動到映像檔版本或例外時才掃：
  # 把 compose 改回有漏洞的版本要在合併前紅，但無關的 PR 不必多拉約 1.5 GB，也不該因為剛公布的第三方 CVE 變成紅燈
  vulns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # PR 要跟目標分支比，才能判斷有沒有動到映像檔版本
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # context 跟 deploy/compose.yaml 一致。--pull 拉最新的基底映像檔，掃到的才是重新部署時會拿到的版本
      - run: docker build --quiet --pull --tag talkcal/app:local backend
      - run: docker build --quiet --pull --tag talkcal/web:local web
      - run: docker build --quiet --pull --tag talkcal/postgres:local deploy/postgres

      # 清單自己一步：寫在下一步的 $() 裡的話，compose 解析失敗只會變成少了參數，什麼都沒掃卻是綠的。
      # git diff --quiet 出錯（不是 0 也不是 1）也往下掃：寧可多掃
      - id: list
        run: |
          if [ -n "$BASE_REF" ] && git diff --quiet "origin/$BASE_REF...HEAD" --               deploy/compose.yaml ops/compose.yaml 'infra/envs/1-ec2/compose*.yaml'               ci/compose-images.sh ci/trivyignore.yaml ci/Dockerfile ci/vulns.sh; then
            exit 0
          fi
          images=$(ci/compose-images.sh)
          test -n "$images"
          echo "images=$(paste -sd' ' <<<"$images")" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}

      # $IMAGES 不加引號：映像檔之間用空白隔開，要拆成多個參數
      - run: ci/vulns.sh --repo talkcal/app:local talkcal/web:local talkcal/postgres:local $IMAGES
        env:
          IMAGES: ${{ steps.list.outputs.images }}

      - name: 掃描結果貼到結果頁
        if: always()
        run: cat ci/build/vulns.md >> "$GITHUB_STEP_SUMMARY" || true

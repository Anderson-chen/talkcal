# 把 docs/architecture/ 的互動架構圖發佈成 GitHub Pages：https://anderson-chen.github.io/talkcal/
# GitHub 在 repo 裡打開 .html 只顯示原始碼，要互動得當網頁送出去。
#
# 只上傳這一頁，不用 Pages 的「從 docs/ 發佈」：那樣 docs/ 底下所有文件都會變成公開網站。
#
# 每次 push 到 master 都發佈：頁面上的行號是發佈時從這個 commit 的檔案算出來的，
# 任何被引用的檔案多一行、少一行都要重算，只看 docs/architecture/ 有沒有改會漏掉。發佈一次不到一分鐘。

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# deploy-pages 要寫 Pages，並用 OIDC 證明這次部署來自這個 repo 的這個 workflow
permissions:
  contents: read
  pages: write
  id-token: write

# 新的進來不取消正在執行的，發佈到一半不會被切斷
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # 換成行號的頁面寫到另一個資料夾再上傳，lines.mjs 本身不發佈。
      # 錨點對不上就失敗、不發佈，線上留著上一版。runner 內建 Node，lines.mjs 只用內建模組
      - run: node docs/architecture/lines.mjs --out "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - id: deploy
        uses: actions/deploy-pages@v5

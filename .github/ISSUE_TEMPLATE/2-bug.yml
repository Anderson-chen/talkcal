# 問題：壞掉、跟預期不一樣。欄位照現有的問題回報（例如 #76）：
# 症狀、預期、發生環境、重現步驟、原因、做法、驗收條件。
# 表單上看得到的文字（欄位名稱、說明）和填的內容都用中文；欄位名稱就是 issue 內文的 `### 標題`。
# 驗收條件寫成 checkbox，見 #207。
name: Bug
description: 壞掉了，或跟預期不一樣
labels: [bug]
projects: ["Anderson-chen/6"]
body:
  - type: markdown
    attributes:
      value: |
        **標題：** 寫看得到的症狀，例如 `app 換 IP 後 nginx 還連舊的，API 回 502`。
        還不知道原因沒關係，先寫看到了什麼。

        **Label：** `bug` 會自動貼上；另外 `stage:` 或 `product:` 剛好一個（怎麼選見 docs/classification.md），`p0`／`p1` 剛好一個，改到哪塊就貼對應的 `area:`。

        **用字：** 寫給沒讀過這段程式碼的人看，每個欄位用條列，一點講一件事（照 .agents/rules/writing.md）。
  - type: textarea
    id: actual
    attributes:
      label: 症狀
      description: 你看到了什麼。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期
      description: 原本應該怎樣。
  - type: textarea
    id: environment
    attributes:
      label: 發生環境
      description: 什麼時候、在哪裡發生（本機、EC2），當時在做什麼。
  - type: textarea
    id: repro
    attributes:
      label: 重現步驟
      description: 照著做就會發生的步驟。還重現不出來就寫還重現不出來。
  - type: textarea
    id: cause
    attributes:
      label: 原因
      description: 什麼造成的。還不知道可以先空著。
  - type: textarea
    id: solution
    attributes:
      label: 做法
      description: 打算怎麼修。還不知道可以先空著。
  - type: textarea
    id: acceptance
    attributes:
      label: 驗收條件
      description: 怎麼證明修好了。一條一個 checkbox，例如照重現步驟做不會再發生，再加一條反例（拿掉修正就會再發生）。做完一條勾一條。還不知道原因可以先空著。
      placeholder: |
        - [ ] 照重現步驟做，不會再發生
        - [ ] 反例：拿掉修正就會再發生

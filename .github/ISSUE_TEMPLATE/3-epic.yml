# epic：上線準備的一段，或產品範圍的一個面向，底下掛子 issue（分法見 README）。
# 欄位照現有 epic 的寫法（例如 #30、#189）。
name: Epic
description: 上線準備的一段或產品範圍的一個面向，底下掛子 issue
title: "epic(): "
labels: [epic]
projects: ["Anderson-chen/6"]
body:
  - type: markdown
    attributes:
      value: |
        **標題**寫 `epic(範圍): 名稱`，例如 `epic(run): 上線後觀測`。
        範圍用英文小寫；有對應的 `stage:`、`product:` label 就用同一個字，也把那個 label 加上。
  - type: textarea
    id: question
    attributes:
      label: 要回答的問題
      description: 這一塊要確保什麼
    validations:
      required: true
  - type: textarea
    id: items
    attributes:
      label: 細項
      description: 每一列一個細項；還沒做完的各開一個子 issue，填在最後一欄
      value: |
        | 細項 | 現況 | 追蹤或決定 |
        |---|---|---|
        |  |  |  |

# epic：上線準備的一段，或產品範圍的一個面向，底下掛子 issue（分法見 README）。
# 欄位照現有 epic 的寫法（例如 #30、#189）：要回答的問題（Goal）、細項（Scope）。
# 表單上看得到的文字（欄位名稱、說明、表格欄名）用英文，填的內容用中文。
name: Epic
description: A stage of launch readiness or one area of product scope, with sub-issues under it
title: "epic(): "
labels: [epic]
projects: ["Anderson-chen/6"]
body:
  - type: markdown
    attributes:
      value: |
        **Title:** `epic(scope): name`, e.g. `epic(run): 上線後觀測`.
        Scope is lowercase English; if a matching `stage:` or `product:` label exists, use the same word and add that label.

        **Labels:** `epic` is added for you; also add the matching `stage:` or `product:` and one of `p0`/`p1`. Sub-issues use the same `stage:` or `product:` label as their epic.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this area has to make sure of.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One row per item. Items to do become sub-issues attached to this epic (the epic shows how many are done), with the number in the last column; for items decided against, put the reason there.
      value: |
        | Item | Status | Tracking / Decision |
        |---|---|---|
        |  |  |  |

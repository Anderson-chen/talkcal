# ci/vulns.sh 評估過、決定接受的漏洞。每一條都要寫理由，而且一定要有到期日：
# 到期後掃描會重新報出來、CI 變紅，逼人再看一次，不會變成「忽略了就永遠忘了」。
#
# gosu（postgres 官方映像檔裡的小工具）的 Go 標準函式庫漏洞 —— 2026-10-14 評估：
#   - 修不了：gosu 是上游編好放進去的 Go 執行檔，postgres 最新的 18 也一樣；deploy/postgres/Dockerfile 只用 apk 升作業系統套件，升不到它
#   - 碰不到：gosu 只在容器啟動時把 root 切成 postgres 使用者，接著就 exec 成 postgres 本身，
#     不開網路、不讀外部輸入；標準函式庫的漏洞要被利用，得先有程式拿它去處理攻擊者給的資料
#   - postgres 的埠只綁在 127.0.0.1（deploy/compose.yaml），外面連不到
# paths 限定在 gosu：同一個 CVE 出現在別的地方（例如 app 自己的程式）照樣會報
#
# 第三方映像檔（#239）—— 2026-11-10 評估。已升到發布滿 14 天的最新版（.github/renovate.json5 的 minimumReleaseAge），剩下的分三種：
#   - Caddy 2.11.6：唯一對外的服務，HTTP/2、Range 的 DoS 外面碰得到，這裡是「接受到升版為止」，不是「碰不到」。
#     2.11.9 已修掉除了 x/net/html 以外的全部，2026-11-20 滿 14 天，Renovate 下一個週一（11-23）開 PR（patch 不用勾選）；到期日給到合併的隔天
#   - 觀測堆疊：Grafana 只綁 127.0.0.1、其他只在 compose 網路裡，沒有對外的路；這幾版上游還沒帶修補，給一個月
#   - postgres-exporter：v0.20.1 已是最新版，上游沒發新版就沒得升。不發佈埠，只有 Alloy 會來抓；給兩個月
# 限制（2026-10-27 試過）：作業系統套件的例外限定不到映像檔，會套用到每個掃的映像檔，所以 OS 套件那幾條到期日都給短的

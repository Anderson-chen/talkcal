# 補 CodeQL 沒建模的 API（Models as Data），標出資料流到哪裡時 CodeQL 要當成危險。ci/sast/analyze.sh 用 --model-packs 載入。
#
# CodeQL 2.27 內建 JdbcTemplate 的模型，沒有 Spring 6.1 JdbcClient 的，而這個專案的 SQL 都走 JdbcClient。
# 不補的話，@RequestParam 直接拼進 jdbc.sql(...) 也是綠燈。
name: talkcal/java-models
version: 0.0.1
library: true
extensionTargets:
  codeql/java-all: "*"
dataExtensions:
  - "*.model.yml"

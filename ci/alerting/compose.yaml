# ci/alerting.sh 疊在 ops/compose.yaml 上的覆寫檔。告警規則、contact point、SMTP 設定都用 ops/ 那份原樣，
# 這裡只讓這組跟本機正在跑的觀測組、deploy/ 那組分開，再加假 app 和假 postgres_exporter。
# 不分開的話容器名稱、主機埠會撞，Alloy 也會在 deploy 的網路上抓到真的 app。
#   - 專案名由 ci/alerting.sh 的 -p 給，volume 跟著換名字，Mimir、Grafana 都是全新的
#   - 拿掉 container_name，讓 compose 照專案名取名
#   - 主機埠只留腳本要查的三個（Mimir、Grafana、Mailpit），換成不常用的號碼
#   - Alloy 接的 deploy 網路換成這組自己建的，上面只有假的服務
# 用 !reset、!override（Compose 2.24 起）：一般的覆寫檔對清單是合併，拿不掉原本的埠。

services:
  mimir:
    container_name: !reset null
    # 查 Mimir 收到 up 了沒
    ports: !override ["127.0.0.1:19009:9009"]
  loki:
    container_name: !reset null
    ports: !reset []
  tempo:
    container_name: !reset null
  alloy:
    container_name: !reset null
    ports: !reset []
  grafana:
    container_name: !reset null
    # 查告警規則載入了沒
    ports: !override ["127.0.0.1:13000:3000"]
  mailpit:
    container_name: !reset null
    # 查收到哪些信
    ports: !override ["127.0.0.1:18025:8025"]
    restart: "no"

  # 在 deploy 網路上叫 app、聽 8091，對上 Alloy 設定裡的 target（app:8091）
  fake-app:
    image: python:3.13-alpine@sha256:8bcfa47b04b853a17aaf909362b847b2112fd6ec4105ea553ef9a43bafbb5916
    command: ["python", "-u", "/fake-app.py"]
    # python 當 PID 1 不理 SIGTERM，stop 要等 10 秒才被砍；SIGINT 會變成 KeyboardInterrupt 馬上結束
    stop_signal: SIGINT
    volumes:
      # 相對路徑以第一個 -f 檔案（ops/compose.yaml）所在的資料夾為準，不是這個檔案的位置
      - ../ci/alerting/fake-app.py:/fake-app.py:ro
    networks:
      talkcal-deploy:
        aliases: [app]

  # 為什麼要假的 postgres_exporter 見 fake-app.py 開頭
  fake-postgres-exporter:
    image: python:3.13-alpine@sha256:8bcfa47b04b853a17aaf909362b847b2112fd6ec4105ea553ef9a43bafbb5916
    command: ["python", "-u", "/fake-app.py", "postgres-exporter"]
    stop_signal: SIGINT
    volumes:
      - ../ci/alerting/fake-app.py:/fake-app.py:ro
    networks:
      talkcal-deploy:
        aliases: [postgres-exporter]

networks:
  talkcal-deploy:
    # 不是 external：compose 自己建、down 時自己刪
    external: false
    name: !reset null     # 拿掉固定的 talkcal-deploy_default，照專案名取名

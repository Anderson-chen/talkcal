# ci/alerting.sh 疊在 ops/compose.yaml 上面的覆寫檔：告警規則、contact point、SMTP 設定都用 ops/ 那份原樣，
# 這裡只改「讓它跟正在跑的那組分開」的部分，加一支假 app。
#
# 為什麼要分開：本機通常已經起著真的觀測組（talkcal-grafana…）和 deploy/ 那組。
# 不改的話容器名稱、主機埠會撞，而且 Alloy 會在 talkcal-deploy_default 上抓到真的 app。
#   - 專案名由 ci/alerting.sh 用 -p 給，volume 也跟著換名字（全新的 Mimir、Grafana，沒有舊資料）
#   - container_name 拿掉：讓 compose 照專案名取名
#   - 主機埠拿掉，只留腳本要查的三個（Mimir、Grafana、Mailpit），換成不常用的號碼
#   - Alloy 接的「deploy 網路」換成這次專用的，上面只有假 app（腳本自己建、自己刪）
# !reset、!override 是 Compose 2.24 起的寫法：一般的覆寫檔對清單是「合併」，拿不掉原本的埠。

services:
  mimir:
    container_name: !reset null
    # 等 Mimir 收到第一筆 up 才起 Grafana
    ports: !override ["127.0.0.1:19009:9009"]
  loki:
    container_name: !reset null
    ports: !reset []
  tempo:
    container_name: !reset null
  alloy:
    container_name: !reset null
    ports: !reset []
  grafana:
    container_name: !reset null
    # 查告警規則有沒有載入
    ports: !override ["127.0.0.1:13000:3000"]
  mailpit:
    container_name: !reset null
    # 查收到幾封信
    ports: !override ["127.0.0.1:18025:8025"]
    restart: "no"

  # 假 app：在「deploy 網路」上叫 app、聽 8091，跟 Alloy 設定裡的 target（app:8091）對上
  fake-app:
    image: python:3.13-alpine@sha256:8bcfa47b04b853a17aaf909362b847b2112fd6ec4105ea553ef9a43bafbb5916
    command: ["python", "-u", "/fake-app.py"]
    volumes:
      # 相對路徑以 ops/ 為準（第一個 -f 檔案所在的資料夾），不是這個檔案的位置
      - ../ci/alerting/fake-app.py:/fake-app.py:ro
    networks:
      talkcal-deploy:
        aliases: [app]

networks:
  talkcal-deploy:
    name: talkcal-alerttest-deploy

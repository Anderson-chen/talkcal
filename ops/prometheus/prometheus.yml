# Prometheus 的工作：照 scrape_configs 列的對象，每隔 scrape_interval 去抓一次數字存起來。
# 這個檔現在有兩個抓取對象，其中 app 那個「還沒東西可抓」—— 先把設定擺好，等 app 開了端點就通。

global:
  scrape_interval: 15s      # 每 15 秒抓一輪。學習用夠了；要更即時可縮短，但資料量會變大
  evaluation_interval: 15s  # 告警規則多久算一次（目前沒設規則，先放著）

scrape_configs:
  # (1) Prometheus 抓自己 —— 一定會有資料，用來確認「這套抓取機制本身是活的」
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # (2) 我們的 Spring app —— app 已是 HTTP 入口(port 8090)，但還沒開 metrics 端點。
  #     目前 build.gradle 只有 spring-boot-starter-web，還沒加 actuator / micrometer，
  #     所以 /actuator/prometheus 還不存在，這個 target 會是紅的(DOWN)，這是正常的。
  #     下一步替 app 加上 spring-boot-starter-actuator + micrometer-registry-prometheus，
  #     並在 application.properties 把 prometheus 端點露出來，這裡就會自動變綠、不必再改。
  #
  #     埠是 8090 不是 8080：8080 讓給常駐的 llama-server，app 的 HTTP 入口挪到 8090
  #     （見 src/main/resources/application.properties 的 server.port）。
  #     host.docker.internal = 容器眼中的「你這台機器」。app 用 ./gradlew bootRun 跑在 host 上，
  #     Prometheus 要透過這個名字才找得到它（compose.yaml 已把這名字接到 host-gateway）。
  - job_name: eat-app
    metrics_path: /actuator/prometheus   # Spring Boot 吐 Prometheus 指標的預設路徑
    static_configs:
      - targets: ["host.docker.internal:8090"]

  # (3) llama.cpp 的 llama-server —— LLM 那顆本體。加了 --metrics 就在 8080/metrics 吐指標
  #     （launch.json 的 runtimeArgs 已補上 --metrics；沒帶這旗標的話這個 target 會是紅的）。
  #     不必寫 metrics_path：llama-server 用的就是 Prometheus 預設的 /metrics，不像上面 app 要改成
  #     /actuator/prometheus。埠 8080 是 llama-server 常駐的埠（app 讓到 8090 就是為了它）。
  #     看得到的指標：predicted_tokens_seconds（生成速度 t/s）、prompt_tokens_seconds（prompt t/s）、
  #     requests_processing（處理中）、requests_deferred（排隊中，併發塞車看它）、
  #     tokens_predicted_total / prompt_tokens_total（累計 counter）。
  #     實際清單以 `curl localhost:8080/metrics` 這個 build 吐出來的為準（此 build 沒有 kv_cache 相關指標）。
  - job_name: llama-cpp
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # (4) llama.cpp 的「嵌入」伺服器 —— 同一支 llama-server.exe，但載的是 bge-m3、開 --embedding，
  #     常駐在 8081（見 .claude/launch.json 的 llama-embedding-server）。它也帶了 --metrics。
  #
  #     為什麼要獨立一個 job_name 而不是併進上面的 llama-cpp：
  #     兩台吐出來的 metric「名字完全一樣」（都是 llamacpp:xxx），只能靠 label 分辨來源。
  #     拆成兩個 job，就多了 job="llama-cpp" / job="llama-embedding" 這個天然的分界，
  #     查詢時寫 llamacpp:prompt_tokens_seconds{job="llama-embedding"} 就只會拿到這台的。
  #     （也因為這樣，llama-cpp.json 裡原本沒過濾的查詢全都補上了 {job="llama-cpp"}，
  #       否則這台的數字會混進那張圖。）
  #
  #     嵌入伺服器「不生成 token」，所以 predicted_* 那組永遠是 0 —— 它只做 prompt 的前向計算。
  #     真正有意義的是 prompt_tokens_seconds（嵌入吞吐）與 requests_processing/deferred（塞不塞）。
  - job_name: llama-embedding
    static_configs:
      - targets: ["host.docker.internal:8081"]

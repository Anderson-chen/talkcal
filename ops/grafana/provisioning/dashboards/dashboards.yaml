# 這個資料夾的 dashboard JSON，Grafana 啟動時載入，之後每 30 秒重掃一次。
# path 是容器裡的路徑：ops/compose.yaml 把 ./grafana/provisioning 掛到 /etc/grafana/provisioning。

apiVersion: 1

providers:
  - name: talkcal-dashboards
    # JSON 檔拿掉，Grafana 裡的 dashboard 也跟著刪
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false       # 以檔案為準：UI 上無法存檔，試好的改動要貼回 JSON
    options:
      path: /etc/grafana/provisioning/dashboards
      # 子資料夾會變成 Grafana 裡的資料夾
      foldersFromFilesStructure: true

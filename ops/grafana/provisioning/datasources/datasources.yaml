# 三個資料源互相連著：Mimir 圖上的 exemplar、Loki 的 log 都點得進 Tempo 的 trace，
# trace 又點得回那個請求的 log 和當時的指標。
# uid 都釘死：dashboard JSON 和這些跳轉設定用 uid 找資料源，不釘的話 Grafana 隨機產一個就對不上。
# 這個檔裡的 $ 要寫成 $$：Grafana 讀檔時會把 $XXX 當環境變數展開。

apiVersion: 1

# 換成 Mimir 之前的資料源。provisioning 不會刪掉檔案裡消失的資料源，
# 不明寫的話，起過的 Grafana 會一直留著一個連不上的 Prometheus
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # type 是 prometheus：Mimir 提供的就是 Prometheus 的查詢 API
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy               # 由 Grafana 後端連，瀏覽器連不到 compose 網路裡的 mimir
    url: http://mimir:9009/prometheus   # Mimir 的 Prometheus 相容 API 在 /prometheus 底下
    isDefault: true
    jsonData:
      prometheusType: Mimir
      # Micrometer 把 exemplar 的 trace id 放在 trace_id 這個標籤
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # trace id 不是 Loki 的標籤（理由見 ops/alloy/config.alloy 的 discovery.relabel "deploy"），只能從內容抓。
      # app 的 log 是 ECS JSON（application-docker.properties），Micrometer Tracing 放進 MDC 的 traceId 印成 "traceId" 欄位；
      # 改了 log 格式，這兩個 regex 要一起改
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: 到 Tempo 看這個請求
        # 第二顆按鈕開「單一請求」dashboard。沒有 datasourceUid 就是一般網址
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: '/d/talkcal-request/?var-traceId=$${__value.raw}&$${__url_time_range}'
          urlDisplayLabel: 用「單一請求」dashboard 看

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # 用自訂查詢找內容含 trace id 的 log。Grafana 預設拿 span 的屬性對 Loki 標籤，但 trace 上的服務叫 talkcal
      # （spring.application.name），Loki 的 service 標籤是 compose 服務名 app，對不起來。
      # 前後各多一分鐘：log 的時間可能因為時鐘、送出延遲落在 span 外面
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{service="app"} |= "$${__trace.traceId}"'
      # 看一個慢 span 時，當時整個 app 是不是也慢。前三個查詢寫死 job="talkcal-app"、不帶 span 的標籤：
      # trace 上的服務叫 talkcal，指標的 job 叫 talkcal-app，對不起來。所以只對 talkcal 的 span 有意義
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        # span metrics 的標籤叫 service，不是 service.name；下面的 $$__tags 會展開成 service="talkcal"
        tags:
          - key: service.name
            value: service
        queries:
          - name: app 延遲 p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="talkcal-app", uri!~"/actuator.*"}[1m])))'
          - name: app 5xx 比例
            query: 'sum(rate(http_server_requests_seconds_count{job="talkcal-app", status=~"5.."}[1m])) / sum(rate(http_server_requests_seconds_count{job="talkcal-app"}[1m]))'
          - name: 連線池：使用中 / 排隊等連線
            query: 'sum by (__name__) ({__name__=~"hikaricp_connections_(active|pending)", job="talkcal-app"})'
          # span metrics 是 Tempo 的 metrics-generator 算的（tempo/tempo.yaml）
          - name: 同一種 span 的延遲 p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags, span_name="$${__span.name}"}[1m])))'
      # service map 讀 metrics-generator 寫進 Mimir 的 traces_service_graph_*
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true

# 觀測環境自己停了的告警：Alloy、Mimir、Loki、Tempo 停了，dashboard 只會一片空白，看起來跟沒流量一樣。
# 哪個元件由哪一條發現、Grafana 自己停了怎麼辦（Watchdog，還沒啟用），見 ops/README.md 的「監控本身掛掉：誰來發現」。
# Grafana 不對這個檔做環境變數展開，annotations 裡的 $ 照寫一個。

apiVersion: 1

# provisioning 只新增、更新，檔案裡拿掉的不會自己刪，啟動過的 Grafana 會一直留著 Watchdog 和 heartbeat。
# 之後用同樣的 uid 加回 Watchdog 時，要拿掉這兩段，不然每次啟動都被刪
deleteRules:
  - orgId: 1
    uid: meta-watchdog
deleteContactPoints:
  - orgId: 1
    uid: talkcal-heartbeat

groups:
  - orgId: 1
    name: meta-monitoring
    folder: talkcal
    interval: 1m
    rules:
      # ── 1. Alloy 停了：指標不再進來 ───────────────────────────────
      - uid: meta-alloy-down
        title: Alloy 停了，指標不再進來
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 不能用 up < 1：Alloy 停了就不再寫 up，查詢往回找 5 分鐘，一直拿到最後那個 1。
              # 看最後一個點離現在幾秒，Alloy 一停就開始變大
              expr: time() - max(timestamp(up{job="alloy"}))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 60 秒 = 連續 4 次沒進來。Alloy 重啟只要幾秒，到不了 60
                - evaluator: { type: gt, params: [60] }
        # 重啟比較久（拉新映像、WAL 重放）也不通知
        for: 2m
        # 停超過 5 分鐘後連最後的點都查不到，變成沒資料，一樣是停了
        noDataState: Alerting
        # Mimir 查不到時下一條會響，這裡不重複寄
        execErrState: OK
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/meta-alloy-down.md
          summary: 'Alloy 已經 {{ humanizeDuration $values.A.Value }} 沒送指標進 Mimir'
          description: >-
            指標、log、trace 都經過 Alloy，它停了三種都斷，dashboard 會一片空白。
            `docker compose ps alloy` 看是不是停了；活著的話開 127.0.0.1:12345 看 remote_write 有沒有在報錯。
            log 在 Alloy 回來後會補讀（docker 的 log 檔還在），指標和 trace 那段會缺。

      # ── 2. Mimir 查不到 ──────────────────────────────────────────
      - uid: meta-mimir-down
        title: Mimir 查不到，指標類告警全部失效
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 只看查不查得到：Mimir 正常時一定回 1，連不上、逾時由 execErrState: Alerting 算成出事
              expr: vector(1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # Mimir 重啟（WAL 重放）一兩分鐘內會回來
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/meta-mimir-down.md
          summary: Grafana 連續 2 分鐘查不到 Mimir
          description: >-
            所有用 Mimir 的告警（app 掛了、5xx、延遲、SLO）這段時間都在「查詢失敗」，不會正常觸發。
            `docker compose ps mimir`、`docker compose logs mimir` 看原因（常見：硬碟滿、記憶體被砍）。
            Alloy 會先把指標留在自己的 WAL，Mimir 回來後補送，短時間停掉不太會缺資料。

      # ── 3. Loki、Tempo 停了 ──────────────────────────────────────
      - uid: meta-backend-down
        title: Loki 或 Tempo 抓不到
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # by (job)：信裡分得出是 Loki 還是 Tempo
              expr: min by (job) (up{job=~"loki|tempo"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        # 沒資料是 Alloy 沒在送，第一條會響
        noDataState: OK
        execErrState: OK
        labels:
          # 只少了 log 或 trace，指標和告警都還在，不必半夜叫醒人
          severity: warning
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/meta-backend-down.md
          summary: '{{ $labels.job }} 連續 2 分鐘抓不到'
          description: >-
            Loki 停了：log 會先留在 Docker 的 log 檔，回來後 Alloy 補送。
            Tempo 停了：這段時間的 trace 會掉（Alloy 只在記憶體排隊重試）。
            `docker compose ps {{ $labels.job }}`、`docker compose logs {{ $labels.job }}` 看原因。

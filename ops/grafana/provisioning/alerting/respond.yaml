# 原因類告警：資料庫、連線池、模型熔斷、備份。每一條為什麼要有、為什麼這個 severity，見 docs/alerts.md；
# 這裡只寫查詢和門檻本身的理由。annotations 裡的 $ 照寫一個（見 meta-monitoring.yaml 開頭）。

apiVersion: 1

groups:
  - orgId: 1
    name: talkcal-respond
    folder: talkcal
    interval: 1m
    rules:
      # ── 1. 資料庫連不上 ─────────────────────────────────────────
      - uid: talkcal-db-down
        title: talkcal 資料庫連不上
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 只看 pg_up 的話，exporter 自己停了時 pg_up 5 分鐘後就消失，變成沒資料、算正常。
              # 後半讓 exporter 抓不到（up = 0）也算 0。兩個 job 都沒有的環境結果是空的，noDataState OK 不會響
              expr: >-
                min(pg_up{job="postgres"})
                or on()
                (max(up{job="postgres"}) * 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # 重啟 postgres 約 5～10 秒，1 分鐘內就回來
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/talkcal-db-down.md
          summary: talkcal 資料庫連續 1 分鐘連不上（或 postgres_exporter 抓不到）
          description: >-
            pg_up 為 0：exporter 連不上 PostgreSQL；或 up{job="postgres"} 為 0：exporter 本身抓不到。
            行程、登入、AI 助理的對話記憶都要用資料庫，所有 API 都會失敗。
            先看 `docker compose ps postgres`，再看 postgres 容器的 log。

      # ── 2. 等不到資料庫連線 ─────────────────────────────────────
      - uid: talkcal-db-pool-timeout
        title: talkcal 有請求等不到資料庫連線
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 借連線等滿 HikariCP 的 connectionTimeout（30 秒）就 +1
              expr: sum(increase(hikaricp_connections_timeout_total{job="talkcal-app"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 不寫 > 0：increase() 會外插，counter 沒動時偶爾算出 0.0x
                - evaluator: { type: gt, params: [0.5] }
        # 每一次逾時都已經有人等了 30 秒，不再多等
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/talkcal-db-pool-timeout.md
          summary: 'talkcal 近 5 分鐘有 {{ printf "%.0f" $values.A.Value }} 個請求等不到資料庫連線'
          description: >-
            每一個都是使用者等滿 30 秒才拿到錯誤。看 talkcal-app dashboard 的「資料庫連線池」那一排：
            active 貼著上限、pending 衝高，再看 PostgreSQL 的 pg_stat_activity 是不是有連線在等鎖。

      # ── 3. 模型熔斷打開 ─────────────────────────────────────────
      - uid: talkcal-model-circuit-open
        title: talkcal 模型熔斷持續打開（AI 助理暫停）
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 左：近 5 分鐘熔斷擋下的請求數（也是信裡寫的人數）。右：這 5 分鐘一次都沒關回來。
              # 不能只看 state="open"：沒開自動轉半開，打開之後要等下一個請求才換狀態，
              # 沒人用時會一直停在 open，模型早好了還在響；模型一直沒好時又在 open、half_open 之間跳，響了又解除
              expr: >-
                sum(increase(resilience4j_circuitbreaker_not_permitted_calls_total{job="talkcal-app", name="chat-model"}[5m]))
                and on()
                (max(max_over_time(resilience4j_circuitbreaker_state{job="talkcal-app", name="chat-model", state="closed"}[5m])) == 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 至少擋下一個人（不寫 > 0 的理由見第 2 條）
                - evaluator: { type: gt, params: [0.5] }
        # 查詢的「5 分鐘沒關回來」已經是等待：打開一次 30 秒就關回來的（模型重啟、Bedrock 一陣限流）不會響
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/talkcal-model-circuit-open.md
          summary: 'talkcal 模型熔斷 5 分鐘沒關回來，擋下 {{ printf "%.0f" $values.A.Value }} 個 AI 助理請求（行程功能照常）'
          description: >-
            最近 10 次叫模型有一半以上失敗或超過 30 秒，熔斷打開、助理不再叫模型、直接回 503。
            看 talkcal-app dashboard 最下面「模型熔斷」那一排，再看模型：本機看 llm-chat 容器，雲端看 Bedrock。

      # ── 4. 備份太久沒成功 ───────────────────────────────────────
      - uid: talkcal-backup-stale
        title: talkcal 資料庫備份太久沒成功
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 值是距離上次成功備份多久；and 後面讓開機也超過門檻才算（為什麼看開機時間見 docs/alerts.md）。
              # 只有雲端的 backup-to-s3.sh 會寫這個指標，本機查詢是空的，算正常。
              # 不能寫成 max(最後成功 or 開機時間)：or 比對標籤時不看指標名稱，兩邊標籤一樣，右邊會整個被丟掉，剛開機就誤響。
              # 8100 跟下面 evaluator 的門檻要一起改
              expr: >-
                (time() - max(talkcal_backup_last_success_timestamp_seconds{job="talkcal-backup"}))
                and on()
                ((time() - max(node_boot_time_seconds{job="talkcal-backup"})) > 8100)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 2 小時 15 分 = 整點備份連續兩次沒成功。一次失敗可能是 S3 短暫連不上，下一個整點會補上；
                # 多的 15 分鐘給備份本身執行和時鐘誤差
                - evaluator: { type: gt, params: [8100] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/talkcal-backup-stale.md
          # 沒資料時 Grafana 也會展開 summary，Value 是 nil，直接給 humanizeDuration 的話每次評估都記一筆錯誤
          summary: 'talkcal 已經 {{ if $values.A.Value }}{{ humanizeDuration $values.A.Value }}{{ else }}一段時間{{ end }} 沒有成功備份資料庫'
          description: >-
            每小時的備份連續兩次沒有成功傳上 S3。資料還在，但現在出事的話最多會掉這麼久的資料。
            先看 `journalctl -u talkcal-backup.service -n 50`。

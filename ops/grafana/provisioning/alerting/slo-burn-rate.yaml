# SLO 的 burn-rate 告警。multi-window, multi-burn-rate 的做法、門檻怎麼從 28 天換算出來，見 docs/slo.md；
# 這裡的數字跟那份表要一起改。burn rate 由 Mimir 的錄製規則先算好（ops/mimir/rules/anonymous/slo.yaml），
# 這裡只比較；每個 SLO（slo 標籤）各一個告警實例。

apiVersion: 1

groups:
  - orgId: 1
    name: slo-burn-rate
    folder: SLO
    interval: 1m        # Mimir 每分鐘錄一次，評估得更密也只讀到同一個值
    rules:
      - uid: slo-fast-burn
        title: SLO 快燒：error budget 幾天內就會燒光
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # 長、短視窗都超過門檻才算。值是長視窗的 burn rate，window 標籤記是哪一組成立
              expr: |
                max by (slo, window) (
                    label_replace(slo:burn_rate:1h > 13.44 and on (slo) slo:burn_rate:5m > 13.44, "window", "1h/5m", "", "")
                  or
                    label_replace(slo:burn_rate:6h > 5.6 and on (slo) slo:burn_rate:30m > 5.6, "window", "6h/30m", "", "")
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # 沒有 SLO 的 error budget 消耗過快時查詢是空的，所以沒資料是正常。指標斷掉時響的是 rules.yaml 的 talkcal-app-down
        noDataState: OK
        execErrState: Error
        # 短視窗已經在確認「現在還在快速消耗」，不另外加 for
        for: 0s
        labels:
          severity: critical
          team: talkcal
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/slo-fast-burn.md
          summary: '{{ $labels.slo }} 的 error budget 燒太快（{{ $labels.window }} 視窗 burn rate {{ printf "%.1f" $values.A.Value }}）'
          description: >-
            照目前的速度，28 天的 error budget 幾天內就會燒光。
            先看 SLO 儀表板是哪個 SLO、從什麼時候開始，再到 talkcal-app 儀表板和 Loki 的 access log 找 5xx 或慢請求。
            目標與處理方式見 docs/slo.md。
          dashboard: /d/talkcal-slo

      - uid: slo-slow-burn
        title: SLO 慢燒：照這速度這個月會不達標
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: |
                max by (slo, window) (
                    label_replace(slo:burn_rate:1d > 2.8 and on (slo) slo:burn_rate:2h > 2.8, "window", "1d/2h", "", "")
                  or
                    label_replace(slo:burn_rate:3d > 0.933 and on (slo) slo:burn_rate:6h > 0.933, "window", "3d/6h", "", "")
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          team: talkcal
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/slo-slow-burn.md
          summary: '{{ $labels.slo }} 的 error budget 持續在燒（{{ $labels.window }} 視窗 burn rate {{ printf "%.2f" $values.A.Value }}）'
          description: >-
            不是急事，但照這個速度 28 天的 error budget 會用完。開一張 issue，上班時間查原因。
            目標與處理方式見 docs/slo.md。
          dashboard: /d/talkcal-slo

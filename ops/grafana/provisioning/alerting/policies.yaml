# 觸發的告警交給誰、多久寄一次（notification policy）。
# 規則（rules.yaml）只管「現在是不是出事」，寄不寄、合不合併、多久重寄都在這裡決定。
#
# 注意：provisioning 的 policies 會整棵蓋掉 Grafana 原本的通知樹，UI 上也就不能改了 —— 要改改這個檔。
# 下面四個時間、分組的值跟 Grafana 預設一樣，刻意寫出來：一眼看得到信多久來一封，不必去翻文件。

apiVersion: 1

policies:
  - orgId: 1
    receiver: email               # contact-points.yaml 的 name
    # 同一條規則的告警合成一封：例如 SLO 快燒同時有好幾個 SLO 在燒（每個 SLO 一個告警實例），併成一封
    group_by: ['grafana_folder', 'alertname']
    # 第一次觸發後等 30 秒再寄：同一批一起響的湊進同一封，不會一秒來三封
    group_wait: 30s
    # 同一組已經寄過，又有新的告警加入時，最快 5 分鐘後再寄一封更新
    group_interval: 5m
    # 一直沒修好就每 4 小時提醒一次。太短會變成噪音被設成垃圾信，太長會忘記
    repeat_interval: 4h
    routes:
      # Watchdog（meta-monitoring.yaml 第 4 條）：永遠在響，只送外部 heartbeat，不寄 email（#40）。
      # 原本寫在規則的 notification_settings，但規則剛建立、第一次評估時會繞到上面的 email（#41 演練和告警 CI 都看到一封）；
      # 明寫成子路由、不往下傳（continue 預設 false），不靠 Grafana 自動產生的路由，比對到就只送 heartbeat。
      # 節奏：每 group_interval 檢查一次，離上次送出已滿 repeat_interval 就重送。
      # 不設成 1m／1m：實測每 2 分鐘才送一次（第 60 秒那次檢查時離上次送出差幾毫秒不滿 1 分鐘）。
      # 30s 檢查一次、滿 50 秒就送：第 30 秒的檢查不夠、第 60 秒的一定夠，穩定每分鐘一次
      - receiver: heartbeat       # meta-monitoring.yaml 裡的 contact point
        object_matchers:
          - ['alert_type', '=', 'watchdog']
        group_by: ['alertname']
        group_wait: 0s
        group_interval: 30s
        repeat_interval: 50s

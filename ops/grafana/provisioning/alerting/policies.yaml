# provisioning 的 policies 會整棵蓋掉 Grafana 的通知樹，UI 上就不能改了，要改只能改這個檔。
# 四個時間、分組的值跟 Grafana 預設一樣，寫出來是為了不用翻文件就知道信多久來一封。

apiVersion: 1

policies:
  - orgId: 1
    receiver: email               # contact-points.yaml 的 name
    # 同一條規則的告警合成一封：好幾個 SLO 同時在燒時（每個 SLO 一個實例）只寄一封
    group_by: ['grafana_folder', 'alertname']
    # 等 30 秒再寄，同時響的湊進同一封
    group_wait: 30s
    group_interval: 5m
    # 沒修好就每 4 小時提醒一次。太短會變成噪音，被當成垃圾信
    repeat_interval: 4h

# 收件人和 SMTP 的值在不進 git 的 deploy/.env，由 ops/compose.yaml 交給 grafana 容器；
# Grafana 讀這個檔時會把 $XXX 換成同名的環境變數。SMTP 是 Grafana 的全域設定（compose 的 GF_SMTP_*），不在這裡。

apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      # policies.yaml 用名字找這個 receiver，UI、API 用 uid；不固定的話每次重建都換一個 uid
      - uid: talkcal-email
        type: email
        settings:
          # 多個收件人用分號分開
          addresses: $ALERT_EMAIL_TO
          singleEmail: true

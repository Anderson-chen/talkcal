# app 停止或指標收不到時，SLO 的 burn-rate 告警（slo-burn-rate.yaml）只看到沒資料、當成正常，這條補上。
# 錯誤率和延遲交給 SLO，不在這裡另設固定門檻，免得同一件事寄兩封。
#
# 查詢只用 job 標籤（Alloy 的 job_name），不寫埠號、路徑：actuator 換埠時這裡不用改。

apiVersion: 1

# 這三條已經由 SLO 告警接手。provisioning 只新增、更新，檔案裡拿掉的規則會留在 grafana-data volume 裡，
# 不明寫刪除的話，啟動過的 Grafana 會一直留著這三條、跟 SLO 告警重複寄信。刪不存在的 uid 不會報錯；
# 所有環境都重啟過一次之後可以拿掉這段
deleteRules:
  - orgId: 1
    uid: talkcal-5xx-ratio
  - orgId: 1
    uid: talkcal-api-p95
  - orgId: 1
    uid: talkcal-assistant-p95

groups:
  - orgId: 1
    name: talkcal-app
    folder: talkcal
    interval: 1m
    rules:
      # ── app 停了（或抓不到指標）──────────────────────────────
      - uid: talkcal-app-down
        title: talkcal app 掛了或抓不到指標
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # up 是 Alloy 每次抓的時候自己記的：抓到 1、抓不到 0
              expr: max(up{job="talkcal-app"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # 1 分鐘 = 連續 4 次抓不到。重啟一次 app 約 30 秒，不會響
        for: 1m
        # Alloy 停了或 Mimir 收不到時 up 整條消失，一樣看不到 app，不能當正常
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/Anderson-chen/talkcal/blob/master/docs/runbooks/talkcal-app-down.md
          summary: talkcal app 連續 1 分鐘抓不到指標
          description: >-
            Alloy 抓 job="talkcal-app" 的 /actuator/prometheus 失敗（up 為 0 或整條沒資料）。
            先看 `docker compose ps` 裡 app 是不是 healthy，再看 Alloy 的除錯頁（127.0.0.1:12345）。

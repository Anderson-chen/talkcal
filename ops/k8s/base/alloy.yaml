# Alloy DaemonSet：每台節點一份，讀那台節點上的 Pod log 檔、抓那台節點上的 Pod 指標。
# 對應 ops/compose.yaml 的 alloy；設定檔是 config.alloy（同一個資料夾）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
# 只讀：列出 Pod 才知道要讀哪些 log 檔、抓哪些指標。不能改任何東西，跟 docker.sock 的「整台主機控制權」差很多
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talkcal-alloy
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talkcal-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talkcal-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: talkcal-ops
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      # control-plane 節點有 taint，不加這個就少收那台的 log（kind 的 NodePort 入口在那台，但 app 不排在那）
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.0    # 跟 ops/compose.yaml 同一版
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          env:
            # 只抓自己這台節點的 Pod（config.alloy 的 discovery.kubernetes）
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: TALKCAL_ENV
              value: k8s                  # overlay 換成 kind / eks
          ports:
            - {name: http, containerPort: 12345}
            - {name: otlp-http, containerPort: 4318}
          # root 才讀得到 /var/log/pods（kubelet 建的檔案是 root 的 0640）。
          # 代價比 docker.sock 小得多：掛進來的只有 log 資料夾，而且唯讀
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy/data}
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        # 位置檔放節點上：Alloy 重啟（或換版）後接著讀，不會重送或漏送。compose 版用具名 volume 做同一件事
        - name: data
          hostPath:
            path: /var/lib/talkcal-alloy
            type: DirectoryOrCreate
---
# app 送 trace 的入口。哪一台的 Alloy 收都一樣
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}

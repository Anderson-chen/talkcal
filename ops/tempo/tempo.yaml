# 單機設定：所有元件跑在同一個程序，資料寫本機的 tempo-data volume，不接物件儲存。
# 為什麼 trace 要另一個資料庫，見 ops/README.md 的「選型理由」。

server:
  http_listen_port: 3200

# 只有 Alloy 會送進來（OTLP/gRPC）：app 的 trace 要先經過 Alloy 的 tail sampling
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal   # 還沒打包的 span，在 volume 裡重啟才不掉
    local:
      path: /var/tempo/blocks

# 不設的話 volume 一直長。trace 用來查最近的單一請求，留 3 天。
# Tempo 3 沒有 compactor，刪過期資料是 backend-worker 的事，保存期限要寫在這裡
backend_worker:
  compaction:
    block_retention: 72h

# ── metrics-generator ────────────────────────────────────────────
# 從 span 算指標寫進 Mimir，Grafana 的 service map 和 span metrics 查詢讀它（見 grafana/provisioning/datasources/datasources.yaml）。
# 服務之間的邊要兩頭的 span 放在一起才算得出來，app 自己的指標只看得到自己，所以在收齊 span 的 Tempo 算。
# 它排在 Alloy 的取樣後面，雲端算出來的請求數會少算、錯誤率會高估（見 ops/README.md 的「對從 trace 算出來的數字的影響」）。
metrics_generator:
  # 分得出是 Tempo 算的指標，不是 Alloy 抓來的
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # 直接寫 Mimir：Tempo 自己算的指標，不需要 Alloy 加標籤、過濾
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true    # 圖上點得回 trace
  processor:
    service_graphs:
      # 資料庫、模型不送 span，只有 app 的 client span。依序找這些屬性，用第一個有值的當虛擬節點的名字：
      # SQL span 用 peer.service（Alloy 換成 postgresql，見 alloy/config.alloy 的 transform），
      # 叫模型的 HTTP client span 用 target.host（llm-chat）
      peer_attributes:
        - peer.service
        - db.system.name
        - target.host
        - server.address
    span_metrics:
      # 預設的維度之外不加：每多一個維度，序列數就乘上它有幾種值
      dimensions: []

# processor 要在 overrides 裡對租戶打開才會跑。沒有多租戶，開在 defaults
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

usage_report:
  reporting_enabled: false

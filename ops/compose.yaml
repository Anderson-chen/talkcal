# 觀測環境：Alloy 收集，Mimir、Loki、Tempo 存，Grafana 畫圖和發告警（各自做什麼見 ops/README.md）。
# 被觀測的服務在 deploy/，要先啟動：Alloy 會接上 deploy/ 建的網路，網路不存在時這組無法啟動。
# 告警寄信、heartbeat 的值在 deploy/.env，啟動這組要帶 --env-file ../deploy/.env。

name: talkcal-observability

services:
  mimir:
    image: grafana/mimir:3.2.5
    container_name: talkcal-mimir
    command:
      - -config.file=/etc/mimir/mimir.yaml
    ports:
      # 只為了在本機直接 curl 查 PromQL：curl 'localhost:9009/prometheus/api/v1/query?query=up'
      - "127.0.0.1:9009:9009"
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      # SLO 的錄製規則，多久重讀一次見 mimir/mimir.yaml 的 ruler_storage
      - ./mimir/rules:/etc/mimir/rules:ro
      - mimir-data:/data
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.10
    container_name: talkcal-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      # Alloy、Grafana 都在 compose 網路裡連 Loki，發佈出來只為了在本機 curl 查 log。
      # 綁 127.0.0.1：雲端機器上這個埠不能讓外面連到
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    container_name: talkcal-tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
    # 不發佈埠：只有 Alloy 寫、Grafana 查，都在 compose 網路裡
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.15
    container_name: talkcal-grafana
    ports:
      # 一定要綁 127.0.0.1：下面關掉了登入，誰連得到誰就是 Admin。
      # 雲端機器上用 SSM 的 port forwarding 接回本機（見 infra/envs/1-ec2/README.md）
      - "127.0.0.1:3000:3000"
    environment:
      # 觀測環境本身停止時，Watchdog 要呼叫的外部網址。Watchdog 還沒啟用，現在沒有設定讀這個值
      # （見 ops/README.md 的「監控本身掛掉：誰來發現」），平常留空。
      # 沒設時給 .invalid，理由見下面的 ALERT_EMAIL_TO；Watchdog 用的 webhook contact point 也一樣
      - HEARTBEAT_URL=${HEARTBEAT_URL:-http://heartbeat-not-configured.invalid/}
      # 只在 localhost 使用，關掉登入，打開網頁就是 Admin。要練習權限管理時拿掉這三行，用預設的 admin / admin 登入
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # 告警寄信的 SMTP。ALERT_SMTP_HOST 沒填時 :+ 展開成空字串，Grafana 當成 false：
      # 告警照樣評估、在 Grafana 上看得到，只是不寄信
      - GF_SMTP_ENABLED=${ALERT_SMTP_HOST:+true}
      - GF_SMTP_HOST=${ALERT_SMTP_HOST:-}
      - GF_SMTP_USER=${ALERT_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${ALERT_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${ALERT_SMTP_FROM:-grafana@talkcal.invalid}
      - GF_SMTP_FROM_NAME=talkcal Grafana
      # 收件人，grafana/provisioning/alerting/contact-points.yaml 讀。
      # 沒填時給 .invalid（保留的網域，永遠解析不到）：空字串的話 contact point 驗證不過，Grafana 無法啟動
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-alerts@talkcal.invalid}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - mimir
      - loki
      - tempo
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: talkcal-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      # Alloy 預設只監聽 127.0.0.1，容器外連不到除錯頁；改成監聽 0.0.0.0，由 ports 限制只開放給本機
      - --server.http.listen-addr=0.0.0.0:12345
      # 位置檔（每個容器的 log 讀到哪）放在 volume 裡，Alloy 重啟後接著讀，不重送也不漏
      - --storage.path=/var/lib/alloy/data
    ports:
      # 除錯頁：管線圖、每個元件抓到哪些 target
      - "127.0.0.1:12345:12345"
      # 給本機 bootRun 的 app 送 trace。容器裡的 app 在 deploy/ 的網路上直接連 alloy:4318
      - "127.0.0.1:4318:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 收容器 log 要用 Docker API 列出容器、讀 stdout。
      # 風險：docker.sock 等於主機 Docker 的完整控制權，:ro 只擋寫檔，擋不住 API 呼叫；Alloy 被攻破就等於主機被攻破。
      # 單機 compose 只能這樣；上 k8s 時改成每個節點一個 Alloy（DaemonSet）直接讀節點上的 log 檔，不碰 Docker API
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      # 備份腳本成功時寫的 .prom，備份告警用（見 alloy/config.alloy 的 prometheus.exporter.unix）。
      # 本機沒有備份排程，是空的 volume；雲端由 infra/envs/1-ec2/compose.ops.yaml 換成 backup-to-s3.sh 寫的資料夾
      - alloy-textfile:/var/lib/alloy/textfile:ro
    networks:
      - default
      # 接上 deploy/ 的網路，才能用服務名抓 app、llm-chat 的指標，deploy/ 的 app 也才能連 alloy:4318
      - talkcal-deploy
    depends_on:
      - mimir
      - loki
      - tempo
    restart: unless-stopped

  # ── 假信箱 ──────────────────────────────────────────────────────
  # 試告警信用的 SMTP，收到的信在 http://localhost:8025 看，不寄到外面。平常不啟動，雲端也不啟動：
  #   1. deploy/.env 填 ALERT_SMTP_HOST=mailpit:1025，其他 ALERT_SMTP_* 留空
  #   2. docker compose --env-file ../deploy/.env --profile mailtest up -d
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: talkcal-mailpit
    profiles: ["mailtest"]
    ports:
      # 只發佈收件匣網頁。SMTP 的 1025 只給同網路的 grafana
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

networks:
  talkcal-deploy:
    # deploy/ 建的網路，這組只接上去，down 時不刪。
    # deploy/compose.yaml 沒自訂網路，名字是 Compose 預設的 <專案名>_default
    external: true
    name: talkcal-deploy_default

volumes:
  mimir-data:
  loki-data:
  tempo-data:
  grafana-data:
  alloy-data:
  alloy-textfile:

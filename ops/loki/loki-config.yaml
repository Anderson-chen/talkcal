# 單機設定：所有元件跑在一個容器，資料寫本機的 loki-data volume，不接物件儲存。

auth_enabled: false          # 關掉多租戶，Alloy 送、Grafana 查都不必帶租戶 header

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki         # ops/compose.yaml 把 loki-data volume 掛在這
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1      # 只有一個實例，寫不出第二份
  ring:
    kvstore:
      store: inmemory        # 只有一個實例，ring 不必跟別人共用

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13            # Loki 3.x 的 tsdb 要 v13
      index:
        prefix: index_
        period: 24h          # compactor 的 retention 要求索引週期是 24h

# 不設保存期限的話 log 永久保留，本機 volume 會一直長。
# 30 天跟 mimir.yaml 的指標一樣長：指標查得到的那段時間，log 也還在。
# compactor 以 chunk 為單位刪，chunk 裡最新的一筆也過期才刪，所以剛過 30 天的 log 可能還查得到一陣子。
compactor:
  retention_enabled: true
  delete_request_store: filesystem   # 開 retention 時必填

limits_config:
  retention_period: 30d

# 不把用量回報給 Grafana Labs
analytics:
  reporting_enabled: false

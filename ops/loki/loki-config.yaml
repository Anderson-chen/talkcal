# Loki 的工作：集中存 log，並提供查詢 API 給 Grafana。
# 這是「單機 / 學習」用的最小設定 —— 全部塞在一個容器、資料寫本機檔案，不碰任何雲端物件儲存。
# 正式大規模會拆成多個元件 + 接 S3 那類物件儲存，那是之後的事。

auth_enabled: false          # 關掉多租戶驗證。單機自己用不需要，少一層麻煩

server:
  http_listen_port: 3100     # API 埠，跟 compose 對外開的一致

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki         # 所有資料 / 狀態的根目錄（對應 compose 掛進來的 loki-data volume）
  storage:
    filesystem:              # 存本機檔案就好，不接 S3 / GCS
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1      # 單機只有一份，不做複製
  ring:
    kvstore:
      store: inmemory        # 叢集協調狀態放記憶體，單機夠用

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb            # Loki 3.x 建議的索引格式
      object_store: filesystem
      schema: v13            # 搭配 tsdb 的 schema 版本（Loki 3.x 要求 v13）
      index:
        prefix: index_
        period: 24h

# 關掉「用量回報」，跟 Grafana 那邊同個理由：學習環境不往外送任何東西
analytics:
  reporting_enabled: false

# 單機設定：所有元件在同一個 process 裡執行（-target=all，預設值），資料寫本機的 mimir-data volume，不接物件儲存。
# 指標由 Alloy 用 remote_write 推進來，Mimir 自己不抓。為什麼用 Mimir 不用 Prometheus，見 ops/README.md 的「選型理由」。

# 開著的話每個寫入、查詢都要帶 X-Scope-OrgID。關掉後所有資料歸在 anonymous 這個租戶，
# rules/ 底下的資料夾就用這個名稱
multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: warn            # info 會一直印 ring、compactor 的例行訊息

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/blocks

blocks_storage:
  tsdb:
    dir: /data/tsdb          # 還沒打包成區塊的資料和 WAL，要在 volume 裡重啟才不掉
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor

# 錄製規則從唯讀掛進來的 ops/mimir/rules 讀，規則跟著版控走。用 API 上傳的規則只存在容器的資料裡，換機器就沒了。
# 底下一層資料夾是租戶名稱。ruler 每 10 分鐘（-ruler.poll-interval 預設）重讀，要馬上生效就 restart mimir
ruler_storage:
  backend: local
  local:
    directory: /etc/mimir/rules

ruler:
  rule_path: /data/ruler     # 預設在工作目錄，容器裡不一定能寫
  # 不設 alertmanager_url：告警規則和寄信都在 Grafana（grafana/provisioning/alerting/），ruler 只做錄製

# 預設每筆寫進 3 個 ingester，只有一個 ingester 時要改成 1
ingester:
  ring:
    replication_factor: 1
    instance_addr: 127.0.0.1  # ring 裡只有自己，不必去猜容器 IP

store_gateway:
  sharding_ring:
    replication_factor: 1

distributor:
  ring:
    instance_addr: 127.0.0.1

# exemplar（指標點上的 trace id）預設是 0，不收，Grafana 圖上就點不進 Tempo。數字是整個租戶同時記住的上限
limits:
  max_global_exemplars_per_user: 100000
  # 預設 0 是永久保留，本機 volume 會一直長。
  # 至少要 28 天：SLO 的 error budget 是滾動 28 天（rules/anonymous/slo.yaml 的 ratio_rate28d），短了就算不出來；多 2 天當緩衝。
  # 查詢範圍也受這個值限制，超過 30 天的時間就算區塊還沒刪也查不到
  compactor_blocks_retention_period: 30d

# 不把用量回報給 Grafana Labs
usage_stats:
  enabled: false

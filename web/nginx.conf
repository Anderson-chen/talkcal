# 部署時的 nginx：一個入口兩件事，瀏覽器只看到這一個來源，所以後端不必開 CORS。
#   /       → Vue 打包好的靜態檔
#   /api/*  → app 容器
# 開發時同樣的事由 vite.config.ts 的 proxy 做，前端程式碼裡的 /api 兩邊都不用改。

# ── 濫用防護（#12）──────────────────────────────────────────────────
# 只限 AI 助理的「發問」（POST /api/calendar/assistant）：每次都會叫模型，一輪還可能叫好幾次，
# 是唯一貴的請求 —— 雲端走 Bedrock 按 token 計費，本機是 GPU 塞滿（OWASP LLM10 Unbounded Consumption）。
# 查行程、看對話紀錄很便宜，不限。
#
# 做法：key 是空字串的請求 nginx 不計數。用 map 只讓「POST 發問」有 key，其他請求都是空字串，
# 所以 limit_req 可以直接放在 /api/ 底下，不必為了一條路徑把 proxy 設定抄一份。
map "$request_method $uri" $assistant_per_ip {
    "POST /api/calendar/assistant" $binary_remote_addr;
    default "";
}
map "$request_method $uri" $assistant_all {
    "POST /api/calendar/assistant" "all";
    default "";
}

# 兩道，各擋一種情況：
#   每個 IP 每分鐘 10 次 —— 一個人正常聊天大約 10–20 秒問一次，10 次已經很寬；擋的是一個人用腳本狂打
#   全站每分鐘 30 次     —— 擋很多 IP 一起打（只限 IP 的話，換 IP 就繞過了），也就是帳單和 GPU 的總上限。
#                           2026-10-12 量到每分鐘 60 次、問題隨機混合時模型就塞爆回 502（postmortem），要比它低
# burst：允許一下子多幾次（例如連按），超過才擋；nodelay 是允許範圍內立刻處理，不排隊慢慢放
limit_req_zone $assistant_per_ip zone=assistant_per_ip:1m rate=10r/m;
limit_req_zone $assistant_all    zone=assistant_all:1m    rate=30r/m;

# 登入、註冊（#103）：每個 IP 每分鐘 5 次（可多衝 5 次）。正常人不會一分鐘打錯密碼 5 次以上；
# 擋的是用腳本暴力試密碼、或大量註冊帳號。後端每次登入都要算 BCrypt（故意算得慢），不擋的話也會被拿來耗 CPU
map "$request_method $uri" $auth_per_ip {
    "POST /api/auth/login"    $binary_remote_addr;
    "POST /api/auth/register" $binary_remote_addr;
    default "";
}
limit_req_zone $auth_per_ip zone=auth_per_ip:1m rate=5r/m;
# 被擋時的訊息依路徑選：登入頁上說「問得太快了」很奇怪
map $uri $rate_limited_message {
    ~^/api/auth/ "嘗試太多次了，請等一分鐘再試";
    default      "問得太快了，請等一分鐘再試";
}
# 預設回 503，看起來像伺服器壞了；429 才是「你太快了」，前端和監控都分得出來
limit_req_status 429;
# 被擋是預期中的事，記成 warn 就好，不要跟真的錯誤混在 error 裡
limit_req_log_level warn;

# 真正的使用者 IP：雲端上 nginx 前面還有 Caddy，nginx 看到的來源永遠是 Caddy 容器，
# 所有人會共用同一個 IP 的額度。所以只要來源是 Docker 內部網段，就改用它帶來的 X-Forwarded-For。
# 安全的前提：web 的埠只綁 127.0.0.1（deploy/compose.yaml），外面只能經過 Caddy 進來，
# 而 Caddy 會覆寫使用者自己送來的 X-Forwarded-For，偽造不了
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# 使用者原本用的是 http 還是 https（#127）：雲端上 HTTPS 在 Caddy 那層就解開了，nginx 自己看到的永遠是 http（$scheme）。
# 照轉的話，app 組出來的 Google、GitHub 回呼網址會是 http://，跟登記的 https:// 對不上。
# 所以 Caddy 有帶 X-Forwarded-Proto 就照轉它的；本機沒有 Caddy、沒帶這個 header，才用自己的 $scheme。
# 偽造不了的理由跟上面的 X-Forwarded-For 一樣：外面只能經過 Caddy 進來，Caddy 會覆寫使用者自己送的
map $http_x_forwarded_proto $original_scheme {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;

    root /usr/share/nginx/html;

    location /api/ {
        # 執行期才問 DNS app 在哪，而且最多記 10 秒（#90）。
        # 直接寫 proxy_pass http://app:8090 的話，nginx 只在啟動時解析一次、之後一直用那個 IP：
        # app 容器重建換了 IP、web 沒跟著重建，/api 就全部 502（2026-10-14 在 EC2 上踩到）。
        # 寫成變數 nginx 才會每次照 resolver 去問；沒有接路徑，所以請求的路徑原樣轉過去，跟以前一樣
        #
        # 這個檔案是 nginx 映像檔的 template（web/Dockerfile），${...} 在容器啟動時換成環境變數（#56）：
        #   NGINX_LOCAL_RESOLVERS —— 容器 /etc/resolv.conf 裡的 DNS。compose 是 Docker 的 127.0.0.11，k8s 是 CoreDNS
        #   TALKCAL_APP_UPSTREAM  —— app 在哪。compose 是服務名稱 app:8090（預設值寫在 Dockerfile）；
        #                            k8s 要寫完整名稱 app.<namespace>.svc.cluster.local:8090，nginx 的 resolver 不套 search 網域
        # 8090 是容器內部的埠，不是發佈到主機的 18090
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $app_upstream http://${TALKCAL_APP_UPSTREAM};
        proxy_pass $app_upstream;

        # 讓 app 知道原始請求長怎樣，不然它看到的來源永遠是 nginx 容器的 IP。Host 用 $http_host（帶埠號，$host 會去掉）：Google 登入的回呼網址從它組出來（#105）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;

        # nginx 預設等上游 60 秒就回 504。但 app 叫一次模型最久等 2 分鐘才放棄
        # （spring.ai.openai.chat.timeout=2m）。注意 AI 助理一輪可能叫模型好幾次（先查行程再提議），
        # 所以這個上限擋得住「一次呼叫卡死」，擋不住「好幾次都很慢」。
        # 這裡要比 app 的逾時長：讓 app 先逾時、回它自己的 502 + 錯誤原因，
        # 而不是 nginx 先切斷、前端只拿到一頁看不懂的 504 HTML。
        proxy_read_timeout 180s;

        # 上面兩道限制。只對「POST 發問」有作用（見檔案開頭的 map），其他 /api 請求 key 是空的、不計數
        limit_req zone=assistant_per_ip burst=5 nodelay;
        limit_req zone=assistant_all burst=10 nodelay;
        # 登入、註冊（#103）：key 只在那兩條路徑有值，其他請求不計數
        limit_req zone=auth_per_ip burst=5 nodelay;
        error_page 429 = @rate_limited;
    }

    # 被擋時回 JSON，格式跟 app 的錯誤一樣（{"error": ...}）：前端照常把 error 顯示給使用者，
    # 不會拿到一頁 nginx 的 HTML。Retry-After 告訴呼叫端多久後再試
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"$rate_limited_message"}';
    }

    # Vite 打包出來的 js/css 檔名帶內容雜湊（index-CZ3aFMNT.js），內容一改檔名就變，
    # 所以可以讓瀏覽器放心快取一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 檔名永遠一樣，卻指向最新的雜湊檔名，所以每次都要回來問有沒有新版。
    # 不加這行，部署新版後使用者可能還拿著舊的 index.html、載入舊的 js。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

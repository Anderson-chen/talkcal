# 部署時的入口：/ 送 Vue 打包好的靜態檔，/api/ 轉給 app。瀏覽器只看到一個來源，後端不必開 CORS。
# 開發時由 vite.config.ts 的 proxy 做同一件事。

# ── 限流 ──────────────────────────────────────────────────────
# 只限 AI 助理的發問：每次都呼叫模型、一輪可能呼叫好幾次，雲端按 token 計費，本機會占滿 GPU
# （OWASP LLM10 Unbounded Consumption）。查行程、讀對話紀錄很便宜，不限。
# key 是空字串的請求 nginx 不計數，所以 map 只讓發問有 key，limit_req 就能直接放在整個 /api/ 底下。
map "$request_method $uri" $assistant_per_ip {
    "POST /api/calendar/assistant" $binary_remote_addr;
    default "";
}
map "$request_method $uri" $assistant_all {
    "POST /api/calendar/assistant" "all";
    default "";
}

# 每個 IP 每分鐘 10 次：正常聊天大約 10–20 秒問一次，擋的是一個人用腳本大量發問。
# 全站每分鐘 30 次：擋換 IP 繞過的情況，也是帳單和 GPU 的總上限。每分鐘 60 次、問題隨機混合時模型會超過負荷、回 502
# （見 docs/postmortems/2026-10-12-deploy-cuts-in-flight-requests.md），要比它低。
limit_req_zone $assistant_per_ip zone=assistant_per_ip:1m rate=10r/m;
limit_req_zone $assistant_all    zone=assistant_all:1m    rate=30r/m;

# 登入、註冊每個 IP 每分鐘 5 次，擋暴力試密碼和大量註冊。後端每次登入都要算 BCrypt，不擋的話也會被拿來耗 CPU
map "$request_method $uri" $auth_per_ip {
    "POST /api/auth/login"    $binary_remote_addr;
    "POST /api/auth/register" $binary_remote_addr;
    default "";
}
limit_req_zone $auth_per_ip zone=auth_per_ip:1m rate=5r/m;
# 登入頁上顯示「問得太快了」很奇怪
map $uri $rate_limited_message {
    ~^/api/auth/ "嘗試太多次了，請等一分鐘再試";
    default      "問得太快了，請等一分鐘再試";
}
# 預設的 503 看起來像伺服器故障，429 前端和監控才分得出是太快
limit_req_status 429;
# 被擋是預期中的事，不跟真的錯誤混在 error 裡
limit_req_log_level warn;

# 雲端上 nginx 前面還有 Caddy，看到的來源都是 Caddy 容器，所有人會共用一個 IP 的額度，
# 所以來源是 Docker 內部網段時改用 X-Forwarded-For。這樣偽造不了，前提是 web 的埠只綁 127.0.0.1
# （deploy/compose.yaml），外面只能經過 Caddy 進來，而 Caddy 會覆寫使用者自己送的 X-Forwarded-For。
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# HTTPS 在 Caddy 那層就解開了，nginx 的 $scheme 都是 http。照轉的話 app 組出來的 Google、GitHub 回呼網址
# 會是 http://，跟登記的 https:// 對不上。本機沒有 Caddy，才用自己的 $scheme。偽造不了的前提同上
map $http_x_forwarded_proto $original_scheme {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# ── trace ──────────────────────────────────────────────────────
# trace 從 nginx 開始：從 app 才開始的話，被 nginx 擋掉的 429、nginx 等 app 的時間都不在 trace 上，
# 跟使用者感受到的時間對不起來。模組在 Dockerfile 載入。
# 這個模組只支援 OTLP/gRPC，所以 Alloy 要開 4317（見 ops/alloy/config.alloy）。
# ops/ 沒有啟動時只在 error log 印出送不出去，請求照常處理；連線在背景重試，Alloy 恢復後就重新連上。
otel_exporter {
    endpoint alloy:4317;
}
otel_service_name talkcal-web;

server {
    listen 80;

    root /usr/share/nginx/html;

    location /api/ {
        # proxy_pass 直接寫 http://app:8090 的話，nginx 只在啟動時解析一次：app 容器重建換了 IP、web 沒重建，
        # /api 就全部 502。寫成變數才會照 resolver 每次向 Docker 的 DNS 查詢，最多記 10 秒。
        # 變數後面不接路徑，請求的路徑原樣轉過去。8090 是容器內部的埠
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream http://app:8090;
        proxy_pass $app_upstream;

        # Host 用 $http_host：$host 會去掉埠號，Google 登入的回呼網址從 Host 組出來
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;

        # 只追 /api：靜態檔不經過 app，一個頁面就十幾個，只會占滿 Tempo 的空間。
        # 請求帶了 traceparent 就接在那個 trace 底下，沒帶就開新的；都把 traceparent 傳給 app。
        # 這裡不能抽樣：app 照 traceparent 裡的旗標決定記不記，要留哪些 trace 在收集端決定
        otel_trace on;
        otel_trace_context propagate;
        # span 名稱不用 $uri：/api/calendar/events/42 這種帶 id 的路徑每個都不一樣，span metrics 會一個路徑一條線。
        # 哪一條路由記在 app 的 span 上
        otel_span_name "$request_method /api";

        # 要比 app 呼叫一次模型的逾時（spring.ai.openai.chat.timeout=2m）長：讓 app 先逾時、回 app 自己的 502 和原因，
        # 不然前端只拿到 nginx 的 504 HTML。助理一輪可能呼叫模型好幾次，每次都很慢的話，總時間還是可能超過這個上限
        proxy_read_timeout 180s;

        # key 只在發問、登入、註冊有值，其他 /api 請求不計數（見上面的 map）
        limit_req zone=assistant_per_ip burst=5 nodelay;
        limit_req zone=assistant_all burst=10 nodelay;
        limit_req zone=auth_per_ip burst=5 nodelay;
        error_page 429 = @rate_limited;
    }

    # 格式跟 app 的錯誤一樣（{"error": ...}），前端照常顯示 error，不會拿到 nginx 的 HTML
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"$rate_limited_message"}';
    }

    # Vite 打包的檔名帶內容雜湊，內容一改檔名就變，可以快取一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 檔名不變、指向最新的雜湊檔名：不每次向伺服器確認的話，部署後使用者可能還載入舊的 js
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

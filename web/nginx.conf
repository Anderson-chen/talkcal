# 部署時的 nginx：一個入口兩件事，瀏覽器只看到這一個來源，所以後端不必開 CORS。
#   /       → Vue 打包好的靜態檔
#   /api/*  → app 容器
# 開發時同樣的事由 vite.config.ts 的 proxy 做，前端程式碼裡的 /api 兩邊都不用改。

server {
    listen 80;

    root /usr/share/nginx/html;

    location /api/ {
        # app 是 compose 的服務名稱，Docker 內建 DNS 解析；8090 是容器內部的埠，不是發佈到主機的 18090
        proxy_pass http://app:8090;

        # 讓 app 知道原始請求長怎樣，不然它看到的來源永遠是 nginx 容器的 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx 預設等上游 60 秒就回 504。但 app 叫一次模型最久等 2 分鐘才放棄
        # （spring.ai.openai.chat.timeout=2m）。注意 AI 助理一輪可能叫模型好幾次（先查行程再提議），
        # 所以這個上限擋得住「一次呼叫卡死」，擋不住「好幾次都很慢」。
        # 這裡要比 app 的逾時長：讓 app 先逾時、回它自己的 502 + 錯誤原因，
        # 而不是 nginx 先切斷、前端只拿到一頁看不懂的 504 HTML。
        proxy_read_timeout 180s;
    }

    # Vite 打包出來的 js/css 檔名帶內容雜湊（index-CZ3aFMNT.js），內容一改檔名就變，
    # 所以可以讓瀏覽器放心快取一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 檔名永遠一樣，卻指向最新的雜湊檔名，所以每次都要回來問有沒有新版。
    # 不加這行，部署新版後使用者可能還拿著舊的 index.html、載入舊的 js。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

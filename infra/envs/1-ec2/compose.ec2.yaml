# 疊在 deploy/compose.yaml 上面，只寫 EC2 跟本機不一樣的地方，兩種 model_backend 共用；模型從哪來在 compose.<bedrock|gpu>.yaml。
#
#   docker compose -f deploy/compose.yaml -f infra/envs/1-ec2/compose.ec2.yaml \
#                  -f infra/envs/1-ec2/compose.<bedrock|gpu>.yaml up -d
#
# 不另寫一份完整的雲端 compose：兩份會逐漸出現差異，本機驗過的就不等於雲端執行的。
# 疊上去時同名的 key 以這份為準，volumes 依容器裡的路徑合併，environment 依變數名合併。
# 注意：這份的相對路徑是從第一個檔案的資料夾（deploy/）算起，不是這個檔案的資料夾。
# 變數都在 deploy/.env，內容見 secrets.tf。

services:
  # 什麼時候讀密碼見 deploy/compose.yaml。Terraform 換了密碼，deploy.sh 會再 ALTER ROLE 同步
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD}

  app:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD}
      # session cookie 只走 HTTPS。本機是 http，開了瀏覽器就不把 cookie 送回來，所以只在這裡開
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      # endpoint 空白就是 AWS S3 本身。key 由 deploy/compose.yaml 交給 app
      TALKCAL_ARCHIVE_ENDPOINT: ""
      TALKCAL_ARCHIVE_BUCKET: ${ARCHIVE_BUCKET:?缺 ARCHIVE_BUCKET}
      TALKCAL_ARCHIVE_REGION: ${ARCHIVE_REGION:?缺 ARCHIVE_REGION}
    # 沒有上限的話，JVM 的 MaxRAMPercentage=75 算的是整台機器：8 GB（gpu 是 16 GB）還要分給 PostgreSQL 和整組觀測，
    # app 會占掉大半台機器的記憶體。設成 2g 的話，75% 約是 1.5 GB heap
    mem_limit: 2g

  # 本機扮演 S3 的 RustFS 不啟動：放進一個不會被打開的 profile。
  # app 沒有 depends_on RustFS，不用改 app
  archive:
    profiles: [local-archive]
  archive-init:
    profiles: [local-archive]

  # ── HTTPS 入口 ──────────────────────────────────────────────────
  # Caddy 自己跟 Let's Encrypt 拿憑證、續期；憑證放 nginx 的話還要另外執行 certbot、排續期。
  # 對外只有 Caddy 的 80/443，web 的 18080 還是只綁 127.0.0.1
  caddy:
    image: caddy:2.11.6-alpine
    container_name: talkcal-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"               # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?缺 SITE_ADDRESS}
    volumes:
      - ../infra/envs/1-ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      # 憑證放 volume：重建容器不必重新申請，Let's Encrypt 有申請次數上限
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

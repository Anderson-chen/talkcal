# 疊在 deploy/compose.yaml 上面的雲端差異。只寫「EC2 跟本機不一樣」的地方，其他全部沿用。
#
#   docker compose -f deploy/compose.yaml -f infra/envs/1-ec2/compose.ec2.yaml up -d
#
# 為什麼不另寫一份完整的正式版 compose：兩份遲早會不一樣，本機驗證過的就不等於雲端上跑的。
# 疊加的規則：同名的 key 以這份為準；volumes 依容器裡的路徑合併，environment 依變數名合併。
# 注意：這份裡的相對路徑是相對於第一個檔案（deploy/）解析的，不是這個檔案所在的資料夾。
#
# 用到的變數（SITE_ADDRESS、MODELS_DIR、DB_PASSWORD）在 deploy/.env，
# 由 deploy.sh 從 SSM Parameter Store 拉下來（Terraform 在 secrets.tf 產生）。

services:
  # 模型來源：本機是 C:/llm/models，這裡換成 deploy.sh 從 S3 拉下來的資料夾。
  # 容器裡的路徑一樣是 /seed，所以這行會蓋掉 compose.yaml 那行，播種的腳本不用動。
  model-seed:
    volumes:
      - ${MODELS_DIR:?缺 MODELS_DIR}:/seed:ro

  # DB 密碼：本機寫死 talkcal，這裡換成 Terraform 隨機產生的。
  # 只在 volume 第一次初始化時生效；之後要換密碼得進資料庫改，光改這裡沒用。
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD}

  app:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?缺 DB_PASSWORD}
    # 本機沒設記憶體上限，JVM 的 MaxRAMPercentage=75 是「整台主機的 75%」。
    # 本機記憶體大不覺得，這台只有 16GB，還要給 Postgres 和整組觀測，app 一吃就是 12GB。
    # 設了上限之後，75% 改成以 2GB 算（約 1.5GB heap）。
    mem_limit: 2g

  # ── HTTPS 入口：本機沒有這一層 ─────────────────────────────────────────────
  # Caddy 自動跟 Let's Encrypt 拿憑證、自動續期，再轉給 web（nginx）。
  # 不把憑證塞進 nginx：那要另外跑 certbot、排續期，Caddy 一個設定檔就包了。
  # web 的 18080 照舊只綁 127.0.0.1，對外只有 Caddy 的 80/443。
  caddy:
    image: caddy:2.10.0-alpine
    container_name: talkcal-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"               # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?缺 SITE_ADDRESS}
    volumes:
      - ../infra/envs/1-ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      # 憑證存 volume：重建容器不必重新申請（Let's Encrypt 有申請次數上限）
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

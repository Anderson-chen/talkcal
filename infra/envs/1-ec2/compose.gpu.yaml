# model_backend = gpu：跟本機一樣自己跑 llama-server，只有模型檔的來源不同。
# 疊在 deploy/compose.yaml、compose.ec2.yaml 上面（deploy.sh 依 MODEL_BACKEND 選這份）。
#
# 模型來源不必在這裡蓋掉：deploy/compose.yaml 的 model-seed 本來就掛 ${MODELS_DIR}（#49 之前本機寫死 C:/llm/models，
# 才需要這份把它換掉）。deploy.sh 把 MODELS_DIR 設成從 S3 拉下來的 /opt/talkcal/models，播種的腳本不用動。
# 這份留著：deploy.sh 照 compose.<MODEL_BACKEND>.yaml 找檔案，之後 gpu 專屬的差異（例如記憶體上限）也寫這裡。

services: {}

# 疊在 ops/compose.yaml 上面，只寫 EC2 跟本機不一樣的地方。
#
#   docker compose -f ops/compose.yaml -f infra/envs/1-ec2/compose.ops.yaml up -d

services:
  alloy:
    environment:
      # 一般請求只留 10%，錯的和慢的不論比例都留（規則見 ops/README.md 的「Trace 取樣」）。本機不設，全留
      TRACE_SAMPLING_PERCENT: "10"
      # 要比最慢的請求久，慢請求的根 span 才趕得上：呼叫模型的逾時 2 分鐘（spring.ai.openai.chat.timeout）再加 5 秒
      TRACE_SAMPLING_DECISION_WAIT: 125s
    volumes:
      # backup-to-s3.sh 在這裡寫最後一次成功備份的 .prom。容器裡的路徑跟 ops/compose.yaml 一樣，所以會蓋掉本機那個空 volume
      - /opt/talkcal/metrics:/var/lib/alloy/textfile:ro

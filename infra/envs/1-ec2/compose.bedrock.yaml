# model_backend = bedrock：機器上不執行模型，app 改呼叫 Bedrock。疊在 deploy/compose.yaml、compose.ec2.yaml 上面。
# app 的程式不用改：llama-server 和 Bedrock 都講 OpenAI 的 Chat Completions，只換位址、key、模型名稱。
# BEDROCK_* 的值見 secrets.tf，API key 來自 bedrock.tf。

services:
  # 不在 deploy/compose.yaml 裡刪：本機還要用，model_backend 切回 gpu 時也不用改任何東西
  model-seed:
    profiles: [gpu]
  llm-chat:
    profiles: [gpu]

  app:
    environment:
      SPRING_AI_OPENAI_CHAT_BASEURL: ${BEDROCK_BASE_URL:?缺 BEDROCK_BASE_URL}
      SPRING_AI_OPENAI_APIKEY: ${BEDROCK_API_KEY:?缺 BEDROCK_API_KEY}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${BEDROCK_MODEL:?缺 BEDROCK_MODEL}
      # token 指標的 model.backend 標籤，成本 dashboard 用這個標籤挑出要照 Bedrock 單價算的 token
      TALKCAL_AI_BACKEND: bedrock
    # deploy/compose.yaml 的 depends_on 有 llm-chat，llm-chat 不啟動的話 compose 會報錯。
    # 不加 !override 的話 depends_on 是合併，llm-chat 還在。!override 要 compose 2.24.4 以上
    depends_on: !override
      postgres:
        condition: service_healthy

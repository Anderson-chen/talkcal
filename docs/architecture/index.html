<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talkcal 架構圖</title>
<meta name="description" content="talkcal AWS 階段一的互動架構圖：照著請求、部署、秘密、成本四條路線走一遍，每個元件由哪個檔案、哪幾行決定，為什麼這樣選，業界怎麼做。">
<!--
  維護規則（也寫在專案 CLAUDE.md）：改到 infra/、deploy/、ops/ 或 web/nginx.conf 時，檢查這份圖的
  元件（R）、檔案行號（F）、檔案用途（FP）、參數位置（L）、導覽路線（ROUTES）、依賴、參數值還對不對，
  跟程式碼放同一個 PR，並更新頁尾 #checked 的日期。
  行號以 master 為準；點行號會在頁內抓 master 的原始碼顯示那幾行。
-->
<style>
:root{
  --bg:#ffffff;--surface-1:#f5f4ef;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;
  --border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.22);--border-stronger:rgba(0,0,0,.38);
  --bg-accent:#E6F1FB;--border-accent:#185FA5;--text-accent:#0C447C;
  --bg-warning:#FAEEDA;--border-warning:#BA7517;--text-warning:#633806;
  --bg-success:#EAF3DE;--border-success:#3B6D11;--text-success:#27500A;
  --radius:8px;--font-sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1e1d;--surface-1:#2c2c2a;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;
  --border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-stronger:rgba(255,255,255,.4);
  --bg-accent:#0C447C;--border-accent:#85B7EB;--text-accent:#B5D4F4;
  --bg-warning:#633806;--border-warning:#EF9F27;--text-warning:#FAC775;
  --bg-success:#27500A;--border-success:#97C459;--text-success:#C0DD97;
}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:780px;padding:24px 16px 48px;background:var(--bg);color:var(--text-primary);font:15px/1.7 var(--font-sans)}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
header p{margin:0;color:var(--text-secondary);font-size:14px}
a{color:var(--text-accent)}
button{font-family:var(--font-sans)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ── 導覽路線 ── */
#story{border:0.5px solid var(--border-strong);border-radius:12px;padding:12px 14px;margin:16px 0 12px}
.routes{display:flex;flex-wrap:wrap;gap:6px}
.routes button{font-size:13px;padding:4px 12px;border-radius:999px;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
.routes button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
#r-intro{font-size:14px;color:var(--text-secondary);margin:10px 0 6px}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0 0 10px}
.steps button{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px 2px 3px;border-radius:999px;border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text-secondary);cursor:pointer}
.steps .no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-1);font-size:12px;font-weight:600}
.steps button.on{border-color:var(--border-accent);color:var(--text-accent)}.steps button.on .no{background:var(--border-accent);color:var(--bg)}
#r-now{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;font-size:14px}
#r-now b{font-weight:500}#r-now p{margin:4px 0 0}
.nav{display:flex;gap:8px;margin-top:8px}.nav button{font-size:13px;padding:3px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text-primary);cursor:pointer}.nav button:disabled{opacity:.4;cursor:default}
.ssrc{font-size:12px;color:var(--text-secondary);margin-top:6px}
/* ── 控制列與圖 ── */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;color:var(--text-secondary)}
.seg{display:inline-flex}.seg button{font-size:13px;padding:4px 12px;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
.seg button:first-child{border-radius:var(--radius) 0 0 var(--radius)}.seg button:last-child{border-radius:0 var(--radius) var(--radius) 0}
.seg button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
select{font:13px var(--font-sans);padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);max-width:100%}
.diagram{overflow-x:auto}
svg text{font-family:var(--font-sans)}
.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.arr{stroke:var(--text-secondary);stroke-width:1.2;fill:none}
.nd{cursor:pointer}.nd rect.b{fill:var(--surface-1);stroke:var(--border-strong);stroke-width:.5}
.nd rect.c{fill:transparent;stroke:var(--border-stronger);stroke-width:.6}
.nd.sel rect{stroke:var(--border-accent);stroke-width:2}.nd.sel rect.b{fill:var(--bg-accent)}.nd.sel text{fill:var(--text-accent)}
.nd.dep rect{stroke:var(--border-warning);stroke-width:1.5}.nd.dep rect.b{fill:var(--bg-warning)}.nd.dep text{fill:var(--text-warning)}
.nd.use rect{stroke:var(--border-success);stroke-width:1.5}.nd.use rect.b{fill:var(--bg-success)}.nd.use text{fill:var(--text-success)}
.nd.off{opacity:.3}
.ring{fill:none;stroke:var(--text-primary);stroke-width:1.6;stroke-dasharray:5 3;pointer-events:none}
.num{pointer-events:none}.num rect{fill:var(--border-accent)}.num text{fill:var(--bg);font-size:11px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-secondary);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{flex:none;width:18px;height:12px;border-radius:3px}
/* ── 細節卡片：元件（藍色左邊框）和檔案（灰底、深色標籤）── */
.card{border:0.5px solid var(--border-strong);border-left-width:4px;border-radius:12px;padding:12px 14px;margin-top:12px}
.card.comp{border-left-color:var(--border-accent)}
.card.file{border-left-color:var(--text-secondary);background:var(--surface-1)}
.kind{display:inline-block;font:500 11px var(--font-sans);padding:1px 8px;border-radius:4px;margin-right:8px;vertical-align:2px}
.comp .kind{background:var(--bg-accent);color:var(--text-accent)}.file .kind{background:var(--text-secondary);color:var(--bg)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.head .name{font:500 14px var(--font-mono);word-break:break-all}
.purpose{font-size:14px;margin:4px 0 8px}
.x{margin-left:auto;font-size:12px;border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text-secondary);border-radius:var(--radius);padding:1px 8px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;vertical-align:top;padding:6px 8px;border-top:0.5px solid var(--border)}th{font-weight:500;color:var(--text-secondary)}code{font:12px var(--font-mono)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--bg)}tr.row.on td{background:var(--bg-accent)}
.pill{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg);border:0.5px solid var(--border-strong);white-space:nowrap}.pill.none{color:var(--text-muted);border-color:var(--border)}
.h{font-size:12px;font-weight:500;color:var(--text-secondary);margin:14px 0 4px}
.flist{font-size:13px;line-height:1.7}.flist>div{padding:4px 0;border-top:0.5px solid var(--border)}.flist .fp{color:var(--text-secondary);font-size:12px}
.link{cursor:pointer;color:var(--text-accent);text-decoration:underline;background:none;border:0;padding:0;font:inherit}
.dep-w{color:var(--text-warning)}.dep-s{color:var(--text-success)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cmp>div{border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px;line-height:1.6}.cmp b{display:block;font-weight:500;font-size:12px;color:var(--text-secondary);margin-bottom:2px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin-left:6px}.ok{background:var(--bg-success);color:var(--text-success)}.fix{background:var(--bg-warning);color:var(--text-warning)}.na{color:var(--text-secondary);border:0.5px solid var(--border)}
.src{font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.8}
/* ── 原始碼視窗 ── */
dialog{width:min(760px,calc(100% - 24px));max-height:calc(100% - 48px);overflow:hidden;padding:0;border:0.5px solid var(--border-strong);border-radius:12px;background:var(--bg);color:var(--text-primary)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.dlg-h{padding:12px 14px;border-bottom:0.5px solid var(--border)}
.dlg-h .name{font:500 14px var(--font-mono);word-break:break-all}
.dlg-h p{margin:2px 0 8px;font-size:13px;color:var(--text-secondary)}
.dlg-a{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;align-items:center}
.dlg-a button{font-size:13px;padding:2px 10px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
#code-body{overflow:auto;font:12px/1.6 var(--font-mono);padding:6px 0}
.cl{display:flex;white-space:pre}.cl .n{flex:none;width:44px;padding-right:10px;text-align:right;color:var(--text-muted);user-select:none}.cl .c{padding-right:14px}
.cl.hl{background:var(--bg-warning)}.cl.hl .n{color:var(--text-warning);font-weight:600}
.code-msg{padding:12px 14px;font:13px var(--font-sans);color:var(--text-secondary)}
footer{margin-top:28px;font-size:12px;color:var(--text-muted)}
@media (max-width:560px){.cmp{grid-template-columns:1fr}.diagram svg{min-width:600px}td,th{padding:6px 5px}
  /* 參數表在手機上每列疊成一塊：參數、值一行，為什麼、位置各一行 */
  .ptable tr:first-child{display:none}.ptable tr{display:grid;grid-template-columns:1fr 1fr;border-top:0.5px solid var(--border);padding:4px 0}.ptable td{border:0;padding:2px 4px}.ptable td:nth-child(n+3){grid-column:1/-1}}
</style>
</head>

  $("code-body").innerHTML='<div class="code-msg">載入中…</div>';
  if(!dlg.open)dlg.showModal();
  getFile(f).then(ls=>{if(cs.f===f)renderCode(ls)}).catch(()=>{$("code-body").innerHTML=`<div class="code-msg">讀不到原始碼（可能離線）。改到 <a href="${gh(f,l)}" target="_blank" rel="noopener">GitHub</a> 看。</div>`});
}
$("code-full").onclick=()=>{cs.full=!cs.full;getFile(cs.f).then(renderCode)};
$("code-close").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.addEventListener("click",e=>{
  const a=e.target.closest("a.ln");if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;
  e.preventDefault();openCode(a.dataset.f,a.dataset.l);
});
setRoute("req");
</script>
</body>
</html>

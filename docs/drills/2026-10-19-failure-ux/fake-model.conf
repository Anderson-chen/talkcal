# 假的模型：OpenAI 相容的 /v1/chat/completions，每次都回同一句、不叫工具。
# 這次要看的是「失敗時前端長怎樣」，失敗都打在這一跳（stop、pause），回覆內容是什麼不重要；
# 用固定回覆，正常那一步每次都一樣、幾毫秒就回，不必佔 GPU。
server {
    listen 8080;
    location /v1/chat/completions {
        default_type application/json;
        return 200 '{"id":"fake","object":"chat.completion","created":1760000000,"model":"qwen3-8b","choices":[{"index":0,"message":{"role":"assistant","content":"明天目前沒有行程，整天都是空的。"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}}';
    }
}

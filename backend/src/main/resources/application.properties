# 這份是本機開發（./gradlew bootRun）用的設定。
# 容器裡多開 docker profile，application-docker.properties 只寫跟這裡不一樣的幾行，其他沿用這份。

# ── 模型（Spring AI）─────────────────────────────────────────────────
# llama-server 用 OpenAI 的協定，所以用 Spring AI 的 OpenAI 自動組裝 ChatModel，base-url 指向 llama-server。
# base-url 要帶 /v1：OpenAI SDK 直接在後面接 /chat/completions。llama.cpp 也有不帶 /v1 的同名路徑，
# 少了 /v1 在本機不會出錯，換成 OpenAI 就會 404。
# 臨時要指向別台：-Dspring.ai.openai.chat.base-url=... 或環境變數 SPRING_AI_OPENAI_CHAT_BASEURL，都比這裡優先。
# 換成 OpenAI 時：拿掉 base-url、api-key 改用環境變數 SPRING_AI_OPENAI_APIKEY，程式不用改。
spring.ai.openai.chat.base-url=http://127.0.0.1:8080/v1
# llama-server 不檢查 key，但 OpenAI SDK 沒有 key 就不建立 client，所以給一個明顯是假的值
spring.ai.openai.api-key=not-used-by-llama-server
# llama-server 一次只載入一個模型，名稱送什麼都會被忽略；寫實際的名稱，trace 上的 gen_ai.request.model 才看得懂
spring.ai.openai.chat.options.model=qwen3-8b
# 模型在哪裡執行：貼在 token 用量、呼叫模型的延遲和 span 上的 model.backend 標籤（見 ObservationConfiguration）。
# 自己執行的 llama-server（本機、EC2 的 gpu 機型）是 llama-cpp；用 Bedrock 時 compose.bedrock.yaml 改成 bedrock。
# 成本 dashboard 依這個標籤決定 token 要不要算錢：Bedrock 照 token 計價，自己執行的是機器的時薪
talkcal.ai.backend=llama-cpp

# AI 助理每次回覆的上限；抽行程在自己的請求裡另外設 1024。
# 不設的話，模型 thinking 失控時會占住 llama-server 的一個 slot 直到逾時
spring.ai.openai.chat.options.max-tokens=2048

# 逾時跟位址一樣是部署決定：換一張比較慢的 GPU，生成就要等更久。
# 給兩分鐘：Qwen3 的 thinking 會先用掉幾百個看不見的 token，正常的慢不該被當成故障。
# 抽行程跟助理用同一個 ChatModel，也是兩分鐘；有 max-tokens 限制，實際不會等那麼久。
# 每一次呼叫的逾時由 GuardedChatModel.getOptions 用這個值補上，見那裡
spring.ai.openai.chat.timeout=2m
# OpenAI SDK 預設失敗會重試兩次，對本機模型沒有好處：server 沒啟動時，重試只是讓 502 晚三倍才回；
# server 滿載時，重試只會更滿。失敗就讓使用者自己決定要不要再問一次
spring.ai.openai.chat.max-retries=0

# ── 依賴無法回應時：斷路器（circuit breaker）與 bulkhead ──────────────────
# Resilience4j 的 starter 讀這一段：
#   configs.default    每個依賴共用的預設。多一個依賴時先照這組用，不夠才在 instances 底下改
#   instances.<名字>   某個依賴跟預設不一樣的地方。程式依名字取用（ChatModelConfiguration 取 chat-model）
# 名字打錯或沒寫在這裡，starter 會默默用預設值建一個，不會報錯；ResilienceSettingsTest 檢查 chat-model 讀到的是下面的值。
# 之後在 k8s 上改用 service mesh 時，規則還是從這一份來，大致對應 Istio 的 DestinationRule：
#   bulkhead → connectionPool；打開多久 → outlierDetection.baseEjectionTime；失敗判斷 → consecutive5xxErrors；
#   慢呼叫在 mesh 上沒有直接對應，要靠 VirtualService 的逾時。
#
# 預設值依據的實測：助理一輪 p95 約 3 秒（一輪呼叫模型 1～4 次）；
# 每分鐘 60 人、問題隨機混合時，llama-server 的 KV cache 就會滿（見 perf/README.md 的 deploy 那段），所以容量約每秒 1 個。
#
# 斷路器：最近 10 次呼叫裡，至少 5 次有結果、而且一半以上失敗（或太慢）就打開，30 秒內一律直接拒絕。
# 以次數算（COUNT_BASED），不以時間算：這個網站流量很低，最近 60 秒常常一次呼叫都沒有，永遠湊不到門檻。
# 正常時依賴幾乎不失敗，5 次裡壞一半不會是巧合；門檻再低，就是讓更少的失敗決定所有人能不能用，誤判的代價比較大
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
# 打開後等 30 秒再放 2 個請求去試（half-open），成功才關回來，還是失敗就再開 30 秒。
# 30 秒是兩邊的折衷：依賴一直沒恢復時，每 30 秒只有 2 個請求被拿去試；恢復之後，最多 30 秒就能用。
# 模型被擋下時，HTTP 的 Retry-After 也回這個秒數（GuardedChatModel 直接讀這個設定）
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
# 滿了立刻拒絕、不排隊：排隊的請求一樣占著執行緒，等於沒有限制
resilience4j.bulkhead.configs.default.max-wait-duration=0

# 模型（chat-model）跟預設不一樣的地方
resilience4j.circuitbreaker.instances.chat-model.base-config=default
# 一次超過 30 秒（p95 的 10 倍）也算失敗：模型還在回應、但慢到沒人等得下去時也打開。
# 不把上面的 2 分鐘逾時調短：thinking、長回覆偶爾真的要那麼久。逾時是放棄這一次，慢呼叫是整體在變差，兩件事分開設
resilience4j.circuitbreaker.instances.chat-model.slow-call-duration-threshold=30s
# 哪些失敗算模型出錯，見這個類別
resilience4j.circuitbreaker.instances.chat-model.record-failure-predicate=io.github.andersonchen.talkcal.calendar.adapter.shared.ModelFailurePredicate
resilience4j.bulkhead.instances.chat-model.base-config=default
# Tomcat 預設 200 條執行緒，模型卡住（不回應、要等到逾時）時最多占掉四分之一，行程 CRUD 一定有執行緒可用。
# 正常時用不到：每秒 1 個 × 一次約 3 秒 ≈ 同時 3 個（Little's Law），50 是十幾倍的餘裕；只有模型卡住、請求一直累積時才會滿
resilience4j.bulkhead.instances.chat-model.max-concurrent-calls=50
# 模型滿載時建議多久後再試：一般請求幾秒內就回來，位子很快會空出來。Resilience4j 沒有這個設定，是 talkcal 自己的
talkcal.model.busy-retry-after=5s

# OpenAI 的 starter 還會自動建立 embedding、圖片、語音、審核的 model，用不到，關掉
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# PostgreSQL 是 deploy/compose.yaml 的 postgres 服務，對主機開 127.0.0.1:5432。
# 密碼來自環境變數 DB_PASSWORD：本機的 bootRun 從 deploy/.env 讀（範本 .env.example），
# 容器裡由 compose 用 SPRING_DATASOURCE_PASSWORD 覆蓋。沒設時是空字串，連線會被資料庫拒絕。
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/talkcal
spring.datasource.username=talkcal
spring.datasource.password=${DB_PASSWORD:}

# 算「現在」用的時區，「明天」「今天晚上」都從這裡算。行程存的是不帶時區的牆上時間，但「現在」一定要在某個時區裡問。
# 寫明、不用 JVM 預設：JVM 預設跟著機器，本機是台北、容器裡是 UTC，一部署就差八小時。
calendar.zone=Asia/Taipei

# 每次送給模型的對話歷史最多幾輪；一輪怎麼算、舊的怎麼刪，見 JdbcAssistantMemoryRepository 的 keepTurns。
# 這個值沒有量過；留得越多，每個請求的 input token 越多（見 docs/cost.md）
calendar.assistant.memory-turns=10

# ── 資料歸檔 ───────────────────────────────────────────────────────
# 舊資料每天凌晨壓縮後搬到物件儲存，存好了才從資料庫刪。行程只照日期查看、不放回資料庫；對話可以放回來。
#
# 對話超過多久沒再說話就歸檔：「上個月聊到一半」還接得回來，再久就不太可能有人回頭找。
# 前端只記最新那一段，舊的留在表裡也沒有入口
calendar.assistant.retention=30d
# 行程結束超過多久就歸檔：月曆往回翻「去年的這個月」還看得到（最常見的回頭看），更早的很少看，要看就到封存裡查。
# 一筆行程很小，留在線上的成本主要是表和索引越來越大，2 年是很少有人翻到和表不要無限變大之間的折衷。
# 畫面上寫著「結束超過 2 年的行程會自動封存」：改這個值要一起改 web/src/calendar/archive.ts 的 ARCHIVE_YEARS
calendar.event.retention=2y

# 本機是 deploy/compose.yaml 的 RustFS（S3 相容），雲端是 S3（infra/envs/1-ec2/archive.tf）
talkcal.archive.bucket=talkcal-archive
# 空白表示 AWS S3 本身（雲端由 compose.ec2.yaml 改成空白）；本機 bootRun 連 compose 的 RustFS 發佈到主機的埠
talkcal.archive.endpoint=http://127.0.0.1:9100
# RustFS 不看區域，但 S3 的簽章一定要有；雲端改成 bucket 所在的區域
talkcal.archive.region=us-east-1
# 從 deploy/.env 讀（compose 和 bootRun 都讀那份）；空白表示用 SDK 的預設憑證鏈
talkcal.archive.access-key=${ARCHIVE_ACCESS_KEY:}
talkcal.archive.secret-key=${ARCHIVE_SECRET_KEY:}

# 重送是使用者看到失敗再按一次，幾秒到幾分鐘內的事，一天綽綽有餘。超過之後同一個鍵再送會被當成新的一次（見 V13）
calendar.idempotency.retention=1d

# ── 登入 ─────────────────────────────────────────────────────────────
# SameSite=Lax：別的網站用 <form> POST 過來時瀏覽器不帶這個 cookie（擋 CSRF 的第一道），
# 但使用者從別的網站點連結進來時還是登入狀態。HttpOnly 是 Spring Boot 的預設，JavaScript 讀不到，XSS 偷不走。
# Secure（只走 HTTPS）在 EC2 的 compose 裡打開：本機是 http，打開的話瀏覽器不會送回這個 cookie
server.servlet.session.cookie.same-site=lax
# session 存在 app 的記憶體裡，app 重啟（部署新版）所有人都會被登出，只有一台時可以接受；
# 變成多台時要改存在共用的地方（例如 Spring Session JDBC），不然換到另一台就變成沒登入
server.servlet.session.timeout=8h
# client id 有設的 provider 才會出現登入按鈕，都沒設就只有帳密。
# secret 從環境變數讀、不進 repo：本機寫在 deploy/.env，雲端由 Terraform 寫進 SSM、部署時寫成同一份 .env。
# Google Cloud Console、GitHub OAuth App 的回呼網址（Authorized redirect URI / Authorization callback URL）
# 要填瀏覽器實際看到的網址，例如 http://localhost:5173/api/auth/oauth2/callback/google（vite）、18080（deploy/ 的 nginx），
# 雲端是 https://<網站>/api/auth/oauth2/callback/google
talkcal.auth.google.client-id=${GOOGLE_CLIENT_ID:}
talkcal.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
talkcal.auth.github.client-id=${GITHUB_CLIENT_ID:}
talkcal.auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
# 回呼網址用使用者連的網址組成，但 app 前面還有 proxy（雲端是 Caddy（HTTPS）→ nginx → app），app 自己收到的都是 http。
# native 表示由 Tomcat 照 proxy 帶的 X-Forwarded-Proto、X-Forwarded-For 還原；不設的話組出 http://...，跟在 Google 登記的 https:// 對不上。
# Tomcat 只信任內部網段送來的 header（預設 127.x、10.x、172.16–31.x、192.168.x），外面送來的偽造 header 不算
server.forward-headers-strategy=native

# ── 關機 ─────────────────────────────────────────────────────────────
# 收到 SIGTERM（部署新版、docker stop）時先不收新請求，等處理中的做完才關。
# Boot 預設就是 graceful，寫出來是因為要跟下面的等待時間一起看
server.shutdown=graceful
# 預設 30 秒對 AI 助理太短：呼叫一次模型就可能等到 2 分鐘（上面的 spring.ai.openai.chat.timeout）。
# 給 2 分鐘：關機後還要再執行超過 2 分鐘的請求多半是卡住了，再等只是讓部署更久。
# 要跟 deploy/compose.yaml 的 stop_grace_period 一起改：Docker 預設只等 10 秒就送 SIGKILL，處理中的請求會被中斷，
# 這裡設多長都沒用（事故經過見 docs/postmortems/2026-10-12-deploy-cuts-in-flight-requests.md）
spring.lifecycle.timeout-per-shutdown-phase=2m

# 不用 Spring 預設的 8080：llama.cpp 的 server 在 8080，兩邊都用 8080 的話，嵌入式 Tomcat 會因為埠被占用而無法啟動
server.port=8090

# actuator 預設只公開 health；Alloy 要抓 /actuator/prometheus，所以加上 prometheus。
# 不用 "*" 全開：其他端點（env、beans、mappings…）會洩漏內部細節
management.endpoints.web.exposure.include=health,prometheus

# actuator 開在自己的埠，API 的 8090 上沒有 /actuator/*（請求會被當成一般沒登入的請求，回 401）。
# 分開埠，誰連得到就由網路決定，不靠每一層的路徑規則都寫對：deploy/compose.yaml 只把 8090 發佈到主機（18090），
# 8091 不發佈，只有同一個 Docker 網路裡的 Alloy 和容器自己的 healthcheck 連得到；nginx 只轉 /api，就算改成整站轉發，轉的也是 8090。
# 本機 bootRun 時是 localhost:8091/actuator/prometheus。
management.server.port=8091

# 健康檢查分成兩種（Spring Boot 的 health groups，Boot 4 預設就有）：
#   /actuator/health/liveness   程序還活著嗎？答「否」就重啟。只看 app 自己、不看資料庫：資料庫無法連線時重啟 app 也沒用，
#                               還會讓所有副本一起重啟循環（ActuatorPortTest 檢查）
#   /actuator/health/readiness  現在能接請求嗎？答「否」就先不導流量。啟動完成前、關機等請求做完時都會答「否」
#   /actuator/health            全部加總，含資料庫連線，給人看
# compose 的 healthcheck 用 readiness：Docker 不會因為 unhealthy 重啟容器，只拿 healthcheck 決定 depends_on、
# cd/apply.sh 的 --wait 什麼時候算部署好，那是 readiness 的語意。liveness 留給會重啟容器的平台（k8s、ECS）。
# 不開 management.endpoint.health.probes.add-additional-paths：會在 API 埠上多開 /livez、/readyz，健康檢查又回到對外的埠。

# 預設的 http.server.requests 只有平均和 max，平均會把長尾藏起來；壓測要看的是 p95、p99，
# 要有 histogram buckets 才能在 Mimir 用 histogram_quantile() 算。只對這一個指標開，全開的話指標量太大。
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# 多兩個剛好落在 SLO 延遲門檻上的 bucket（docs/slo.md）：一般 API 300ms、跟助理說話 8 秒。
# 延遲 SLI 是比門檻快的請求占幾成，直接數 le="0.3"、le="8.0" 的 bucket 就是精確值；
# 不加的話預設 bucket 的邊界是 0.268、0.358…，門檻落在兩格中間只能估。
# 改 SLO 門檻時這裡和 ops/mimir/rules/anonymous/slo.yaml 要一起改
management.metrics.distribution.slo.http.server.requests=300ms,8s

# ── trace ──────────────────────────────────────────────────────────
# OpenTelemetry 的 service.name。不設的話 Tempo 上顯示成 unknown_service:java
spring.application.name=talkcal

# 每個請求都記 trace、全部送出（預設只記 10%），取樣在 ops/ 的 Alloy 做（tail sampling）：
# 這裡在請求一進來就要決定，那時還不知道請求會不會出錯、會不會慢，這裡丟掉的 trace，Alloy 也撈不回來。
# 雲端只留幾 %，見 ops/README.md 的「Trace 取樣」。
management.tracing.sampling.probability=1.0

# span 用 OTLP（HTTP）送到 ops/ 的 Alloy，由 Alloy 轉給 Tempo：換儲存只改 Alloy，app 不必重新部署。
# 本機 bootRun 時 Alloy 在主機的 4318（ops/compose.yaml 發佈的）；容器裡由 docker profile 改成服務名稱。
# ops/ 沒有啟動時送不出去，只會在 log 印 warning，不影響請求本身。
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# datasource-micrometer 預設開三種 span：拿連線（connection）、執行 SQL（query）、讀結果（result-set）。
# 留前兩種：connection 的長度就是在連線池排隊多久，分得出慢在等連線還是 SQL 本身；
# result-set 每讀一批就一個 span，一次查詢多出好幾個，資料量這麼小時只是雜訊。
jdbc.includes=connection,query
# SQL 的參數值不放進 span：那是使用者的行程標題、對話內容，trace 不該變成另一個存個資的地方。
# 這也是預設值，寫出來是提醒不要為了方便查問題而打開
jdbc.datasource-proxy.include-parameter-values=false

# Swagger UI 在 http://localhost:8090/swagger-ui.html，機器讀的文件在 /v3/api-docs，路徑都用 springdoc 預設值。
# 打開「Try it out」：預設要先按一下才能填參數送請求
springdoc.swagger-ui.try-it-out-enabled=true

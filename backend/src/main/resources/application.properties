# 預設的設定 = 本機開發（./gradlew bootRun 跑在 Windows 上）。
# 容器裡會多開 docker 這個 profile，application-docker.properties 只寫「跟這裡不一樣」的那幾行，
# 其他沿用這裡——profile 檔是覆蓋，不是整份重抄。

# ── 模型（Spring AI）─────────────────────────────────────────────────
# llama-server 講 OpenAI 的協定，所以用 Spring AI 的 OpenAI 那一套自動組裝 ChatModel，
# base-url 指過去就好。本機開發時它在 127.0.0.1（原生 .bat 或 deploy/ 的容器發佈出來的埠都一樣）。
# base-url 要帶 /v1：OpenAI SDK 是在後面直接接 /chat/completions。llama.cpp 剛好也有不帶 /v1 的同名別名，
# 少了 /v1 不會出錯，但換成真的 OpenAI 就會 404。
# 臨時要指到別台：-Dspring.ai.openai.chat.base-url=... 或環境變數 SPRING_AI_OPENAI_CHAT_BASEURL，都比這裡優先。
# 哪天換成真的 OpenAI：拿掉 base-url、api-key 改用環境變數 SPRING_AI_OPENAI_APIKEY，程式一行都不用改。
spring.ai.openai.chat.base-url=http://127.0.0.1:8080/v1
# llama-server 不檢查 key，但 OpenAI SDK 沒有 key 就不肯建 client，給一個明顯是假的值
spring.ai.openai.api-key=not-used-by-llama-server
# 模型名稱：llama-server 一次只載一顆，送什麼都會被忽略。寫真名是為了 trace 上的 gen_ai.request.model 看得懂
spring.ai.openai.chat.options.model=qwen3-8b

# 生成上限：AI 助理每次回覆最多 2048 tokens（抽行程在自己的請求裡另外設 1024）。
# 不設的話，模型 thinking 暴走時會佔住一個 slot 直到逾時（壓測時遇過）
spring.ai.openai.chat.options.max-tokens=2048

# 逾時。跟位址一樣是部署決定（換一張比較慢的 GPU，生成就要等更久），所以放設定檔。
# 生成給兩分鐘：Qwen3 的 thinking 會先燒掉幾百個看不見的 token，不讓正常的慢被誤判成故障。
# 抽行程跟助理共用同一個 ChatModel，所以也是兩分鐘（以前它自己一個 RestClient、30 秒）；有 max-tokens 擋著，不會真的等那麼久
spring.ai.openai.chat.timeout=2m
# OpenAI SDK 預設失敗會重試兩次。對本機模型沒好處：server 沒開，重試只是讓 502 晚三倍才回；
# server 塞爆，重試只是讓它更塞。失敗就讓使用者自己決定要不要再問一次
spring.ai.openai.chat.max-retries=0

# OpenAI 那套 starter 還會自動建 embedding、圖片、語音、審核的 model —— 用不到，關掉免得多出用不到的 bean
# （embedding 以前給 RAG 用，RAG 拿掉之後就沒有人要了）
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# AI 助理的對話記憶和行程存在 PostgreSQL（deploy/compose.yaml 的 postgres 服務，對主機開 127.0.0.1:5432）。
# 密碼不寫在這裡：從環境變數 DB_PASSWORD 來 —— 本機的 bootRun 從 deploy/.env 讀進來（範本 .env.example），
# 容器裡由 compose 用 SPRING_DATASOURCE_PASSWORD 直接蓋掉。沒設時是空字串，連線會被資料庫拒絕。
# 啟動時 Flyway 會先跑 db/migration 底下還沒跑過的 SQL，把表建好或升級。
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/talkcal
spring.datasource.username=talkcal
spring.datasource.password=${DB_PASSWORD:}

# 行事曆問「現在幾點」用的時區（「明天」「今天晚上」都從這裡算）。
# 行程本身存的是不帶時區的牆上時間，但「現在」一定得在某個時區裡問。
# 寫明而不用 JVM 預設：預設跟著機器走，本機是台北、容器裡是 UTC，不寫的話一部署就差八小時。
calendar.zone=Asia/Taipei

# AI 助理的對話超過多久沒再說話就刪掉（每天凌晨四點清一次，見 AssistantMemoryCleanup）。
# 30 天：「上個月聊到一半」還接得回來，再久就不太可能有人回頭找了。寫在這裡，要改不必動程式
calendar.assistant.retention=30d

# ── 認證（#11）─────────────────────────────────────────────────────────
# 用哪一套登入方式：目前只有 local = 自己的帳密（account 表），加上有設定的 Google、GitHub；本機、雲端都是這套（#127）。
# app.config 依它組裝 SecurityFilterChain，業務程式不知道是哪一套。原本規劃雲端改接 Cognito（#106），決定不做了
talkcal.auth.provider=local
# 登入狀態放在 session cookie。SameSite=Lax：別的網站用 <form> POST 過來時瀏覽器不帶這個 cookie（CSRF 的第一道），
# 但使用者從別的網站點連結進來時還是登入狀態。HttpOnly 是 Spring Boot 的預設：JavaScript 讀不到，XSS 偷不走。
# Secure（只走 HTTPS）在 EC2 的 compose 裡打開：本機是 http，打開的話瀏覽器不會送回這個 cookie
server.servlet.session.cookie.same-site=lax
# 多久沒動作就要重新登入。Spring Session JDBC 也照這個值（沒另外設 spring.session.timeout 就讀這個）
server.servlet.session.timeout=8h
# session 存 PostgreSQL 的 spring_session 表（#20），不存 app 的記憶體：零停機部署時新舊兩個 app 同時接請求
# （deploy/README.md「零停機部署與 canary」），存在記憶體的話請求換到另一個 app 就變成沒登入，每次部署也會把所有人登出。
# 表由 Flyway 建（V15__spring_session.sql），不讓 Spring Session 自己建：schema 只有一個人管，跟其他表一樣有版本紀錄
spring.session.jdbc.initialize-schema=never
# cookie 名稱沿用 servlet 容器原本的 JSESSIONID（Spring Session 預設是 SESSION）：
# 前端不讀這個 cookie，但 k6（perf/lib/assistant.js）和系統測試認這個名字，換名字只是多改幾個地方、沒有好處
server.servlet.session.cookie.name=JSESSIONID
# 用 Google、GitHub 帳號登入（#105，provider=local 時才有）。client id 有設的才會出現登入按鈕，都沒設就只有帳密。
# secret 不寫在這裡也不進 repo：從環境變數接 —— 本機寫在 deploy/.env（#123），雲端由 Terraform 寫進 SSM、部署時變成同一份 .env（#127）。
# 在 Google Cloud Console、GitHub 的 OAuth App 設定裡，回呼網址（Authorized redirect URI / Authorization callback URL）
# 要填瀏覽器實際看到的網址，例如 http://localhost:5173/api/auth/oauth2/callback/google（vite）、18080（deploy/ 的 nginx），
# 雲端是 https://<網站>/api/auth/oauth2/callback/google
talkcal.auth.google.client-id=${GOOGLE_CLIENT_ID:}
talkcal.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
talkcal.auth.github.client-id=${GITHUB_CLIENT_ID:}
talkcal.auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
# 回呼網址是用「使用者原本連的網址」組的，但 app 前面還有 proxy：雲端是 Caddy（HTTPS）→ nginx → app，
# app 自己看到的永遠是 http。native = 交給 Tomcat 照 proxy 帶的 X-Forwarded-Proto、X-Forwarded-For 還原（#127），
# 不然組出來的是 http://...，跟在 Google 登記的 https:// 對不上。
# 只信任內部網段來的 header（Tomcat 預設：127.x、10.x、172.16–31.x、192.168.x），外面送來的偽造 header 不算
server.forward-headers-strategy=native

# ── 關機 ─────────────────────────────────────────────────────────────
# 收到 SIGTERM（部署換新版、docker stop）時：先不收新請求，等手上的做完才關。
# Boot 預設就是 graceful，寫出來是因為下面的等待時間要跟它一起看。
server.shutdown=graceful
# 最多等多久。預設 30 秒，對 AI 助理太短：一次叫模型就可能等到 2 分鐘（上面的 spring.ai.openai.chat.timeout）。
# 給 2 分鐘：一個請求在關機後還要再跑超過 2 分鐘，多半是卡住了，再等下去只是讓部署更久。
# 要跟 deploy/compose.yaml 的 stop_grace_period 一起改：Docker 等不夠久，這裡設多長都沒用，時間一到就被 SIGKILL。
# 2026-10-12 邊壓邊部署時，Docker 只等 10 秒就送 SIGKILL，處理中的 9 個請求被砍斷（見 docs/postmortems/）
spring.lifecycle.timeout-per-shutdown-phase=2m

# 換掉 Spring 預設的 8080 —— llama.cpp 的 server 就常駐在 8080，
# 兩邊都用 8080 的話，嵌入式 Tomcat 會因為埠被佔用而啟動失敗。
# 我們自己的 HTTP 入口挪到 8090，讓出 8080 給模型伺服器。
server.port=8090

# actuator 預設只把 health 這一個端點露到 web 上，其他（含 prometheus）都藏著。
# 這裡明確把 prometheus 也放出來，ops/ 的 Alloy 才抓得到 /actuator/prometheus。
# 只露這兩個、不用 "*" 全開：其他端點（env、beans、mappings…）會洩漏內部細節，學習環境也沒必要全開。
management.endpoints.web.exposure.include=health,prometheus

# 讓 HTTP 請求延遲多吐一組直方圖（histogram buckets）。
# 預設的 http.server.requests 是 Timer，只有「平均」和「max」——但平均會把長尾藏起來，
# 壓測真正要看的是 p95/p99（100 個請求裡最慢那幾個），那需要 buckets 才能在 Mimir 用
# histogram_quantile() 算出來。只對這一個指標開，不全開，免得指標量爆掉。
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── trace ──────────────────────────────────────────────────────────
# trace 上的服務名稱（OpenTelemetry 的 service.name）。不設的話 Tempo 上會顯示成 unknown_service:java
spring.application.name=talkcal

# 每個請求都記 trace。預設只記 10%：正式環境流量大，全記太貴，抽樣就夠看出趨勢；
# 學習環境一次只有幾個請求，抽樣會讓你找不到剛剛那一筆，所以全記。
management.tracing.sampling.probability=1.0

# span 用 OTLP（HTTP）送到 ops/ 的 Alloy，由 Alloy 轉給 Tempo —— app 不直接認識 Tempo，
# 換儲存（Tempo → 別家）只改 Alloy，app 不必重新部署。
# 本機 bootRun 時 Alloy 在主機的 4318（ops/compose.yaml 發佈出來的）；容器裡由 docker profile 改成服務名稱。
# ops/ 沒起時送不出去，只會在 log 印 warning，不影響請求本身。
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Swagger UI：http://localhost:8090/swagger-ui.html ；機器讀的文件在 /v3/api-docs。
# 路徑都用 springdoc 預設值，不另外改 —— 大家都認得這兩個網址。
# 這裡只打開「Try it out」：預設要先按一下才能填參數送請求，學習時每次都多點一下很煩。
springdoc.swagger-ui.try-it-out-enabled=true

# app 在容器裡執行時的設定（deploy/compose.yaml 用 SPRING_PROFILES_ACTIVE=docker 打開），只寫跟 application.properties 不一樣的地方。

# 其他容器都用 compose 的服務名稱連，不用 127.0.0.1：容器裡的 127.0.0.1 是這個容器自己。
# 同一個 compose 的容器在同一個網路上，Docker 內建的 DNS 會把服務名稱解析成容器的 IP，容器重建、IP 換了也連得到。
# 埠是容器內部的埠，跟有沒有發佈到主機、發佈成幾號無關。
spring.ai.openai.chat.base-url=http://llm-chat:8080/v1

# log 印成一行一個 JSON（ECS 格式）：Loki 可以用 `| json` 直接拆出 level、logger、message 等欄位，不必寫 regex。
# 本機開發不開，在終端機看 JSON 很難讀
logging.structured.format.console=ecs

# ops/ 的 Alloy 有加入 deploy/ 的網路，所以用服務名稱 alloy 連得到
management.opentelemetry.tracing.export.otlp.endpoint=http://alloy:4318/v1/traces

spring.datasource.url=jdbc:postgresql://postgres:5432/talkcal

# 同一個 compose 裡的 RustFS，不經過主機的埠
talkcal.archive.endpoint=http://archive:9000

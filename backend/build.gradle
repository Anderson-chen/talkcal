import com.github.jk1.license.ProjectData
import com.github.jk1.license.filter.DependencyFilter
import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.InventoryHtmlReportRenderer
import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'org.springframework.boot' version '4.1.1'
    id 'net.ltgt.errorprone' version '5.1.1'
    // 檢查打包進 jar 的依賴沒有 GPL、AGPL 這類授權，設定在檔案最後
    id 'com.github.jk1.dependency-license-report' version '3.1.4'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        // 不用執行 Gradle 的那個 JVM 編譯，換機器、換 IDE 編出來都一樣。
        // 改版本時 Dockerfile 的 build 映像檔（gradle:…-jdk25）要一起改，不然容器裡會另外下載 JDK
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // 用 Gradle 內建的 platform() 匯入 BOM，不用 io.spring.dependency-management 外掛：那個外掛在 Gradle 9 上會呼叫已移除的 API。
    // BOM 座標從 Boot 外掛取，升 Boot 只改 plugins 那一行
    implementation platform(SpringBootPlugin.BOM_COORDINATES)

    // 蓋過 Boot BOM 帶的 Tomcat、Jackson 版本，修 ci/vulns.sh 掃到的漏洞：同一個套件有兩個版本要求時，Gradle 挑高的。
    // 只升 patch，行為不變。Boot 的 BOM 追上這些版本之後，這段整段刪掉。
    // Jackson 2、3 都要。Boot 4 用 Jackson 3，套件是 tools.jackson；Spring AI、springdoc 還在用 Jackson 2，套件是 com.fasterxml
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.3')
    implementation platform('tools.jackson:jackson-bom:3.1.7')
    constraints {
        // Tomcat 沒有發 BOM，三個模組各自寫，版本要一致
        ['tomcat-embed-core', 'tomcat-embed-el', 'tomcat-embed-websocket'].each {
            implementation("org.apache.tomcat.embed:${it}:11.0.27")
        }
    }

    // Boot 4 把 starter-web 改名成 starter-webmvc，舊名字還在但已經 deprecated
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Spring AI 自己發版，BOM 跟 Boot 的分開；2.0.x 是對 Boot 4.1 編的
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    // 本機的 llama-server 和雲端的 Bedrock 都支援 OpenAI 的 chat completions API，換後端只改 spring.ai.openai.* 設定。
    // 底層是 openai-java SDK（OkHttp），不走 RestClient：呼叫模型時沒有 http.client.requests 指標，
    // 指標和 span 來自 Spring AI 的 gen_ai.* 觀測
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // 斷路器、bulkhead 的規則寫在 application.properties 的 resilience4j.*，starter 照設定建 registry、註冊 Micrometer 指標。
    // 不用 Spring Cloud Circuit Breaker：那是在 Resilience4j 外面再包一層抽象，還多一套 release train 要追。
    // 不用 resilience4j-bom：2.4.0 的 BOM 沒有 spring-boot4 模組，所以版號在這裡寫一次
    def resilience4j = '2.4.0'
    implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4j}"
    // 程式直接用 CircuitBreaker、Bulkhead 型別，明寫出來，不靠 starter 間接帶進來
    implementation "io.github.resilience4j:resilience4j-circuitbreaker:${resilience4j}"
    implementation "io.github.resilience4j:resilience4j-bulkhead:${resilience4j}"

    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 只當 OAuth2 client（用 Google、GitHub 帳號登入），不當 authorization server，也不驗別人發的 JWT
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // 用 JdbcClient 自己寫 SQL，不用 JPA：JPA 要在 domain 物件上加 @Entity，或另外維護一套 entity 再對映
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Flyway 對 PostgreSQL 的支援是獨立模組，少了這個模組 Flyway 無法連 PostgreSQL
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // 歸檔放 S3 相容的物件儲存（雲端 S3、本機 RustFS），兩邊只差 endpoint。
    // 排掉 netty-nio-client：只用同步的 S3Client，用不到 async 的那套，少 10 MB 依賴、少一份要追的漏洞
    implementation platform('software.amazon.awssdk:bom:2.55.16')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 提供 /actuator/prometheus 給 ops/ 的 Alloy 抓取。程式碼沒有 import，所以 runtimeOnly
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // trace 用 OTLP 推給 ops/ 的 Alloy，由下面三個依賴分段處理：
    //   spring-boot-micrometer-tracing-opentelemetry：Boot 的自動設定，建 tracer、讀 management.* 屬性
    //   micrometer-tracing-bridge-otel：把 Micrometer 的 Observation 翻成 OpenTelemetry 的 span，程式碼只 import Micrometer
    //   opentelemetry-exporter-otlp：把 span 用 OTLP 送出去
    // 不用 spring-boot-starter-opentelemetry：那個 starter 還會帶進 micrometer-registry-otlp，讓 app 另外推一份指標，
    // 跟 Alloy 抓的那份重複
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    runtimeOnly 'io.micrometer:micrometer-tracing-bridge-otel'
    runtimeOnly 'io.opentelemetry:opentelemetry-exporter-otlp'
    // 每條 SQL 一個 span：Spring 會替 HTTP 請求和呼叫模型開 Observation，JDBC 不會，少了這個 trace 上分不出時間花在模型還是資料庫。
    // 不在 Boot 的 BOM 裡，版號自己寫；2.x 對應 Boot 4
    runtimeOnly 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.3.0'
    // 改用 OpenTelemetry 的資料庫屬性名稱（db.system.name 等）。Tempo 的 service map 靠 db.system.name 畫出 postgresql 節點
    // （見 ops/tempo/tempo.yaml）；只有預設的 peer.service 的話，值是資料庫名稱 talkcal，圖上會變成 talkcal 自己連自己
    runtimeOnly 'net.ttddyy.observation:datasource-micrometer-opentelemetry:2.3.0'

    // 不在 Boot 的 BOM 裡，版號自己寫；主版號跟著 Boot 走，3.x 配 Boot 4。
    // 不是 runtimeOnly：controller 要 import @Operation 這些註解
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // 版本由 Boot 的 BOM 管（JUnit 6）。不另外釘 junit-bom：兩份 BOM 時 Gradle 挑高的，寫低的版號看起來有效、其實沒作用
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // 少了這個 Gradle 找不到測試引擎
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // 會連帶拉進 Mockito，但測試一律手寫假物件，不用 mock 框架
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 把 @WebMvcTest、@AutoConfigureMockMvc 從 starter-test 拆出來，用到哪一層的切片就引哪一層的 test starter
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // MockMvc 的 with(user(...))、with(csrf())，Boot 4 一樣拆成自己的 test starter
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // 測試裡照樣產生 trace id、但不往外送：少了這個，啟動整個 Spring 的測試會一直嘗試送 span 到 localhost:4318
    testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'

    // net.ltgt.errorprone 外掛把 Error Prone 加到每個 JavaCompile 上（main、test、integrationTest、eval）。選型理由見 ci/README.md 的「lint」
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // 只用預設（ERROR 讓編譯失敗、WARNING 只印出來），沒開 -Werror 的理由見 ci/README.md 的「lint」
        disableWarningsInGeneratedCode = true
    }
}

// 不寫的話 javac 用平台預設編碼，Windows 上是 cp950，中文會變成亂碼
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// compose 會自己讀 deploy/.env，bootRun 不會，所以在這裡讀進來當成環境變數，兩邊用同一份。
// 主機上已經有同名的環境變數就用主機的，跟 compose 的優先順序一樣。
// 沒有 DB_PASSWORD 就先停下來：不然 app 用空密碼去連，只看得到「password authentication failed」，看不出要補什麼
tasks.named('bootRun') {
    def dotenv = file('../deploy/.env')
    doFirst {
        if (!dotenv.exists()) {
            throw new GradleException('找不到 deploy/.env：cp deploy/.env.example deploy/.env，再填 DB_PASSWORD（見 deploy/README.md）')
        }
        def values = [:]
        dotenv.eachLine('UTF-8') { line ->
            def text = line.trim()
            int eq = text.indexOf('=')
            if (text && !text.startsWith('#') && eq > 0) {
                // compose 接受用引號包住值，這裡也把引號拿掉
                values[text.substring(0, eq).trim()] = text.substring(eq + 1).trim().replaceAll(/^(["'])(.*)\1$/, '$2')
            }
        }
        if (!(System.getenv('DB_PASSWORD') ?: values['DB_PASSWORD'])) {
            throw new GradleException('deploy/.env 沒有填 DB_PASSWORD（舊的 postgres volume 是用 talkcal 建的，見 deploy/.env.example）')
        }
        values.each { name, value ->
            if (System.getenv(name) == null) {
                environment name, value
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// 要啟動容器或連真模型的測試放在自己的 source set，不用 @Tag 過濾：./gradlew test 只執行單元測試，幾秒就結束。
// IntelliJ 照 source set 決定按 ▶ 時執行 :test 還是 :integrationTest，不必另外設定
testing {
    suites {
        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
                // 用真的 PostgreSQL，不用 H2：SQL 方言不同（例如 ON CONFLICT），H2 上通過不代表 PostgreSQL 會通過。
                // 測試怎麼共用容器見 TestPostgres
                implementation 'org.testcontainers:testcontainers-postgresql'
                implementation 'org.testcontainers:testcontainers-junit-jupiter'
            }
            targets.configureEach {
                testTask.configure {
                    // 兩個都執行時先執行快的，單元測試失敗時不必等整合測試結束才知道
                    shouldRunAfter tasks.named('test')
                    // Gradle 不會把自己的系統屬性傳進測試 JVM，llama-server 在哪要從環境變數接過去。
                    // ci/run.sh 在容器裡執行測試，127.0.0.1 是容器自己，靠這個指到主機上的模型
                    def llmBaseUrl = providers.environmentVariable('SPRING_AI_OPENAI_CHAT_BASEURL')
                    if (llmBaseUrl.isPresent()) {
                        systemProperty 'spring.ai.openai.chat.base-url', llmBaseUrl.get()
                    }
                    testLogging {
                        events 'passed', 'skipped', 'failed'
                    }
                }
            }
        }
    }
}

// AI 品質回歸：固定題目送給真模型、替輸出計分、跟基準線比。執行一次要好幾分鐘，所以不放在 integrationTest 裡，免得拖慢 pre-push。
// 改 prompt、換模型時手動執行 ./gradlew eval，報告在 build/eval/report.md
testing {
    suites {
        eval(JvmTestSuite) {
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter tasks.named('integrationTest')
                    // eval 量的是模型輸出的品質，不是程式有沒有被執行到（見 docs/test-coverage.md）
                    jacoco { enabled = false }
                    // 程式沒變，結果也可能因為換了模型而變，所以不沿用上次的結果
                    outputs.upToDateWhen { false }
                    // 沒設這些環境變數就用 application.properties 的本機 llama-server；要評雲端模型就三個都設
                    ['SPRING_AI_OPENAI_CHAT_BASEURL': 'spring.ai.openai.chat.base-url',
                     'SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL': 'spring.ai.openai.chat.options.model',
                     'SPRING_AI_OPENAI_APIKEY': 'spring.ai.openai.api-key'].each { env, property ->
                        def value = providers.environmentVariable(env)
                        if (value.isPresent()) {
                            systemProperty property, value.get()
                        }
                    }
                    systemProperty 'eval.reportDir', layout.buildDirectory.dir('eval').get().asFile.absolutePath
                    testLogging {
                        events 'passed', 'skipped', 'failed'
                    }
                }
            }
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    evalImplementation.extendsFrom testImplementation
    evalRuntimeOnly.extendsFrom testRuntimeOnly
}

// 單元測試和整合測試合併成一份覆蓋率報告：./gradlew test integrationTest jacocoTestReport。
// 為什麼合併、為什麼不設門檻見 docs/test-coverage.md
jacoco {
    // 0.8.14 起才支援 Java 25 的 class 檔。不寫的話用 Gradle 內建的版本，升 Gradle 時會跟著變
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport', JacocoReport) {
    // 傳 task，不寫死 exec 檔的路徑：Gradle 照 task 的設定找檔案，加上的是 mustRunAfter 不是 dependsOn，
    // 所以只執行 ./gradlew test jacocoTestReport 時不會連帶啟動整合測試的容器
    executionData tasks.named('integrationTest').get()
    reports {
        // 給 ci/checks.sh 加總：CSV 一個類別一列，比拆 XML 好處理
        csv.required = true
    }
}

tasks.named('check') {
    // ./gradlew build 不執行整合測試和 eval，但要編譯得過：不然改了方法簽名，只有這兩組測試用到的地方壞了也沒人發現
    dependsOn tasks.named('integrationTestClasses')
    dependsOn tasks.named('evalClasses')
}

application {
    mainClass = 'io.github.andersonchen.talkcal.Application'
}

// 部署步驟只寫在 cd/apply.sh（見 cd/README.md），下面幾個 task 是本機的捷徑。
//
// Windows 上不能直接寫 'bash'：PATH 裡第一個 bash 是 C:\Windows\System32\bash.exe，那是 WSL，
// WSL 裡沒有能執行這些 script 的 distro 就會失敗。所以用 git --exec-path 查 Git 的安裝位置：
// --exec-path 是 <Git>/mingw64/libexec/git-core，往上三層是安裝目錄。
// 找不到時：./gradlew deploy -PbashPath=<bash.exe 的路徑>
def bashPath = providers.gradleProperty('bashPath').orElse(providers.provider {
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) return 'bash'
    def gitCore = providers.exec { commandLine 'git', '--exec-path' }.standardOutput.asText.get().trim()
    new File(gitCore).parentFile.parentFile.parentFile.toPath().resolve('bin/bash.exe').toString()
})

// 等 healthy 的上限（秒），不給就用 cd/apply.sh 裡各服務的預設：./gradlew deployApp -PdeployWaitTimeout=600
def deployWaitTimeout = providers.gradleProperty('deployWaitTimeout')

def registerDeploy = { String name, String service, String desc ->
    tasks.register(name, Exec) {
        group = 'deployment'
        description = desc
        workingDir = layout.projectDirectory.dir('..')
        commandLine bashPath.get(), 'cd/apply.sh', 'local', service
        if (deployWaitTimeout.present) environment 'WAIT_TIMEOUT', deployWaitTimeout.get()
    }
}

// Dockerfile 只打包、不執行測試，手動部署前的測試放在這裡。趕時間可以 ./gradlew deployApp -x test
registerDeploy('deployApp', 'app', '跑測試、build app 映像檔、換掉 deploy/ 的 app 容器，等它 healthy')
tasks.named('deployApp') { dependsOn tasks.named('test') }

// 不用 dependsOn 型別檢查：web/Dockerfile 的 pnpm run build 會檢查，型別錯了映像檔就 build 不出來
registerDeploy('deployWeb', 'web', 'build 前端映像檔（含型別檢查）、換掉 deploy/ 的 web 容器，等它 healthy')

// 升級 llama.cpp、調 compose 裡的模型參數之後用。不放進 deploy：映像檔重 build 約十分鐘，換的期間所有請求都會失敗
registerDeploy('deployModels', 'llm-chat', '重 build llama-server 映像檔、換掉 deploy/ 的模型容器，等它載好模型（healthy）')

// 用 mustRunAfter 排順序，不用 dependsOn：單獨執行 deployWeb 時才不會連 app 一起部署
tasks.register('deploy') {
    group = 'deployment'
    description = '依序部署 app 和前端'
    dependsOn 'deployApp', 'deployWeb'
}
tasks.named('deployWeb') { mustRunAfter 'deployApp' }

// 授權的規則、理由、反例見 docs/licenses.md。
// ./gradlew checkLicense 檢查；./gradlew generateLicenseReport 只產清單（build/reports/dependency-license/index.html）

// 只採用套件宣告的授權（POM、jar 的 manifest），不採用 jar 裡附帶的授權檔。外掛預設兩種都算，
// 而一個套件有好幾個授權時只要一個在允許清單就過：itextpdf 是 AGPL，但 jar 裡附了一份給內嵌元件用的 Apache 授權檔，預設設定會讓 itextpdf 通過
class DeclaredLicensesOnly implements DependencyFilter {
    ProjectData filter(ProjectData data) {
        data.allDependencies.each { it.licenseFiles.clear() }
        data
    }
}

licenseReport {
    // 只看會打包進 bootJar 的。測試、eval 用的依賴不會上線
    configurations = ['runtimeClasspath']
    excludeBoms = true
    // 同一個授權在各家 POM 寫法不一（「Apache 2」「The Apache Software License, Version 2.0」…），先統一名稱，允許清單才不必列每種寫法
    filters = [new DeclaredLicensesOnly(), new LicenseBundleNormalizer()]
    // 允許清單，不是禁止清單：沒看過的授權字串先擋下來讓人看
    allowedLicensesFile = layout.projectDirectory.file('allowed-licenses.json').asFile
    renderers = [new InventoryHtmlReportRenderer('index.html', 'talkcal 後端依賴的授權')]
}

// 外掛的 up-to-date 判斷不可靠：加了 GPL 的依賴、報告也重新產生了，checkLicense 還是 UP-TO-DATE、沿用上次的「通過」。每次重新執行只要幾秒
['generateLicenseReport', 'checkLicense'].each { name ->
    tasks.named(name) { outputs.upToDateWhen { false } }
}
tasks.named('check') { dependsOn tasks.named('checkLicense') }
